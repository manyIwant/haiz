<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f5f0"><title>LAMP · Motion Study V3</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft Yahei",sans-serif;color:#292d32;background:#f7f5f0;font-synthesis:none}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{min-height:100svh;display:grid;place-items:center;background:#f7f5f0;overflow-x:hidden}
.scene{width:min(1120px,100%);min-height:min(100svh,750px);display:grid;grid-template-columns:minmax(0,1.15fr) minmax(290px,.85fr);align-items:center;gap:clamp(20px,3vw,52px);padding:40px clamp(28px,5vw,70px)}
.stage{height:min(68vh,480px);min-height:355px;width:100%;position:relative}canvas{width:100%;height:100%;display:block}
.panel{width:100%;max-width:328px;justify-self:center;position:relative;min-height:300px;display:grid;align-items:center}
.view{grid-area:1/1;opacity:1;transform:translateY(0);transition:opacity .36s ease,transform .46s cubic-bezier(.2,.8,.3,1);width:100%}.view.hidden{pointer-events:none;opacity:0;transform:translateY(12px);visibility:hidden;transition:opacity .28s ease,transform .28s ease,visibility 0s .28s}
h1{font-size:31px;letter-spacing:-.045em;font-weight:600;line-height:1.2;margin:0 0 31px}
.field{position:relative;margin-bottom:20px;padding-top:9px}.field label{display:block;color:#8c8e90;font-size:13px;margin-bottom:8px;transition:color .2s}.field:focus-within label{color:#292d32}
.field input{border:0;border-bottom:1px solid #cfcdc8;width:100%;outline:0;background:transparent;border-radius:0;padding:3px 30px 12px 0;color:#292d32;font:400 15px/1.5 inherit;font-size:15px;transition:border-color .18s}.field input:focus{border-color:#292d32;border-bottom-width:1.5px}.field input:disabled{opacity:.5}
input::placeholder{color:#b2b1ad}.eye{position:absolute;right:0;bottom:8px;border:0;background:transparent;color:#8c8e90;padding:5px;cursor:pointer;display:grid;place-items:center}.eye svg{width:18px;height:18px}
#error{min-height:29px;padding-top:2px;padding-bottom:6px;font-size:12px;color:#ae6154;line-height:1.45}.action{width:100%;height:52px;border:0;border-radius:9px;color:#fff;background:#292d32;font:500 14px inherit;font-size:14px;cursor:pointer;transition:background .2s,transform .2s}.action:hover{background:#41464b}.action:active{transform:scale(.985)}.action:disabled{cursor:wait;opacity:.75}.action:focus-visible,.eye:focus-visible,.secondary:focus-visible{outline:2px solid #ab8652;outline-offset:4px}.secondary{width:100%;height:52px;border:1px solid #cfcdc8;border-radius:9px;color:#292d32;background:transparent;font:500 14px inherit;font-size:14px;cursor:pointer;transition:background .2s}.secondary:hover{background:#eeece6}
.username{font-size:14px;color:#8c8e90;margin:-15px 0 35px;overflow-wrap:anywhere}.success h1{margin-bottom:30px}
@media(max-width:780px){body{display:block}.scene{min-height:100svh;grid-template-columns:1fr;gap:0;align-content:start;padding:24px 28px 56px}.stage{height:clamp(285px,47svh,375px);min-height:0;margin-bottom:5px}.panel{min-height:320px;max-width:365px;align-self:start}.view h1{margin-bottom:23px}.field{margin-bottom:14px}}
@media(max-width:370px){.scene{padding-inline:22px}.stage{height:285px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition-duration:.01ms!important}}
.demo-note{font-size:11px;color:#a1a09a;text-align:center;margin:15px 0 0;line-height:1.5}

/* Only a small functional label distinguishes this preview from the existing live site. */
.lab-nav{position:fixed;z-index:9;top:22px;left:clamp(23px,5vw,66px);right:clamp(23px,5vw,66px);display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:11px;letter-spacing:.065em;color:#949a98;pointer-events:none}
.lab-nav a{pointer-events:auto;color:#606b69;text-decoration:none;border-bottom:1px solid #c9d0cb;padding:4px 0}
.lab-nav a:hover{color:#2e3935;border-color:#5b6963}
.lab-nav a:focus-visible{outline:2px solid #ac8657;outline-offset:4px}
.lab-actions{display:flex;gap:10px}.lab-actions .secondary{height:50px}.lab-actions .secondary:first-child{flex:1}.lab-actions .secondary:last-child{flex:1}
@media(max-width:780px){.lab-nav{position:relative;top:auto;left:auto;right:auto;padding:18px 26px 0}}
</style>
</head>
<body>
<nav class="lab-nav" aria-label="实验页面导航"><span>动作实验 · V3</span><a href="../">返回原版</a></nav>
<main class="scene">
<section class="stage" role="img" aria-label="极简银白色台灯，输入时转头观察，登录演示成功后抬头点亮"><canvas id="lamp"></canvas></section>
<section class="panel" aria-live="polite">
<form id="login" class="view" novalidate autocomplete="off">
<h1>登录</h1>
<div class="field"><label for="user">用户名</label><input id="user" name="demo-username" autocomplete="off" required spellcheck="false"></div>
<div class="field"><label for="password">密码</label><input id="password" name="demo-password" type="password" autocomplete="new-password" required><button class="eye" id="eye" type="button" aria-label="显示密码"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
<div id="error" role="alert"></div><button class="action" id="submit" type="submit">登录</button>
<p class="demo-note">交互演示，请勿填写真实账号密码</p>
</form>
<div class="view hidden success" id="success" aria-hidden="true"><h1>已登录</h1><p class="username" id="who"></p><div class="lab-actions"><button class="secondary" type="button" id="replay">重播动作</button><button class="secondary" type="button" id="logout">退出</button></div></div>
</section>
</main>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('lamp'),stage=canvas.parentElement,ctx=canvas.getContext('2d');
const user=document.getElementById('user'),password=document.getElementById('password'),login=document.getElementById('login'),success=document.getElementById('success'),error=document.getElementById('error'),submit=document.getElementById('submit');
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)');
// Animation-only study. Geometry, shade silhouette and page layout are preserved.
// Local pivots and constant link lengths prevent sliding, stretching and interpenetration.
let targetAttention=0,logged=false,busy=false,logicalW=480,logicalH=430,last=performance.now();
// Three distinct response speeds: lamp head notices first; the two arm joints
// follow only if the user's focus actually stays there. No setTimeout racing.
const attentionHead={x:0,v:0,omega:15.8};
const attentionElbow={x:0,v:0,omega:8.8};
const attentionShoulder={x:0,v:0,omega:5.8};
const rest={shoulder:-1.718,forearm:-.775,shade:-.12};
const finished={shoulder:-1.615,forearm:-1.002,shade:.075};
const properties=['shoulder','forearm','shade'];
const joints={
 shoulder:{x:rest.shoulder,v:0,omega:20.0},
 forearm:{x:rest.forearm,v:0,omega:22.0},
 shade:{x:rest.shade,v:0,omega:17.0}
};
const lightSpring={x:0,v:0,omega:13.0};
const link1=109.2,link2=138.6;
let action=null,actionStart=0,actionDone=null,actionOffsets={},actionStartPose=null,errorNod=0;
const keys={
 in:{
  // Shoulder dips first. The elbow follows, then the head makes its final correction.
  shoulder:[[0,-1.718],[.23,-1.745],[.56,-1.88],[.76,-1.87],[1.13,-1.76],[1.51,-1.565],[1.80,-1.629],[2.14,-1.615]],
  forearm:[[0,-.775],[.22,-.775],[.51,-.699],[.76,-.688],[1.16,-.84],[1.55,-1.079],[1.86,-.984],[2.14,-1.002]],
  shade:[[0,-.12],[.19,-.02],[.53,.265],[.76,.26],[1.14,.135],[1.54,-.072],[1.83,.14],[2.16,.075]]
 },
 out:{
  shoulder:[[0,-1.615],[.24,-1.625],[.63,-1.69],[1.16,-1.718]],
  forearm:[[0,-1.002],[.22,-1.003],[.62,-.86],[1.16,-.775]],
  shade:[[0,.075],[.18,.04],[.64,-.09],[1.16,-.12]]
 }
};
const replayResetSeconds=.74;
const actionDurations={in:2550,out:1500,replay:2550+replayResetSeconds*1000};
const clamp01=v=>Math.max(0,Math.min(1,v));
// Non-stop cubic tangents: intermediate poses preserve velocity; only intentional holds slow down.
function poseCurve(frames,t){
 if(t<=frames[0][0])return frames[0][1];
 const n=frames.length;
 if(t>=frames[n-1][0])return frames[n-1][1];
 let i=0;while(i<n-2&&t>frames[i+1][0])i++;
 const a=frames[i],b=frames[i+1],dt=b[0]-a[0],u=(t-a[0])/dt;
 const velocity=k=>k<=0?0:k>=n-1?0:(frames[k+1][1]-frames[k-1][1])/(frames[k+1][0]-frames[k-1][0]);
 // Hermite basis is C1 between segments; the authored keys determine controlled overshoot.
 const u2=u*u,u3=u2*u;
 return (2*u3-3*u2+1)*a[1]+(u3-2*u2+u)*dt*velocity(i)
        +(-2*u3+3*u2)*b[1]+(u3-u2)*dt*velocity(i+1);
}
// Exact critically-damped response, stable at both 30 and 120 FPS.
function spring(s,goal,dt){
 const w=s.omega, e=Math.exp(-w*dt), delta=s.x-goal, c=s.v+w*delta;
 s.x=goal+(delta+c*dt)*e;
 s.v=(s.v-w*c*dt)*e;
}
function startAction(type,done){
 action=type;actionStart=performance.now();actionDone=done;targetAttention=0;
 const base=type==='out'?finished:rest;
 actionStartPose=Object.fromEntries(properties.map(p=>[p,joints[p].x]));
 actionOffsets={};for(const p of properties)actionOffsets[p]=joints[p].x-base[p];
 if(reduce.matches){
   const dst=type==='out'?rest:finished;
   for(const p of properties){joints[p].x=dst[p];joints[p].v=0}
   lightSpring.x=type==='out'?0:1;lightSpring.v=0;
   action=null;actionDone=null;done?.();paint();
 }
}
function clamp(v){return Math.max(0,Math.min(1,v))}
function ease(t){t=clamp(t);return t*t*(3-2*t)}
// Zero speed and zero acceleration at each end. Avoid a sudden motor command.
function quintic(t){t=clamp(t);return t*t*t*(10+t*(-15+6*t))}
function cubicOut(t){return 1-Math.pow(1-clamp(t),3)}
function ph(b,e){return clamp((phase-b)/(e-b))}
function lerp(a,b,t){return a+(b-a)*t}
function point(x,y){return{x,y}}function add(a,b,k=1){return point(a.x+b.x*k,a.y+b.y*k)}
function grad(x1,y1,x2,y2,stops){let g=ctx.createLinearGradient(x1,y1,x2,y2);for(let s of stops)g.addColorStop(s[0],s[1]);return g}
function rad(x,y,r,stops){let g=ctx.createRadialGradient(x,y,0,x,y,r);for(let s of stops)g.addColorStop(s[0],s[1]);return g}
function ellipse(x,y,rx,ry,fill,stroke=null,lw=1){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function seg(a,b,w){ctx.lineCap='round';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle='#64696b';ctx.lineWidth=w+3;ctx.stroke();ctx.strokeStyle=grad(a.x-12,a.y,b.x+10,b.y,[ [0,'#f8faf8'],[.5,'#c6cbca'],[1,'#969fa0']]);ctx.lineWidth=w;ctx.stroke();let dx=b.x-a.x,dy=b.y-a.y,mag=Math.hypot(dx,dy)||1;ctx.beginPath();ctx.moveTo(a.x+dy/mag*2,a.y-dx/mag*2);ctx.lineTo(b.x+dy/mag*2,b.y-dx/mag*2);ctx.lineWidth=2;ctx.strokeStyle='rgba(255,255,255,.58)';ctx.stroke()}
function joint(a,r){
 // Matte inset fastener: visually flush with the arm, rather than protruding discs.
 // The underlying single pivot remains exact and independent of the decorative cap.
 ellipse(a.x,a.y,r*.66,r*.66,'#a6adab');
 ellipse(a.x-.35,a.y-.65,r*.54,r*.54,rad(a.x-r*.24,a.y-r*.32,r*1.5,[[0,'#f4f6f2'],[.55,'#e2e6e2'],[1,'#adb6b2']]));
 ellipse(a.x,a.y,r*.25,r*.25,'rgba(89,101,100,.34)');
 ellipse(a.x-.5,a.y-.5,r*.085,r*.085,'rgba(255,255,255,.8)');
}
function drawBeam(origin,axis,side,light){if(light<=.001)return;ctx.save();
for(let i=3;i>=0;i--){let sh=33+i*7,eh=94+i*19,end=add(origin,axis,220);let pts=[add(origin,side,-sh),add(origin,side,sh),add(end,side,eh),add(end,side,-eh)];ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let j=1;j<4;j++)ctx.lineTo(pts[j].x,pts[j].y);ctx.closePath();ctx.fillStyle=grad(origin.x,origin.y,end.x,end.y,[[0,`rgba(255,196,115,${light*(i===0?.29:.036)})`],[.6,`rgba(255,206,147,${light*(i===0?.10:.015)})`],[1,'rgba(255,210,143,0)']]);ctx.fill()}
let end=add(origin,axis,220);ctx.save();ctx.translate(end.x,end.y);ctx.scale(1,.38);ellipse(0,0,132,132,rad(0,0,132,[[0,`rgba(255,207,138,${.3*light})`],[.5,`rgba(255,230,186,${.075*light})`],[1,'rgba(255,230,186,0)']]));ctx.restore();ctx.restore()}
function drawShade(head,angle,light){ctx.save();ctx.translate(head.x,head.y);ctx.rotate(angle);ctx.beginPath();ctx.moveTo(-16,-6);ctx.bezierCurveTo(-28,-5,-39,22,-47,47);ctx.quadraticCurveTo(0,67,47,47);ctx.bezierCurveTo(39,22,28,-5,16,-6);ctx.quadraticCurveTo(0,-13,-16,-6);ctx.closePath();ctx.shadowColor='rgba(40,44,45,.17)';ctx.shadowBlur=12;ctx.shadowOffsetY=5;ctx.fillStyle=grad(-48,6,49,45,[[0,'#fff'],[.4,'#e9edeb'],[.72,'#bec5c4'],[1,'#8f989a']]);ctx.fill();ctx.shadowBlur=0;ctx.shadowOffsetY=0;ctx.strokeStyle='rgba(65,70,72,.4)';ctx.lineWidth=1.3;ctx.stroke();ctx.beginPath();ctx.moveTo(-21,-1);ctx.quadraticCurveTo(-34,17,-39,40);ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=3;ctx.stroke();
ellipse(0,48,47,11.5,grad(0,35,0,60,[[0,light>.1?`rgb(${Math.floor(lerp(127,255,light))},${Math.floor(lerp(135,226,light))},${Math.floor(lerp(137,179,light))})`:'#7f8789'],[1,light>.1?'#fff2d5':'#bcc2c1']]),'#777f81',3.1);
ellipse(0,49,11.5,5,`rgb(${Math.floor(lerp(137,255,light))},${Math.floor(lerp(145,248,light))},${Math.floor(lerp(147,226,light))})`);
if(light>.01){ellipse(0,49,36,26,rad(0,49,38,[[0,`rgba(255,247,217,${light*.5})`],[1,'rgba(255,247,217,0)']]))}
ctx.restore()}
function paint(){
 ctx.clearRect(0,0,logicalW,logicalH);
 const hip=point(181,348);
 const elbow=point(hip.x+link1*Math.cos(joints.shoulder.x),hip.y+link1*Math.sin(joints.shoulder.x));
 const head=point(elbow.x+link2*Math.cos(joints.forearm.x),elbow.y+link2*Math.sin(joints.forearm.x));
 const angle=joints.shade.x,light=clamp(lightSpring.x);
 const axis=point(Math.sin(angle),Math.cos(angle)),side=point(Math.cos(angle),-Math.sin(angle));const opening=add(head,axis,49);
 if(light>.001)drawBeam(opening,axis,side,light);
 ctx.beginPath();ctx.moveTo(42,374);ctx.lineTo(438,374);ctx.strokeStyle=light>.15?`rgb(${Math.floor(lerp(220,223,light))},${Math.floor(lerp(218,204,light))},${Math.floor(lerp(213,172,light))})`:'#dcdad5';ctx.lineWidth=1;ctx.stroke();
 ctx.save();ctx.translate(187,371);ctx.scale(1,.11);ellipse(0,0,90,56,rad(0,0,95,[[0,'rgba(45,45,45,.21)'],[1,'rgba(45,45,45,0)']]));ctx.restore();
 ellipse(182,365,61,12.5,'#6f7170');ellipse(182,361,61,12.5,grad(130,350,234,377,[[0,'#f7f8f7'],[.58,'#bbc0c0'],[1,'#8d9394']]),'rgba(82,86,88,.4)',1.3);ellipse(181,354,20.5,5,light>.15?'#f7e8d9':'#e1e4e2');
 seg(hip,elbow,12);seg(elbow,head,12);joint(hip,8.5);joint(elbow,8.8);joint(head,6.7);drawShade(head,angle,light);
}

function resize(){let r=stage.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);ctx.setTransform(1,0,0,1,0,0);const sc=Math.min(r.width/480,r.height/430);ctx.setTransform(dpr*sc,0,0,dpr*sc,(r.width-480*sc)*dpr/2,(r.height-430*sc)*dpr/2);paint()}
function frame(now){
 const dt=Math.min(.032,Math.max(0,(now-last)/1000));last=now;
 // These targets are continuous across rapid focus switches. A fast focus flicker
 // moves the head a little, but barely disturbs the heavy lower mechanism.
 spring(attentionHead,targetAttention,dt);
 spring(attentionElbow,targetAttention,dt);
 spring(attentionShoulder,targetAttention,dt);
 errorNod*=Math.exp(-dt*6.2);
 let goal={...rest},lampLight=logged?1:0;
 if(action){
   const elapsed=Math.max(0,(now-actionStart)/1000);
   if(action==='replay' && elapsed<replayResetSeconds){
     // Unwind smoothly from the actually rendered completed pose, without
     // teleporting to the beginning of the animation.
     const u=quintic(elapsed/replayResetSeconds);
     for(const prop of properties)goal[prop]=lerp(actionStartPose[prop],rest[prop],u);
     lampLight=1-quintic(elapsed/.38);
   }else{
     const type=action==='replay'?'in':action;
     const seconds=action==='replay'?elapsed-replayResetSeconds:elapsed;
     const paths=keys[type];
     // Start a scripted performance from the precise live pose/velocity.
     const blend=1-quintic(seconds/.46);
     for(const prop of properties){
       const offset=action==='replay'?0:actionOffsets[prop];
       goal[prop]=poseCurve(paths[prop],seconds)+offset*blend;
     }
     if(type==='in'){
       // Lamp only illuminates when its directed movement has nearly finished.
       const nearTarget=clamp01(1-Math.abs(joints.shade.x-finished.shade)/.35);
       lampLight=ease((seconds-1.68)/.36)*(.82+.18*nearTarget);
     }else lampLight=1-ease((seconds-.05)/.38);
   }
 }else if(!logged){
   // Curiosity originates in the head; shoulders follow, heavily damped.
   goal.shade=rest.shade+attentionHead.x*.20-errorNod*.085;
   goal.forearm=rest.forearm+attentionElbow.x*.054;
   goal.shoulder=rest.shoulder+attentionShoulder.x*.017;
 }else goal={...finished};
 for(const prop of properties)spring(joints[prop],goal[prop],dt);
 spring(lightSpring,lampLight,dt);
 if(reduce.matches){
   for(const prop of properties){joints[prop].x=goal[prop];joints[prop].v=0}
   lightSpring.x=lampLight;lightSpring.v=0;
 }
 if(action && now-actionStart>=actionDurations[action]){
   const done=actionDone;action=null;actionDone=null;done?.();
 }
 paint();requestAnimationFrame(frame);
}
function setError(msg){error.textContent=msg;if(msg)errorNod=1;}
function changeAttention(){
 if(busy||logged){targetAttention=0;return;}
 const active=document.activeElement;
 // Hide the password away from the lamp; showing it invites a subtle look back.
 targetAttention=active===user?1:
   active===password?(password.type==='password'?-.57:.40):0;
}
// Delayed only until the next browser paint: callbacks read the current focus,
// rather than retaining a stale user/password destination from a past blur.
login.addEventListener('focusin',changeAttention);
login.addEventListener('focusout',()=>requestAnimationFrame(changeAttention));
for(const input of [user,password])input.addEventListener('input',()=>setError(''));
document.getElementById('eye').addEventListener('click',()=>{
 const visible=password.type==='password';
 password.type=visible?'text':'password';
 document.getElementById('eye').setAttribute('aria-label',visible?'隐藏密码':'显示密码');
 password.focus({preventScroll:true});changeAttention();
});
login.addEventListener('submit',ev=>{ev.preventDefault();if(busy||logged)return;setError('');if(!user.value.trim()){setError('请输入用户名');user.focus();return}if(!password.value){setError('请输入密码');password.focus();return}
 // Frontend interaction preview: nonempty values trigger animation, never sent to a server.
 busy=true;submit.disabled=true;submit.textContent='登录中…';document.activeElement.blur();changeAttention();
 startAction('in',()=>{busy=false;logged=true;document.getElementById('who').textContent=user.value.trim();success.classList.remove('hidden');success.setAttribute('aria-hidden','false');login.classList.add('hidden');login.setAttribute('aria-hidden','true');document.getElementById('logout').focus({preventScroll:true})});
});
document.getElementById('replay').addEventListener('click',()=>{if(busy||!logged)return;busy=true;document.getElementById('replay').disabled=true;document.getElementById('logout').disabled=true;startAction('replay',()=>{busy=false;document.getElementById('replay').disabled=false;document.getElementById('logout').disabled=false})});
document.getElementById('logout').addEventListener('click',()=>{if(busy)return;busy=true;
 startAction('out',()=>{logged=false;busy=false;password.value='';submit.disabled=false;submit.textContent='登录';login.classList.remove('hidden');login.setAttribute('aria-hidden','false');success.classList.add('hidden');success.setAttribute('aria-hidden','true');user.focus({preventScroll:true})});
});
// Debug only exposes non-sensitive animation state for visual regression checks.
window.__lampMotionDebug=()=>({
 mode:action|| (logged?'lit':'idle'),
 angles:Object.fromEntries(properties.map(p=>[p,joints[p].x])),
 velocities:Object.fromEntries(properties.map(p=>[p,joints[p].v])),
 attention:{target:targetAttention,head:attentionHead.x,elbow:attentionElbow.x,shoulder:attentionShoulder.x},
 light:lightSpring.x,
 lowerLength:link1,upperLength:link2,
 base:{x:181,y:348}
});
const observer=new ResizeObserver(resize);observer.observe(stage);resize();requestAnimationFrame(frame);
})();
</script>
</body></html>
