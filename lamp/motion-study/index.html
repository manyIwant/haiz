body{min-height:100svh;display:flex;flex-direction:column}

main{flex:1;display:flex;align-items:center;min-width:0;width:100%}
.artwork{overflow-x:auto;overscroll-behavior-x:contain;width:100%;padding:0 0 14px;scrollbar-color:#d6dbd7 transparent;scrollbar-width:thin}
.board{width:100%;min-width:980px;margin:auto;max-width:1600px}
.board svg{display:block;width:100%;height:auto}
footer{display:flex;justify-content:space-between;gap:10px;padding:20px max(25px,calc((100vw - 1530px)/2));font-size:11px;color:#9ca5a0}
.mobile-hint{display:none}
