<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f3ec">
<meta name="description" content="HAIZ 教室屏，仅展示班级正式发布的作业。">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>教室屏 · HAIZ Classroom</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/room.css">
</head>
<body>
<a class="skip-link" href="#items">跳至作业</a>
<main class="room">
  <nav class="room-nav" aria-label="教室屏导航">
    <a class="workspace-link" href="index.html">返回教师工作台</a>
    <span aria-current="page">教室屏 · 只读</span>
  </nav>
  <header class="room-head">
    <div class="room-title">
      <p class="eyebrow">HAIZ · CLASSROOM</p>
      <h1 id="classroom-name">课堂作业</h1>
      <p class="sub">正式发布的作业，以服务器为准。</p>
    </div>
    <div class="room-actions">
      <div class="room-controls">
        <button id="refresh" type="button" disabled>刷新作业</button>
        <button id="fullscreen" type="button">进入全屏</button>
        <button id="change-key" type="button" hidden>更换凭据</button>
      </div>
      <p id="stamp" class="freshness" role="status">尚未连接 · 手动刷新</p>
      <p id="display-status" class="display-status" role="status" hidden></p>
    </div>
  </header>

  <section class="connection" id="connection" aria-labelledby="connection-title">
    <div>
      <h2 id="connection-title">连接班级教室屏</h2>
      <p id="key-help">填写教室屏凭据。凭据仅在当前页面内存中使用，关闭或重新打开后需再次填写。</p>
    </div>
    <form id="key-row" class="credential-form">
      <label for="key-input">教室屏凭据</label>
      <div class="credential-entry">
        <input id="key-input" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required minlength="96" maxlength="96" pattern="[0-9a-f]{96}" aria-describedby="key-help" placeholder="96 位教室屏凭据">
        <button id="load" type="submit">载入作业</button>
      </div>
    </form>
  </section>

  <p id="error" role="alert" hidden></p>
  <section id="items" class="board" tabindex="-1" aria-live="polite" aria-label="已发布作业" aria-busy="false">
    <div class="empty">
      <h2 class="empty-title">等待连接班级</h2>
      <p>载入后，这里会显示服务器上的已发布作业。</p>
    </div>
  </section>

  <footer class="room-foot">
    <span>HAIZ Classroom · 非官方独立展示</span>
    <span>仅显示公开作业，不显示学生身份或完成记录。</span>
  </footer>
</main>
<script type="module" src="js/classroom.js"></script>
</body>
</html>
