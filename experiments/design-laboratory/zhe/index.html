<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut">
<title>折 · HAIZ 设计实验室</title>
<meta name="description" content="方案二「折」：界面是一张纸，信息藏在折里。展开就是进入，折起就是收好；打开时立起，合上前先躺平。">
<style>
/* ───────────────────────── 折 · Tokens ─────────────────────────
   一张卡纸有两面：正面浅，背面深。折痕是唯一的边界。 */
:root{
  --face:#e7e3da; --back:#cfc9bc; --deep:#b9b2a3; --ink:#1b1f22; --ink2:#4e5257; --ink3:#7f8186;
  --blue:#2443b8; --blue-soft:#2443b81f; --warn:#b8402a;
  --sans:-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei","WenQuanYi Zen Hei",sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace;
  --fs:1;
  --t:280ms; --t-fast:150ms; --ease:cubic-bezier(.3,.7,.1,1);
  --crease-l:linear-gradient(90deg,#0000 0,#fff6 1px,#0000 2px), linear-gradient(90deg,#0002,#0000 14%);
  --desk:#2b2c2a;
  color-scheme:light;
}
:root[data-theme="dark"]{ --face:#2d2f2c; --back:#22241f; --deep:#1a1b18; --ink:#ecebe5; --ink2:#c0beb6; --ink3:#8d8b84; --blue:#8aa2ff; --blue-soft:#8aa2ff26; --desk:#0e0f0e; color-scheme:dark }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --face:#2d2f2c; --back:#22241f; --deep:#1a1b18; --ink:#ecebe5; --ink2:#c0beb6; --ink3:#8d8b84; --blue:#8aa2ff; --blue-soft:#8aa2ff26; --desk:#0e0f0e; color-scheme:dark } }
:root[data-motion="reduce"]{ --t:0ms; --t-fast:0ms }
@media (prefers-reduced-motion: reduce){ :root:not([data-motion="normal"]){ --t:0ms; --t-fast:0ms } }

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--sans);font-size:calc(16px*var(--fs));line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
a{color:inherit}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ───────── 纸：一张横向展开的经折装（桌面） ───────── */
.desk{position:fixed;inset:0;display:flex;align-items:stretch;padding:28px 0 28px 28px}
.sheet{position:relative;flex:0 1 auto;max-width:calc(100% - 52px);display:flex;align-items:stretch;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;perspective:1800px;scroll-snap-type:x proximity;padding-right:8px}
.sheet::-webkit-scrollbar{height:6px}.sheet::-webkit-scrollbar-thumb{background:#fff3}

/* 折页 · 每一页是纸的一折 */
.pn{position:relative;flex:0 0 auto;width:var(--w,380px);display:flex;transition:width var(--t) var(--ease);scroll-snap-align:start;transform-style:preserve-3d}
.pn > .body{position:relative;flex:1;min-width:0;background:var(--face);overflow:hidden auto;scrollbar-width:none;padding:28px 28px 40px;transform-origin:left center;transition:transform var(--t) var(--ease),filter var(--t) var(--ease);backface-visibility:hidden}
.pn > .body::-webkit-scrollbar{display:none}
/* 山折与谷折：相邻的两页受光不同 */
.pn:nth-child(odd) > .body{background-image:linear-gradient(90deg,#0000 70%,#00000010)}
.pn:nth-child(even) > .body{background-image:linear-gradient(90deg,#ffffff1a,#0000 30%)}
.pn + .pn > .body{box-shadow:inset 1px 0 0 #00000014, inset 2px 0 0 #ffffff40}
/* 折痕条：折起来时只剩它 */
.pn > .spine{display:none;width:44px;background:var(--back);cursor:pointer;border:0;padding:16px 0;writing-mode:vertical-rl;font-size:14px;letter-spacing:.3em;color:var(--ink2);text-align:start;box-shadow:inset -1px 0 0 #0002, inset 1px 0 0 #fff3}
.pn > .spine:hover{background:var(--deep);color:var(--ink)}
.pn.folded{width:44px}
.pn.folded > .spine{display:block}
.pn.folded > .body{display:none}
.pn.folding > .body{transform:rotateY(-80deg);filter:brightness(.7)}
.pn-h{display:flex;align-items:baseline;gap:10px;margin:0 0 18px}
.pn-h h2{font-size:calc(13px*var(--fs));letter-spacing:.24em;font-weight:600;margin:0;color:var(--ink2)}
.pn-h .fold-btn{margin-left:auto;background:none;border:0;padding:2px 4px;cursor:pointer;color:var(--ink3);font-size:12px}
.pn-h .fold-btn:hover{color:var(--blue)}
.big{font-size:calc(34px*var(--fs));line-height:1.25;font-weight:600;letter-spacing:.01em;margin:.1em 0 .4em}
.mid{font-size:calc(21px*var(--fs));line-height:1.45;font-weight:500;margin:.2em 0 .5em}
.p{font-size:calc(15.5px*var(--fs));line-height:1.75;color:var(--ink);margin:.4em 0 .8em}
.note{font-size:calc(12.5px*var(--fs));color:var(--ink3);line-height:1.6;margin:.6em 0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.ex{display:inline-block;font-size:11px;letter-spacing:.12em;color:var(--blue);border:1px solid currentColor;padding:0 .4em;line-height:1.5;vertical-align:.15em;margin-left:.4em}
.crease{height:0;border:0;margin:20px -28px;border-top:1px solid #00000018;border-bottom:1px solid #ffffff55}

/* ───────── 书口索引（导航）：剪在纸边上的台阶 ───────── */
.edge{flex:0 0 52px;display:flex;flex-direction:column;gap:2px;padding-top:24px}
.tab{position:relative;display:flex;align-items:center;justify-content:center;width:44px;height:72px;margin-left:0;background:var(--back);border:0;cursor:pointer;writing-mode:vertical-rl;letter-spacing:.35em;font-size:14px;color:var(--ink2);transition:transform var(--t-fast) var(--ease),background var(--t-fast);clip-path:polygon(0 0,100% 6px,100% calc(100% - 6px),0 100%);text-decoration:none}
.tab:hover{transform:translateX(3px);color:var(--ink)}
.tab[aria-current="page"]{background:var(--face);color:var(--ink);transform:translateX(-4px);width:52px;font-weight:600;box-shadow:inset 3px 0 0 var(--blue)}
.tab .cnt{position:absolute;bottom:6px;writing-mode:horizontal-tb;font-size:10px;letter-spacing:0;color:var(--blue);font-family:var(--mono)}

/* ───────── 组件 ───────── */
/* 折条（列表项）：完成 = 折起来 */
.strip{position:relative;display:flex;gap:12px;align-items:flex-start;padding:12px 0 12px 0;border-top:1px solid #0000001a;box-shadow:inset 0 1px 0 #fff5;transform-origin:top center;transition:transform var(--t) var(--ease),opacity var(--t) var(--ease),max-height var(--t) var(--ease),padding var(--t) var(--ease);max-height:200px}
.strip.gone{transform:rotateX(-90deg);opacity:0;max-height:0;padding:0}
.strip .t{flex:1;min-width:0}
.strip .t b{font-weight:500;display:block}
.strip .t small{color:var(--ink3);font-size:12.5px}
.strip .t small.late{color:var(--warn)}
/* 折角钮：右上角折过来就是“完成” */
.corner{flex:0 0 30px;height:30px;border:0;background:var(--back);cursor:pointer;position:relative;clip-path:polygon(0 0,100% 0,100% 100%,0 100%);transition:clip-path var(--t-fast) var(--ease),background var(--t-fast)}
.corner::after{content:"";position:absolute;right:0;top:0;width:12px;height:12px;background:linear-gradient(225deg,var(--face) 50%,var(--deep) 50%)}
.corner:hover{background:var(--deep)}
.corner:hover::after{width:16px;height:16px}
.corner[aria-pressed="true"]{background:var(--blue)}
.corner[aria-pressed="true"]::after{width:30px;height:30px;background:linear-gradient(225deg,var(--face) 50%,#1b2f8a 50%)}
.stack{display:block;width:100%;margin-top:12px;background:none;border:0;padding:6px 0 0;cursor:pointer;text-align:left;color:var(--ink3);font-size:12.5px}
.stack .leaves{display:block;height:calc(var(--n,1)*3px + 2px);background:repeating-linear-gradient(180deg,var(--back) 0 2px,var(--deep) 2px 3px);margin-bottom:6px}

/* 翻牌（开关）：翻过来就是纸的另一面 */
.flip{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer;user-select:none}
.flip .card{position:relative;flex:0 0 56px;height:30px;perspective:300px;border:0;padding:0;background:none;cursor:pointer}
.flip .card i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;letter-spacing:.2em;backface-visibility:hidden;transition:transform var(--t) var(--ease)}
.flip .card .f{background:var(--back);color:var(--ink2);box-shadow:inset 0 0 0 1px #0001}
.flip .card .b{background:var(--blue);color:#fff;transform:rotateY(180deg)}
.flip .card[aria-checked="true"] .f{transform:rotateY(-180deg)}
.flip .card[aria-checked="true"] .b{transform:rotateY(0)}
.flip .lab{flex:1}
.flip .lab small{display:block;color:var(--ink3);font-size:12.5px}

/* 折扇（选项）：选中的一折摊平，其余斜着退后 */
.fan{display:flex;perspective:600px;margin:8px 0 14px;height:44px}
.fan button{flex:1 1 0;min-width:0;border:0;background:var(--back);cursor:pointer;font-size:13.5px;color:var(--ink2);transition:transform var(--t) var(--ease),flex var(--t) var(--ease),background var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.fan button:nth-child(odd){transform-origin:right center;transform:rotateY(38deg)}
.fan button:nth-child(even){transform-origin:left center;transform:rotateY(-38deg);background:var(--deep)}
.fan button[aria-checked="true"]{transform:none;flex:2.2 1 0;background:var(--face);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px #0002, inset 0 -3px 0 var(--blue)}
.fan-l{font-size:13px;color:var(--ink2);margin-top:10px}

/* 拉条（滑块）：从缝里抽出一条刻度纸 */
.pull{position:relative;height:56px;margin:6px 0 14px}
.pull .slot{position:absolute;left:0;top:14px;width:10px;height:28px;background:var(--ink);border-radius:1px}
.pull .tape{position:absolute;left:6px;top:18px;height:20px;width:calc(var(--p)*(100% - 60px) + 40px);background:repeating-linear-gradient(90deg,var(--ink3) 0 1px,#0000 1px 10px) bottom/100% 6px no-repeat,var(--face);box-shadow:0 1px 0 #0002,0 0 0 1px #0001;transition:width var(--t-fast) var(--ease)}
.pull .grip{position:absolute;right:-1px;top:-6px;bottom:-6px;width:38px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12.5px;clip-path:polygon(0 0,100% 4px,100% calc(100% - 4px),0 100%)}
.pull input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:ew-resize}
.pull-l{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2)}
.pull-l b{font-family:var(--mono);font-weight:500;color:var(--ink)}

/* 字段：写在纸上的一行 */
.field{display:block;margin:14px 0 6px;position:relative}
.field span{display:block;font-size:12.5px;letter-spacing:.14em;color:var(--ink2);margin-bottom:4px}
.field input{width:100%;border:0;border-bottom:1.5px solid var(--ink);background:transparent;padding:8px 2px;font-size:calc(19px*var(--fs));outline:0;border-radius:0}
.field input:focus{border-bottom-color:var(--blue);background:var(--blue-soft)}
.field .crumple{position:absolute;inset:-6px -10px;pointer-events:none;opacity:0;transition:opacity var(--t)}
.field.err .crumple{opacity:1;background:linear-gradient(160deg,#0000 47%,#0000002a 49%,#ffffff70 50%,#0000 52%)}
.field .msg{display:block;font-size:13px;color:var(--warn);min-height:1.2em;margin-top:4px}
.field .peek{position:absolute;right:0;bottom:30px;width:60px;height:34px;border:0;background:var(--back);cursor:pointer;font-size:12px;color:var(--ink2);transform-origin:top center;transition:transform var(--t-fast) var(--ease)}
.field .peek[aria-pressed="true"]{transform:rotateX(65deg);background:var(--deep)}

/* 折舌（主要操作）：从纸边伸出来的一条，按下去纸就折上 */
.tongue{display:inline-flex;align-items:center;gap:10px;margin-top:20px;border:0;background:var(--ink);color:var(--face);padding:13px 22px 13px 18px;font-size:calc(16px*var(--fs));letter-spacing:.2em;cursor:pointer;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%);transition:transform var(--t-fast) var(--ease),background var(--t-fast)}
.tongue:hover{transform:translateX(4px)}
.tongue:active{transform:translateX(8px) scaleX(.97)}
.tongue[disabled]{background:var(--deep);color:var(--ink3);cursor:not-allowed;transform:none}
.tongue.light{background:var(--back);color:var(--ink)}
.linkline{background:none;border:0;padding:0;cursor:pointer;color:var(--ink);border-bottom:1px solid var(--ink3);font-size:inherit}
.linkline:hover{color:var(--blue);border-color:var(--blue)}

/* 撕线（危险操作）：沿着齿孔拖过去才撕得下 */
.perf{position:relative;display:flex;align-items:center;gap:12px;padding:12px 10px 12px 0;transition:transform 520ms cubic-bezier(.5,0,.8,.4),opacity 520ms}
.perf .who{flex:1}
.perf .who small{display:block;color:var(--ink3);font-size:12.5px}
.perf .line{position:relative;flex:0 0 120px;height:34px;border-left:2px dashed var(--ink3);background:var(--back);touch-action:none;cursor:grab;overflow:hidden}
.perf .line::before{content:"";position:absolute;left:0;top:0;bottom:0;width:calc(var(--tear,0)*100%);background:repeating-linear-gradient(90deg,var(--warn) 0 4px,#0000 4px 7px);opacity:.6}
.perf .line span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink2);pointer-events:none}
.perf.torn{transform:translate(30px,60px) rotate(8deg);opacity:0}
.perf .line:focus-visible{outline:2px solid var(--warn)}

/* 立起来的东西：纸雕 */
.pop-stage{perspective:1100px;margin:6px -8px 8px}
.plane{position:relative;transform-style:preserve-3d;transform-origin:50% 60%;transition:transform 600ms var(--ease)}
.bld{position:absolute;transform-style:preserve-3d;cursor:pointer}
.bld i{position:absolute;display:block;background:var(--face);box-shadow:inset 0 0 0 1px #0003;transform-origin:0 0;transition:transform 520ms var(--ease)}
.bld i.top{inset:0;background:var(--face);transform:translateZ(var(--hh))}
.bld i.s{left:0;right:0;bottom:0;height:var(--h);transform-origin:bottom;transform:rotateX(-90deg) scaleY(var(--rise));background:var(--back)}
.bld i.n{left:0;right:0;top:0;height:var(--h);transform-origin:top;transform:rotateX(90deg) scaleY(var(--rise));background:var(--deep)}
.bld i.e{top:0;bottom:0;right:0;width:var(--h);transform-origin:right;transform:rotateY(90deg) scaleX(var(--rise));background:var(--deep)}
.bld i.w{top:0;bottom:0;left:0;width:var(--h);transform-origin:left;transform:rotateY(-90deg) scaleX(var(--rise));background:var(--back)}
.bld:hover i.top{background:#fff}
.bld.sel i{background:var(--blue)!important;box-shadow:inset 0 0 0 1px #0004}
.bld.sel i.top{background:#3d5bd0!important}
.road{position:absolute;background:#0000000f}
.green{position:absolute;border:1px dashed #0000002a}
.plane .lbl{position:absolute;font-size:11px;color:var(--ink);transform:translateZ(60px) rotateX(-55deg);transform-origin:bottom center;white-space:nowrap;pointer-events:none;background:var(--face);padding:0 4px;box-shadow:0 0 0 1px #0002}

/* 单摆：从书页上立起来的纸雕 */
.page3d{position:relative;height:260px;transform-style:preserve-3d;transform:rotateX(52deg);transform-origin:50% 100%;background:repeating-linear-gradient(0deg,#0000 0 23px,#00000010 23px 24px),var(--face);box-shadow:0 0 0 1px #0002;margin:20px 10px 40px}
.standup{position:absolute;left:10%;right:10%;bottom:40%;height:220px;transform-origin:bottom center;transform:rotateX(calc(-90deg * var(--up,1)));transition:transform 600ms var(--ease);transform-style:preserve-3d}
.standup svg{width:100%;height:100%;overflow:visible}
.standup line,.standup path{stroke:var(--ink);fill:none;stroke-width:1.4}

/* 专注：一张自己慢慢对折的纸 */
.fsheet{position:relative;width:180px;height:180px;margin:10px auto 14px;perspective:600px}
.fsheet .part{position:absolute;background:var(--face);box-shadow:0 0 0 1px #0002, 0 8px 20px -10px #0006;transition:all 700ms var(--ease);display:flex;align-items:center;justify-content:center}
.fsheet .left{font-family:var(--mono);font-size:22px}

/* 收件袋 */
.pocket{position:relative;margin:14px 0 8px;padding-top:18px}
.pocket .mouth{position:relative;z-index:2;height:64px;background:var(--back);box-shadow:inset 0 2px 0 #0002;display:flex;align-items:flex-end;padding:0 0 8px 12px;font-size:12.5px;color:var(--ink2)}
.slip{position:relative;z-index:1;margin:0 8px -40px;background:#f5f2ea;padding:10px 12px 46px;box-shadow:0 0 0 1px #0002;cursor:pointer;transition:transform var(--t) var(--ease),margin var(--t) var(--ease);font-size:14px}
:root[data-theme="dark"] .slip{background:#3a3c38}
.slip:hover{transform:translateY(-6px)}
.slip.out{margin:0 0 14px;padding-bottom:12px;transform:none;z-index:3;cursor:default}
.slip .acts{display:none;gap:8px;margin-top:10px;flex-wrap:wrap}
.slip.out .acts{display:flex}

/* 课：过去折得很薄，此刻完全展开，将来半开 */
.cls{position:relative;overflow:hidden;border-top:1px solid #0000001a;transition:max-height var(--t) var(--ease),background var(--t);cursor:pointer;display:flex;gap:12px;align-items:baseline;padding:0 8px}
.cls.past{max-height:22px;font-size:12px;color:var(--ink3);background:var(--back)}
.cls.future{max-height:44px;padding-top:9px}
.cls.now{max-height:200px;padding:14px 8px;background:var(--face);box-shadow:inset 3px 0 0 var(--blue)}
.cls.now .nm{font-size:26px;font-weight:600}
.cls .tm{font-family:var(--mono);font-size:12.5px;color:var(--ink3);flex:0 0 auto}
.cls .nm{flex:1}
.cls .rm{display:none;font-size:13px;color:var(--ink2)}
.cls.now .rm,.cls.open .rm{display:block}
.cls.open{max-height:120px;padding:10px 8px}

.img{display:block;width:100%;height:auto;margin:6px 0 10px;filter:saturate(.9)}
.act-fan{display:flex;flex-direction:column;margin-top:8px}
.act{color:inherit;text-decoration:none;display:flex;align-items:baseline;gap:12px;border:0;background:none;text-align:left;padding:10px 0;border-top:1px solid #0000001a;cursor:pointer;transition:padding var(--t) var(--ease)}
.act:hover{padding-left:8px}
.act .n{font-family:var(--mono);font-size:12px;color:var(--ink3);flex:0 0 22px}
.act .d{display:block;font-size:13px;color:var(--ink3)}
.search input{width:100%;border:0;border-bottom:1.5px solid var(--ink);background:transparent;font-size:20px;padding:6px 2px;outline:0}
.hits{margin-top:8px}
.hits button{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid #0000001a;padding:9px 0;cursor:pointer}
.hits button small{color:var(--ink3);margin-left:8px}
table.t{border-collapse:collapse;width:100%;font-size:13px;font-family:var(--mono)}
table.t th{text-align:left;font-weight:500;color:var(--ink3);border-bottom:1px solid var(--ink);padding:4px 6px 4px 0}
table.t td{border-bottom:1px solid #0000001a;padding:5px 6px 5px 0}
.toast{visibility:hidden;position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(120%);background:var(--ink);color:var(--face);padding:10px 16px;font-size:14px;transition:transform var(--t) var(--ease);z-index:90;max-width:90vw}
.toast.on{visibility:visible;transform:translateX(-50%) translateY(0)}
.lab-tag{position:fixed;top:6px;left:28px;z-index:30;font-size:11.5px;color:#fff8;text-decoration:none}
.lab-tag:hover{color:#fff}

/* ───────── 手机：纸竖着折；书口索引移到拇指边 ───────── */
@media (max-width: 760px){
  body{overflow:auto}
  .desk{position:static;display:block;padding:0}
  .sheet{display:block;overflow:visible;perspective:1200px;padding:0 0 calc(76px + env(safe-area-inset-bottom))}
  .pn{width:auto!important;display:block}
  .pn > .body{padding:22px 16px 26px;overflow:visible;transform-origin:top center}
  .pn + .pn > .body{box-shadow:inset 0 1px 0 #00000018, inset 0 2px 0 #ffffff50}
  .pn:nth-child(odd) > .body{background-image:linear-gradient(180deg,#0000 70%,#0000000c)}
  .pn:nth-child(even) > .body{background-image:linear-gradient(180deg,#ffffff1a,#0000 30%)}
  .pn > .spine{writing-mode:horizontal-tb;width:100%;height:46px;padding:0 16px;text-align:left;letter-spacing:.2em}
  .pn.folded{width:auto}
  .pn.folding > .body{transform:rotateX(80deg)}
  .edge{position:fixed;left:0;right:0;bottom:0;z-index:40;flex-direction:row;gap:2px;padding:0 6px env(safe-area-inset-bottom);background:var(--desk);height:calc(64px + env(safe-area-inset-bottom));align-items:flex-start}
  .tab{writing-mode:horizontal-tb;width:auto;flex:1;height:56px;letter-spacing:.15em;clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 100%,0 100%);font-size:14px}
  .tab:hover{transform:none}
  .tab[aria-current="page"]{width:auto;transform:translateY(-6px);height:62px;box-shadow:inset 0 3px 0 var(--blue)}
  .tab .cnt{bottom:auto;top:4px;right:6px}
  .big{font-size:calc(28px*var(--fs))}
  .fan button:nth-child(odd){transform:rotateY(24deg)}
  .fan button:nth-child(even){transform:rotateY(-24deg)}
  .fan button[aria-checked="true"]{transform:none}
  .sheet{max-width:none}
  .lab-tag{position:static;display:block;padding:6px 16px;background:var(--desk)}
  .page3d{height:200px}
  .standup{height:170px}
  .pn-h .fold-btn{padding:8px}
}
</style>
</head>
<body>
<a class="lab-tag" href="../index.html" data-lab>设计实验室 · 方案二「折」</a>
<div class="desk">
  <main class="sheet" id="sheet" aria-live="off"></main>
  <nav class="edge" id="edge" aria-label="书口索引"></nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="../shared/data.js"></script>
<script src="../shared/campus.js"></script>
<script>
/* ════════════════════════════════════════════════════════════════
   折 · 规则
   1. 界面是一张纸。层级 = 折的深浅；进入 = 展开；收好 = 折起。没有弹窗，也不换页。
   2. 折痕是唯一的边界。不用卡片、阴影框、圆角容器分隔内容。
   3. 动作就是形变：完成一件事 = 把它折起来；开关 = 翻到纸的背面；选择 = 摊平一折；
      危险操作 = 沿齿孔撕下（必须拖过去，或用键盘连按两次）。
   4. 打开时立起，合上前先躺平（继承 HAIZ 实验册）：纸雕只在纸摊开时站起来。
   5. 桌面横着折（经折装），手机竖着折；书口索引永远在纸边——手机上就在拇指边。
   ════════════════════════════════════════════════════════════════ */
const D = window.HAIZ_SAMPLE, C = window.HAIZ_CAMPUS, R = HZ.root;
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = { get(k, d) { try { const v = localStorage.getItem('hz-zhe-' + k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem('hz-zhe-' + k, JSON.stringify(v)); } catch {} } };
const mobile = () => innerWidth <= 760;

const S = {
  view: 'home',
  folded: store.get('folded', {}),
  tasks: store.get('tasks', D.TASKS.map((t) => ({ ...t }))),
  inbox: D.INBOX.map((x) => ({ ...x })), slipOut: null,
  showDone: false, openCls: null,
  focus: { min: 25, running: false, end: 0, subj: '数学' },
  pref: store.get('pref', { motion: 0, size: 0, theme: 0, sync: false, leaf: false, intake: false }),
  authed: store.get('authed', false),
  login: { mode: 0, err: {} },
  map: { sel: 'library', rise: 0.55, time: 0 },
  lab: { L: 1.0, deg: 4, n: 30, rows: [], up: 1 },
  devices: D.ACCOUNT.devices.map((d) => ({ ...d })),
  q: '',
};
const TABS = [
  { id: 'home', label: '树' }, { id: 'login', label: '入口' }, { id: 'pocket', label: '口袋' },
  { id: 'map', label: '校园' }, { id: 'read', label: '实验册' }, { id: 'settings', label: '我' },
];

/* ── 折页工具 ── */
function pn(id, title, body, w = 380) {
  const f = !!S.folded[S.view + ':' + id];
  return `<section class="pn ${f ? 'folded' : ''}" data-pn="${id}" style="--w:${w}px" aria-label="${esc(title)}">
    <button class="spine" data-unfold="${id}" aria-expanded="false" aria-label="展开：${esc(title)}">${esc(title)}</button>
    <div class="body"><div class="pn-h"><h2>${esc(title)}</h2><button class="fold-btn" data-fold="${id}" aria-expanded="true" aria-label="折起：${esc(title)}">折起 ⟵</button></div>${body}</div>
  </section>`;
}
const ex = '<span class="ex">示例</span>';
const flip = (id, on, label, sub = '') => `<div class="flip"><button class="card" role="switch" aria-checked="${on}" data-flip="${id}" aria-label="${esc(label)}"><i class="f">关</i><i class="b">开</i></button><span class="lab">${esc(label)}${sub ? `<small>${esc(sub)}</small>` : ''}</span></div>`;
const fan = (id, opts, cur, label) => `<div class="fan-l" id="fl-${id}">${esc(label)}</div><div class="fan" role="radiogroup" aria-labelledby="fl-${id}">${opts.map((o, i) => `<button role="radio" aria-checked="${i === cur}" data-fan="${id}" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
const pull = (id, v, min, max, step, label, fmt = (x) => x) => `<div class="pull-l"><span>${esc(label)}</span><b id="pv-${id}">${fmt(v)}</b></div><div class="pull" style="--p:${(v - min) / (max - min)}"><span class="slot"></span><span class="tape"><span class="grip" id="pg-${id}">${fmt(v)}</span></span><input type="range" min="${min}" max="${max}" step="${step}" value="${v}" data-pull="${id}" aria-label="${esc(label)}"></div>`;

/* ════════════════════ A · 首页（树） ════════════════════ */
const ACTS = [
  ['初遇', '冬末的榄仁树，逐叶生长。'], ['根脉', '沿树干向上，走过有出处的校史。'], ['青春 · 生长', '作品是树冠里的一片新叶。'],
  ['场域', '水面显出总平面，校园从轮廓里升起。'], ['远方', '从树冠望出去，相机成为一个人。'], ['回望', '落地，回头，再看一次这棵树。'],
];
function vHome() {
  const todo = S.tasks.filter((t) => !t.done);
  const m = HZ.minuteNow(); const nxt = D.COURSES.filter((c) => c.day === HZ.today() && c.end > m).sort((a, b) => a.start - b.start)[0];
  const hits = searchHits(S.q);
  return [
    pn('cover', 'HAIZ', `<p class="big">一棵树，<br>折进一座校园。</p>
      <img class="img" src="${R}docs/lanren/rings/sunset-20191120.jpg" alt="HAIZ 的数字榄仁树，日落在树后" loading="lazy">
      <p class="p">海南中学府城校区一号教学楼前的百年榄仁树，是这座数字校园的原点。学生独立建设，非官方。</p>
      <p class="note">往右（手机上往下）是纸的其余几折；纸边的索引能直接翻到任何一折。</p>`, 420),
    pn('acts', '六幕', `<div class="act-fan">${ACTS.map((a, i) => `<a class="act" href="${R}index.html${i ? '#' + ['', 'roots', 'leaves', 'map', 'far', 'back'][i] : ''}"><span class="n">0${i + 1}</span><span><b>${a[0]}</b><span class="d">${a[1]}</span></span></a>`).join('')}</div>
      <p class="note">六幕共享同一棵树与同一台摄影机；点击进入现有的六幕首页。</p>`, 340),
    pn('today', '今天', `${nxt ? `<p class="note">下一节</p><p class="big" style="margin-top:0">${nxt.name}</p><p class="num">${HZ.mm(nxt.start)} · ${nxt.room}</p>` : '<p class="mid">今天的课上完了</p>'}
      <hr class="crease"><p class="mid">${todo.length} 件事没做 ${ex}</p>${todo.slice(0, 3).map((t) => `<div class="strip"><span class="t"><b>${esc(t.title)}</b><small>${esc(t.subject)} · ${HZ.dueText(t.due)}</small></span></div>`).join('')}
      <button class="tongue light" data-go="pocket">打开口袋</button>`, 340),
    pn('works', '作品与工具', D.WORKS.map((x) => `<a class="act" href="${R + x.href}"><span class="n">${x.verb}</span><span><b>${esc(x.name)}</b><span class="d">${esc(x.line)}</span></span></a>`).join(''), 360),
    pn('find', '找', `<label class="search"><span class="sr">搜索</span><input id="q" placeholder="地点、功能、年份……" value="${esc(S.q)}" autocomplete="off"></label>
      <div class="hits" id="hits">${hits}</div>`, 340),
  ].join('');
}
function searchHits(q) {
  const I = [];
  D.WORKS.forEach((x) => I.push({ t: x.name, s: x.verb, href: R + x.href }));
  TABS.forEach((t) => I.push({ t: ({ home: '首页', login: '登录 / 注册', pocket: 'Pocket · 课表任务', map: '校园地图', read: '实验册 · 单摆', settings: '设置与个人空间' })[t.id], s: '这张纸的一折', go: t.id }));
  C.b.filter((b) => b.k !== 'corr').forEach((b) => I.push({ t: b.n, s: '地点', go: 'map', sel: b.id }));
  D.HISTORY.forEach((h) => I.push({ t: h.label + ' ' + h.title, s: '根脉', href: R + 'index.html#roots/' + h.id }));
  const hit = q ? I.filter((x) => (x.t + x.s).includes(q)) : I.slice(0, 7);
  return hit.slice(0, 10).map((x) => x.href ? `<button data-href="${x.href}">${esc(x.t)}<small>${esc(x.s)}</small></button>` : `<button data-go="${x.go}" ${x.sel ? `data-sel="${x.sel}"` : ''}>${esc(x.t)}<small>${esc(x.s)}</small></button>`).join('') || '<p class="note">没有找到。</p>';
}

/* ════════════════════ B · 入口：登录与注册 ════════════════════ */
function vLogin() {
  if (S.authed) return pn('in', '已经进来了', `<p class="big">欢迎回来，<br>${esc(D.ACCOUNT.name)}${ex}</p><p class="p">登录凭条折好放进了纸边的「我」里。</p><button class="tongue" data-go="settings">去个人空间</button> <button class="tongue light" data-logout>退出登录</button><p class="note">演示：只是本机的一个标记，没有连接服务器。</p>`, 420);
  const L = S.login, E = L.err;
  const reg = L.mode === 1;
  return [
    pn('slip', reg ? '注册' : '登录', `
      ${fan('mode', ['登录', '注册'], L.mode, '我要')}
      <form id="loginForm" novalidate>
        ${reg ? `<label class="field ${E.nick ? 'err' : ''}"><span>昵称</span><input name="nick" autocomplete="nickname"><i class="crumple"></i><em class="msg">${E.nick || ''}</em></label>` : ''}
        <label class="field ${E.user ? 'err' : ''}"><span>账号</span><input name="user" autocomplete="username" autocapitalize="off" spellcheck="false" ${E.user ? 'aria-invalid="true"' : ''} aria-describedby="m-user"><i class="crumple"></i><em class="msg" id="m-user">${E.user || ''}</em></label>
        <label class="field ${E.pass ? 'err' : ''}"><span>口令</span><input name="pass" type="password" autocomplete="${reg ? 'new-password' : 'current-password'}" ${E.pass ? 'aria-invalid="true"' : ''} aria-describedby="m-pass"><button type="button" class="peek" data-peek aria-pressed="false" aria-label="显示口令">掀开看</button><i class="crumple"></i><em class="msg" id="m-pass">${E.pass || ''}</em></label>
        ${reg ? `<label class="field ${E.pass2 ? 'err' : ''}"><span>再写一遍口令</span><input name="pass2" type="password" autocomplete="new-password"><i class="crumple"></i><em class="msg">${E.pass2 || ''}</em></label>` : ''}
        ${flip('keep', !!L.keep, '记住这台设备 8 小时', '公用电脑上请不要打开')}
        <button class="tongue" type="submit">${reg ? '注册' : '登录'}　⟶</button>
        <em class="msg" style="display:block;color:var(--warn);margin-top:10px" role="alert">${E.form || ''}</em>
      </form>`, 420),
    pn('why', '为什么这样', `<p class="p">按下「${reg ? '注册' : '登录'}」时，这张凭条会沿着折舌折起来送出去。出了错，它会摊开回来——<b>出错的那一行留下一道折痕</b>，改好之后折痕才会平。</p><p class="p">「掀开看」是盖在口令上的一小片纸：按一下掀开，再按一下盖回。</p><p class="note">演示账号 sample_01 / haiz2026。不会发送任何数据。</p>`, 320),
  ].join('');
}

/* ════════════════════ C · 口袋（Pocket） ════════════════════ */
function vPocket() {
  const m = HZ.minuteNow(), day = HZ.today();
  const list = D.COURSES.filter((c) => c.day === day).sort((a, b) => a.start - b.start);
  const cls = list.map((c) => {
    const st = c.end <= m ? 'past' : c.start <= m ? 'now' : 'future';
    const isNow = st === 'now' || (st === 'future' && !list.some((x) => x.start <= m && x.end > m) && list.find((x) => x.start > m) === c);
    return `<div class="cls ${isNow ? 'now' : st} ${S.openCls === c.id ? 'open' : ''}" data-cls="${c.id}" tabindex="0" role="button" aria-expanded="${isNow || S.openCls === c.id}"><span class="tm">${HZ.mm(c.start)}</span><span class="nm">${c.name}<span class="rm">${HZ.mm(c.start)}–${HZ.mm(c.end)} · ${c.room}</span></span></div>`;
  }).join('');
  const todo = S.tasks.filter((t) => !t.done).sort((a, b) => new Date(a.due) - new Date(b.due));
  const done = S.tasks.filter((t) => t.done);
  const strip = (t) => `<div class="strip" data-task="${t.id}"><button class="corner" data-done="${t.id}" aria-pressed="${t.done}" aria-label="${t.done ? '恢复' : '完成'}：${esc(t.title)}"></button><span class="t"><b>${esc(t.title)}</b><small class="${!t.done && new Date(t.due) < new Date() ? 'late' : ''}">${esc(t.subject)} · ${HZ.dueText(t.due)}${t.example ? ' · 示例' : ''}${t.source ? ' · 来自 ' + esc(t.source) : ''}</small></span></div>`;
  const F = S.focus;
  return [
    pn('day', '周' + HZ.wd(day) + ' 的课', `<p class="note">过去的课折得很薄，此刻的课完全展开，后面的课半开。点任何一条都能摊开看。${ex}</p>${cls}`, 330),
    pn('tasks', '要做的事', `
      <form id="addForm" style="display:flex;gap:8px;align-items:flex-end;margin-bottom:6px"><label class="field" style="flex:1;margin:0"><span>记一件事</span><input name="t" placeholder="例如：周五交英语作文" autocomplete="off"></label><button class="tongue" style="margin:0;padding:10px 16px 10px 12px" aria-label="记下">记</button></form>
      ${todo.map(strip).join('') || '<p class="note">都做完了。</p>'}
      ${done.length ? `<button class="stack" data-stack style="--n:${done.length}" aria-expanded="${S.showDone}"><span class="leaves"></span>已折起 ${done.length} 件 · ${S.showDone ? '收回' : '摊开看看'}</button>${S.showDone ? done.map(strip).join('') : ''}` : ''}
      <p class="note">完成 = 折起右上角。折起来的事叠在下面，随时可以摊开。</p>`, 380),
    pn('inbox', '收件', `<p class="note">从通知里收到的候选，像纸条一样插在袋子里。抽出来看，确认后才变成任务。</p>
      <div class="pocket">${S.inbox.map((it) => `<div class="slip ${S.slipOut === it.id ? 'out' : ''}" data-slip="${it.id}" tabindex="0" role="button" aria-expanded="${S.slipOut === it.id}"><b>${esc(it.guess.title)}</b><div style="font-size:13px;color:var(--ink2);margin-top:4px">${esc(it.text)}</div><div style="font-size:12px;color:var(--ink3);margin-top:4px">${esc(it.from)} · 猜测截止 ${HZ.dueText(it.guess.due)}</div><div class="acts"><button class="tongue" style="margin:0;padding:8px 16px 8px 12px;font-size:14px" data-accept="${it.id}">收下</button><button class="tongue light" style="margin:0;padding:8px 16px 8px 12px;font-size:14px" data-reject="${it.id}">塞回去不要</button></div></div>`).join('')}
      <div class="mouth">${S.inbox.length ? S.inbox.length + ' 张待核' : '袋子空了'}</div></div>`, 330),
    pn('focus', '专注', `${F.running ? '' : pull('fmin', F.min, 5, 90, 5, '专注多久（分钟）')}
      <div class="fsheet" id="fsheet" aria-hidden="true"></div>
      <p class="mid" style="text-align:center" id="fleft">${F.running ? '' : F.min + ' 分钟'}</p>
      ${F.running ? '<button class="tongue light" data-fstop>摊开，停下</button>' : '<button class="tongue" data-fstart>开始 · 让纸自己折</button>'}
      <p class="note">纸会随时间对折四次：折到最小，就结束了。今天已专注 ${D.FOCUS.filter((l) => new Date(l.at).toDateString() === new Date().toDateString()).reduce((a, l) => a + l.min, 0)} 分钟（示例）。</p>`, 300),
  ].join('');
}
function drawFocusSheet() {
  const el = $('#fsheet'); if (!el) return;
  const F = S.focus;
  const p = F.running ? Math.min(1, 1 - (F.end - Date.now()) / (F.min * 60000)) : 0;
  const k = Math.min(4, Math.floor(p * 4 + 1e-6)); // 已对折次数
  const W = 180 / Math.pow(2, Math.ceil(k / 2)), H = 180 / Math.pow(2, Math.floor(k / 2));
  const s = Math.max(0, Math.round((F.end - Date.now()) / 1000));
  el.innerHTML = `<div class="part" style="left:${(180 - W) / 2}px;top:${(180 - H) / 2}px;width:${W}px;height:${H}px;background-image:${k ? 'repeating-linear-gradient(90deg,#0000 0 ' + (W - 1) + 'px,#0002 ' + (W - 1) + 'px ' + W + 'px)' : 'none'}"><span class="left">${F.running ? Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') : ''}</span></div>`;
  const fl = $('#fleft'); if (fl && F.running) fl.textContent = ['刚开始', '对折了一次', '折成四分之一', '折成八分之一', '最后一折'][k];
}
let fTimer = 0;

/* ════════════════════ D · 校园 ════════════════════ */
const PLACES = ['lanshu', 'beimen', 'nanmen', 'yihao', 'erhao', 'sanhao', 'sihao', 'keji', 'kexue', 'library', 'yanchi', 'hujulongpan', 'fengqitang', 'yanlintang', 'yishu', 'yundong', 'canteen1', 'canteen3', 'zhiwuyuan', 'xiaoyouhui', 'dorm_f', 'dorm_m'];
const B = Object.fromEntries(C.b.map((b) => [b.id, b]));
function vMap() {
  const M = S.map, b = B[M.sel];
  return [
    pn('plan', '校园 · 纸雕', `${pull('rise', Math.round(M.rise * 100), 0, 100, 1, '把校园从纸上立起来', (v) => v + '%')}
      <div class="pop-stage" id="popStage"></div>
      <p class="note">0% 是平面图，100% 是立起来的整座校园——同一张纸、同一套坐标。点一栋楼选中它。平面来自项目既有近似数据，方向与精度未独立复核。</p>`, 560),
    pn('place', b.n, `${b.img ? `<img class="img" src="${R + b.img}" alt="${esc(b.n)}" loading="lazy">` : ''}<p class="big" style="font-size:26px">${esc(b.n)}</p><p class="p">${esc(b.d || b.c)}</p>
      <p class="note">${b.f ? b.f + ' 层 · ' : ''}${esc(b.c)}${b.img ? ' · 图片来源：海南中学官网，经 HAIZ 既有页面使用' : ''}</p>
      <hr class="crease">${fan('time', ['此刻', '清晨', '正午', '傍晚', '夜里'], M.time, '校园停在')}
      <a class="tongue" href="${R}campus-3d.html" style="text-decoration:none">走进第一人称校园</a> <a class="tongue light" href="${R}index.html#map" style="text-decoration:none">去六幕第四幕</a>`, 360),
  ].join('');
}
function buildPlan() {
  const st = $('#popStage'); if (!st) return;
  const bs = C.b.filter((b) => b.k !== 'corr' || true);
  const core = C.b.filter((b) => b.k !== 'corr');
  const xs = core.flatMap((b) => [b.r[0], b.r[2]]), ys = core.flatMap((b) => [b.r[1], b.r[3]]);
  const x0 = Math.min(...xs) - 30, x1 = Math.max(...xs) + 30, y0 = Math.min(...ys) - 30, y1 = Math.max(...ys) + 30;
  const Wd = st.clientWidth || 500; const k = Wd / (x1 - x0); const Hd = (y1 - y0) * k;
  const X = (x) => (x - x0) * k, Y = (y) => (y1 - y) * k; // 北在上
  const rise = S.map.rise;
  const tint = ['', 'sepia(.25)', '', 'sepia(.5) saturate(1.4)', 'brightness(.55) hue-rotate(190deg)'][S.map.time];
  let h = `<div class="plane" id="plane" style="width:${Wd}px;height:${Hd}px;transform:rotateX(${rise * 52}deg) rotateZ(${rise * -18}deg) scale(${1 - rise * 0.12});filter:${tint}">`;

      E.form = reg ? '演示环境不创建真实账号。' : '账号或口令不对。';
    }
    fold(); L.err = E; const keep = { user: f.user.value, nick: f.nick?.value };
    setTimeout(() => { render(); const nf = $('#loginForm'); if (nf) { nf.user.value = keep.user; if (nf.nick) nf.nick.value = keep.nick || ''; (nf.querySelector('[aria-invalid="true"]') || nf.pass).focus(); } }, HZ.reduced() ? 0 : 300);
  }
});
document.addEventListener('input', (e) => {
  // 改好了，折痕才平
  const fd = e.target.closest('.field.err'); if (fd && e.target.form?.id === 'loginForm') { fd.classList.remove('err'); const m = fd.querySelector('.msg'); if (m) m.textContent = ''; e.target.removeAttribute('aria-invalid'); }
});
// 撕线：沿齿孔拖
let tearing = null;
document.addEventListener('pointerdown', (e) => { const l = e.target.closest('[data-tear]'); if (!l) return; tearing = { l, x0: e.clientX, w: l.getBoundingClientRect().width }; l.setPointerCapture(e.pointerId); });
document.addEventListener('pointermove', (e) => { if (!tearing) return; const p = Math.max(0, Math.min(1, (e.clientX - tearing.x0) / tearing.w)); tearing.l.style.setProperty('--tear', p); tearing.p = p; });
document.addEventListener('pointerup', () => { if (!tearing) return; const { l, p } = tearing; tearing = null; if (p > 0.85) tear(l.dataset.tear); else l.style.setProperty('--tear', 0); });
function tear(id) {
  const el = document.querySelector(`[data-perf="${id}"]`); if (!el) return;
  el.classList.add('torn');
  setTimeout(() => {
    if (id === 'wipe') { try { Object.keys(localStorage).filter((k) => k.startsWith('hz-zhe-')).forEach((k) => localStorage.removeItem(k)); } catch {} S.tasks = D.TASKS.map((t) => ({ ...t })); S.pref = { motion: 0, size: 0, theme: 0, sync: false, leaf: false, intake: false }; S.folded = {}; applyPref(); toast('已清除'); }
    else { const d = S.devices.find((x) => x.id === id); S.devices = S.devices.filter((x) => x.id !== id); toast('「' + (d ? d.name : '') + '」已退出'); }
    render();
  }, HZ.reduced() ? 0 : 520);
}
// 在折痕条上竖拖/横拖也能展开（加速手势；点击永远可用）
addEventListener('resize', () => { if (S.view === 'map') buildPlan(); });

applyPref();
S.view = VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : 'home';
render();
if (new URLSearchParams(location.search).has('embed')) document.querySelector('[data-lab]').style.display = 'none';
</script>
