<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut">
<title>句读 · HAIZ 设计实验室</title>
<meta name="description" content="方案一「句读」：界面是一句可以改写的话。横着读是句子，竖着换是选择。">
<link rel="stylesheet" href="../shared/fonts.css">
<style>
/* ───────────────────────── 句读 · Tokens ─────────────────────────
   只有三样东西：纸、墨、朱。层级靠字号与位置，不靠容器。 */
:root{
  --paper:#ffffff; --ink:#151515; --ink2:#55524c; --ink3:#8d8980; --rule:#e6e2da;
  --zhu:#c8371d; --zhu-soft:#c8371d22; --hl:#fff3c4;
  --serif:"HZ Serif","Noto Serif CJK SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --fs:1; /* 用户字号（设置里改） */
  --jing:calc(clamp(24px, 2.35vw + 8px, 42px) * var(--fs));   /* 经：主句 */
  --body:calc(clamp(17px, .35vw + 15px, 20px) * var(--fs));   /* 疏：正文 */
  --t-fast:140ms; --t-mid:260ms; --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
:root[data-theme="dark"]{ --paper:#111110; --ink:#ecebe6; --ink2:#b5b1a8; --ink3:#7d796f; --rule:#2b2a27; --zhu:#ff6a4a; --zhu-soft:#ff6a4a26; --hl:#3a3313; color-scheme:dark }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --paper:#111110; --ink:#ecebe6; --ink2:#b5b1a8; --ink3:#7d796f; --rule:#2b2a27; --zhu:#ff6a4a; --zhu-soft:#ff6a4a26; --hl:#3a3313; color-scheme:dark } }
:root[data-motion="reduce"]{ --t-fast:0ms; --t-mid:0ms }

*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--serif);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;min-height:100vh;min-height:100dvh}
button,input{font:inherit;color:inherit}
a{color:inherit}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ───────── 版面：桌面是一页书；主句在上，疏在下 ───────── */
.page{max-width:1180px;margin:0 auto;padding:clamp(28px,5vw,72px) clamp(16px,5vw,72px) 140px;display:grid;grid-template-columns:minmax(0,1fr) 15em;gap:0 clamp(24px,4vw,64px)}
.margin{grid-column:2;grid-row:1 / span 3;font-family:var(--sans);font-size:13px;line-height:1.7;color:var(--ink3);padding-top:.6em}
.margin p{margin:0 0 1.2em}
.margin b{color:var(--ink2);font-weight:600}
.main-clause{grid-column:1;font-size:var(--jing);line-height:1.6;letter-spacing:.02em;margin:0 0 .3em}
.written{grid-column:1;font-size:15px;line-height:1.8;color:var(--ink3);min-height:1.8em;margin-bottom:.4em}
.written button{background:none;border:0;padding:0;cursor:pointer;color:inherit;text-decoration:none}
.written button:hover{color:var(--ink)}
.view{grid-column:1}
.view .jing{font-size:var(--jing);line-height:1.62;letter-spacing:.02em;margin:.55em 0 0;max-width:22em}
.view .jing.s{font-size:calc(var(--jing)*.72)}
.shu{font-size:var(--body);line-height:1.85;color:var(--ink);margin:.7em 0 .4em;padding-left:1.1em;border-left:1px solid var(--zhu);max-width:36em}
.shu p{margin:.2em 0 .7em}
.shu .note{font-family:var(--sans);font-size:13px;color:var(--ink3);line-height:1.6}
.shu figure{margin:.4em 0 .8em}
.shu img{display:block;max-width:100%;height:auto;max-height:340px;object-fit:cover}
.shu figcaption{font-family:var(--sans);font-size:12.5px;color:var(--ink3);margin-top:.35em}
.ex{font-family:var(--sans);font-size:.42em;letter-spacing:.08em;color:var(--zhu);border:1px solid currentColor;padding:.05em .35em;vertical-align:.55em;margin:0 .3em;white-space:nowrap}

/* ───────── 词钮：带着重号的词，可以换 ───────── */
.w{display:inline;background:none;border:0;padding:0 .02em;margin:0;cursor:pointer;
   text-emphasis:filled dot var(--zhu);-webkit-text-emphasis:filled dot var(--zhu);
   text-emphasis-position:under right;-webkit-text-emphasis-position:under;
   border-radius:2px;transition:background var(--t-fast) var(--ease);position:relative;line-height:inherit;white-space:nowrap}
.w:hover{background:var(--zhu-soft)}
.w:focus-visible{outline:2px solid var(--zhu);outline-offset:3px}
.w[aria-expanded="true"]{color:var(--zhu)}
.w .v{display:inline-block}
.w.num{font-variant-numeric:tabular-nums;cursor:ns-resize;touch-action:none}
.w.act{color:var(--zhu);text-emphasis:none;-webkit-text-emphasis:none;border-bottom:1px solid currentColor}
.w.done{text-decoration:line-through;text-decoration-color:var(--zhu);text-decoration-thickness:1px;color:var(--ink3)}
.w.now{background:var(--hl)}
/* 链接也是词：去别处的词用空心着重号 */
.w.srch{text-emphasis:none;-webkit-text-emphasis:none;border-bottom:1.5px solid var(--ink)}
.w.go{text-emphasis:open circle var(--zhu);-webkit-text-emphasis:open circle var(--zhu)}

/* ───────── 补白：要你写的地方 ───────── */
.blank{display:inline-block;position:relative;vertical-align:baseline;margin:0 .12em}
.blank input{border:0;border-bottom:1.5px solid var(--ink);background:transparent;outline:0;padding:0 .1em;width:auto;min-width:3.5em;max-width:12em;font-size:1em;line-height:1.25;border-radius:0}
.blank input::placeholder{color:var(--ink3);opacity:1}
.blank input:focus{border-bottom-color:var(--zhu);background:var(--zhu-soft)}
.blank input[aria-invalid="true"]{border-bottom-color:var(--zhu);border-bottom-style:dashed}

/* ───────── 句读：标点就是状态与提交 ───────── */
.stop{background:none;border:0;padding:0 .08em;margin:0;cursor:pointer;font-size:1em;line-height:1;color:var(--ink);position:relative;font-family:var(--serif)}
.stop[data-s="ok"]{color:var(--zhu)}
.stop[data-s="ok"]::after{content:"";position:absolute;inset:-.35em -.3em;border-radius:50%;border:1px solid var(--zhu);opacity:.0;transform:scale(.6);transition:all var(--t-mid) var(--ease)}
.stop[data-s="ok"]:hover::after,.stop[data-s="ok"]:focus-visible::after{opacity:1;transform:scale(1)}
.stop[data-s="err"]{color:var(--zhu)}
.stop[data-s="wait"]{color:var(--ink3);cursor:help}
.stop[data-s="busy"] .dots{display:inline-block;animation:breathe 1.1s infinite}
.stop:focus-visible{outline:none}
.stop:focus-visible{text-shadow:0 0 0 var(--zhu)}
@keyframes breathe{50%{opacity:.25}}
.hint-stop{font-family:var(--sans);font-size:12px;color:var(--ink3);margin-left:.4em;vertical-align:.6em;white-space:nowrap}

/* ───────── 夹注：双行小字，嵌在句中 ───────── */
.jz{display:inline-flex;flex-direction:column;vertical-align:middle;font-size:max(11px,.36em);line-height:1.3;margin:0 .35em;color:var(--ink2);font-family:var(--serif);letter-spacing:.04em;max-width:22em;text-align:left}
.jz.zhu{color:var(--zhu)}
.nb{white-space:nowrap}
.jz span{white-space:nowrap}
.jz.wrap span{white-space:normal}

/* ───────── 聚合栏：竖着展开的选择 ───────── */
#para{position:fixed;z-index:50;display:none;flex-direction:column;background:var(--paper);box-shadow:0 0 0 1px var(--rule),0 18px 50px -20px #0004;padding:.15em .25em;margin:0;list-style:none;overflow:auto;overscroll-behavior:contain;scrollbar-width:none;max-height:72vh;transform-origin:left center}
#para.on{display:flex;animation:paraIn var(--t-mid) var(--ease)}
@keyframes paraIn{from{clip-path:inset(45% 0 45% 0)}to{clip-path:inset(0 0 0 0)}}
#para li{padding:.08em .35em;cursor:pointer;white-space:nowrap;color:var(--ink3);border-radius:2px;line-height:1.5;position:relative}
#para li[aria-selected="true"]{color:var(--ink);background:var(--zhu-soft)}
#para li.cur{color:var(--zhu)}
#para li.cur::before{content:"";position:absolute;left:-.12em;top:.35em;bottom:.35em;width:2px;background:var(--zhu)}
#para li small{font-family:var(--sans);font-size:.38em;color:var(--ink3);margin-left:.6em;letter-spacing:.04em;vertical-align:.4em}
#para li[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
#veil{position:fixed;inset:0;z-index:49;display:none}
#veil.on{display:block}

/* ───────── 旁白：同时在进行的事 ───────── */
.aside{position:fixed;left:0;right:0;bottom:0;z-index:20;font-family:var(--sans);font-size:13px;color:var(--ink2);background:linear-gradient(transparent,var(--paper) 40%);padding:28px clamp(16px,5vw,72px) max(14px,env(safe-area-inset-bottom));pointer-events:none}
.aside .in{max-width:1180px;margin:0 auto;pointer-events:auto}
.aside button{background:none;border:0;padding:0;cursor:pointer;color:inherit;border-bottom:1px dotted var(--ink3)}
.aside .sep{margin:0 .5em;color:var(--ink3)}
.lab-tag{position:fixed;top:12px;right:14px;z-index:30;font-family:var(--sans);font-size:12px;color:var(--ink3);text-decoration:none}
.lab-tag:hover{color:var(--zhu)}

/* 表：疏里的表格，像书里的表 */
table.t{border-collapse:collapse;font-size:.88em;font-variant-numeric:tabular-nums;margin:.3em 0 .8em;width:100%;max-width:34em}
table.t th{font-family:var(--sans);font-weight:500;font-size:.78em;color:var(--ink3);text-align:left;border-bottom:1px solid var(--ink);padding:.2em .6em .2em 0}
table.t td{border-bottom:1px solid var(--rule);padding:.25em .6em .25em 0}
table.t tr.cur td{color:var(--zhu)}

/* 地图 */
.plan{width:100%;max-width:640px;height:auto;display:block;touch-action:manipulation}
.plan .rd{fill:var(--rule)}
.plan .gr{fill:none;stroke:var(--ink3);stroke-width:1;stroke-dasharray:2 3;opacity:.6}
.plan .bd{fill:var(--paper);stroke:var(--ink);stroke-width:1.2;cursor:pointer;transition:fill var(--t-fast)}
.plan .bd:hover{fill:var(--zhu-soft)}
.plan .bd.from{fill:var(--ink)}
.plan .bd.to{fill:var(--zhu);stroke:var(--zhu)}
.plan .route{fill:none;stroke:var(--zhu);stroke-width:3;stroke-dasharray:8 6;stroke-linecap:round}
.plan text{font-family:var(--sans);font-size:30px;fill:var(--ink2);pointer-events:none}
.plan .lbl-to{fill:var(--zhu);font-weight:600}

/* 单摆 */
.pend{float:right;width:min(42%,220px);margin:0 0 .5em 1em}
.pend line{stroke:var(--ink);stroke-width:1.2}
.pend circle.bob{fill:var(--ink)}
.pend .arc{fill:none;stroke:var(--zhu);stroke-dasharray:3 4}
.progress-marks{font-size:20px;letter-spacing:.18em;color:var(--rule)}
.progress-marks i{font-style:normal}
.progress-marks i.r{color:var(--zhu)}

.flash{animation:flash 900ms var(--ease)}
@keyframes flash{0%{background:var(--hl)}100%{background:transparent}}

/* ───────── 手机：主句沉到拇指边，疏在上方 ───────── */
@media (max-width: 720px){
  .page{display:block;padding:20px 16px 0}
  .margin{display:none}
  .written{display:none}
  .view .jing{max-width:none}
  .main-clause{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--paper);margin:0;padding:10px 16px max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--rule);font-size:calc(22px*var(--fs));line-height:1.5}
  .aside{bottom:calc(58px + env(safe-area-inset-bottom));background:none;padding:6px 16px;font-size:12px}
  .aside .in{background:var(--paper)}
  .view{padding-bottom:150px}
  .shu{padding-left:.8em}
  .pend{width:40%}
  #para li{line-height:1.9}
  .jz{font-size:max(12px,.42em)}
}
@media (prefers-reduced-motion: reduce){ :root:not([data-motion="normal"]){--t-fast:0ms;--t-mid:0ms} }
</style>
</head>
<body>
<a class="lab-tag" href="../index.html" data-lab>设计实验室 · 方案一「句读」</a>
<div class="page">
  <div class="written" id="written" aria-label="已经写下的句子"></div>
  <h1 class="main-clause" id="main"></h1>
  <aside class="margin" id="margin"></aside>
  <main class="view" id="view" tabindex="-1"></main>
</div>
<div class="aside" id="aside" aria-live="polite"><div class="in" id="asideIn"></div></div>
<div id="veil"></div>
<ul id="para" role="listbox" aria-label="可以换成"></ul>
<div class="sr" id="live" aria-live="assertive"></div>

<script src="../shared/data.js"></script>
<script src="../shared/campus.js"></script>
<script>
/* ════════════════════════════════════════════════════════════════
   句读 · 引擎
   规则只有四条：
   1. 横着读是句子（组合），竖着换是选择（聚合）。
   2. 带实心着重号的词可以换；空心圈的词带你去别处；下划线是要你写的空。
   3. 句末的标点就是状态：？还缺东西 · 。可以落定（按下它）· ！出了问题 · …… 正在进行。
   4. 内容不装进卡片：短的注成句中的双行夹注，长的写成句下的「疏」。
   ════════════════════════════════════════════════════════════════ */
const D = window.HAIZ_SAMPLE, C = window.HAIZ_CAMPUS, R = HZ.root;
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('hz-judou-' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('hz-judou-' + k, JSON.stringify(v)); } catch {} },
};

/* ── 全局状态（演示状态，只存本机）── */
const S = {
  view: 'home',
  written: [],
  pref: store.get('pref', { motion: 0, size: 0, theme: 0, sync: 0, leaf: 0, intake: 0 }),
  tasks: store.get('tasks', D.TASKS.map((t) => ({ ...t }))),
  inbox: D.INBOX.map((i) => ({ ...i })),
  focus: { min: 25, subj: 0, running: false, end: 0, paused: 0 },
  focusLog: D.FOCUS.slice(),
  day: HZ.today(),
  week: false,
  login: { mode: 0, user: '', pass: '', pass2: '', nick: '', show: false, keep: 0, state: 'idle', err: '', agree: false },
  authed: store.get('authed', false),
  home: { verb: 0, obj: 0 },
  map: { from: 'lanshu', to: 'library', how: 0, time: 0 },
  lab: { L: 1.0, n: 30, deg: 4, t: null, rows: [], jitter: 0.12 },
  devices: D.ACCOUNT.devices.map((d) => ({ ...d })),
  confirm: null,
  syncErr: false,
};

/* ── 词的定义：每个视图渲染时登记 ── */
let DEFS = {};
function def(id, d) { DEFS[id] = d; return id; }
function w(id, extraCls = '') {
  const d = DEFS[id];
  const label = d.num ? d.fmt(d.get()) : (d.label ? d.label() : d.opts[d.get()]);
  const cls = ['w', d.num ? 'num' : '', d.go ? 'go' : '', extraCls].join(' ');
  const aria = d.go ? `aria-label="${esc(label)}（打开）"` : `aria-haspopup="listbox" aria-expanded="false" aria-label="${esc((d.name || '') + '：' + label + '，可以换')}"`;
  return `<button class="${cls}" data-w="${id}" data-k="w-${id}" ${aria}><span class="v">${esc(label)}</span></button>`;
}
/* 夹注：把一段话平均拆成两行 */
function jz(text, tone = '') {
  const t = String(text); const h = Math.ceil(t.length / 2);
  return `<span class="jz ${tone}" role="note"><span>${esc(t.slice(0, h))}</span><span>${esc(t.slice(h))}</span></span>`;
}
/* 补白 */
function blank(id, ph, attrs = '') {
  return `<span class="blank"><input data-k="in-${id}" data-in="${id}" placeholder="${esc(ph)}" aria-label="${esc(ph)}" size="${Math.max(4, ph.length + 1)}" ${attrs}></span>`;
}
/* 句读 */
function stop(id, s, label) {
  const g = { ok: '。', wait: '？', err: '！', busy: '<span class="dots">……</span>' }[s];
  const al = { ok: label || '落定（提交）', wait: '还缺东西', err: '出了问题', busy: '正在进行' }[s];
  return `<button class="stop" data-stop="${id}" data-s="${s}" data-k="stop-${id}" aria-label="${al}" ${s === 'busy' ? 'aria-busy="true"' : ''}>${g}</button>`;
}
const ex = '<span class="ex">示例</span>';

/* ════════════════════ 主句：我想……（导航即谓语） ════════════════════ */
const VIEWS = [
  { id: 'home', phrase: '看看 HAIZ' },
  { id: 'login', phrase: '登录' },
  { id: 'pocket', phrase: '安排今天' },
  { id: 'map', phrase: '在校园里走走' },
  { id: 'read', phrase: '读一页实验册' },
  { id: 'settings', phrase: '调整设置' },
];
function mainClause() {
  def('nav', {
    name: '我想', opts: VIEWS.map((v) => v.phrase),
    get: () => VIEWS.findIndex((v) => v.id === S.view),
    set: (i) => go(VIEWS[i].id),
    extra: true,
  });
  def('search', { name: '找', label: () => '我想', opts: [], get: () => 0, set: () => {}, search: true });
  return `<button class="w srch" data-w="search" data-k="w-search" aria-label="搜索：输入你想做的事" title="搜索（/）">我想</button> ${w('nav')}。`;
}

/* ════════════════════ A · 首页 ════════════════════ */
const VERBS = [...new Set(D.WORKS.map((x) => x.verb))];
function vHome() {
  const now = new Date();
  const objs = D.WORKS.filter((x) => x.verb === VERBS[S.home.verb]);
  if (S.home.obj >= objs.length) S.home.obj = 0;
  const work = objs[S.home.obj];
  def('verb', { name: '动词', opts: VERBS, get: () => S.home.verb, set: (i) => { S.home.verb = i; S.home.obj = 0; } });
  def('obj', { name: '去处', opts: objs.map((x) => x.name), get: () => S.home.obj, set: (i) => { S.home.obj = i; } });
  def('allobj', { name: '所有去处', opts: D.WORKS.map((x) => x.verb + ' ' + x.name), get: () => D.WORKS.indexOf(work), set: (i) => { const x = D.WORKS[i]; S.home.verb = VERBS.indexOf(x.verb); S.home.obj = D.WORKS.filter((y) => y.verb === x.verb).indexOf(x); } });
  const todo = S.tasks.filter((t) => !t.done);
  const next = nextCourse();
  def('toPocket', { go: true, label: () => todo.length + ' 件事', set: () => go('pocket') });
  def('toNext', { go: true, label: () => next ? next.name : '没有课', set: () => go('pocket') });
  def('toMap', { go: true, label: () => '百年榄仁树', set: () => go('map') });
  return `
  <p class="jing">今天是 ${now.getMonth() + 1} 月 ${now.getDate()} 日，星期${HZ.wd(now.getDay())}，海口${D.WEATHER.label}${jz('示例天气，不是实时数据')}。</p>
  <p class="jing">这里是一所中学的数字校园${jz('海南中学府城校区 · 学生建设的非官方项目')}，从一棵 ${w('toMap')} 开始。</p>
  <p class="jing" id="homeQ">我想 ${w('verb')} ${w('obj')}${stop('openWork', 'ok', '打开 ' + work.name)}</p>
  <div class="shu" data-k="shu-work">
    <p><b>${esc(work.name)}</b>　${esc(work.line)}</p>
    ${work.img ? `<figure><img src="${R + work.img}" alt="${esc(work.name)} 的画面" loading="lazy"><figcaption>HAIZ 已有作品的开发截图（软件渲染），不是实机录屏。</figcaption></figure>` : ''}
    <p class="note">按句末的「。」就去这里。换动词，能去的地方跟着变；也可以 ${w('allobj')} 直接挑。</p>
  </div>
  <p class="jing s">或者，今天还有 ${w('toPocket')} 等着我；下一节是 ${w('toNext')}${next ? jz(HZ.mm(next.start) + ' · ' + next.room) : ''}。</p>`;
}
function nextCourse() {
  const m = HZ.minuteNow();
  return D.COURSES.filter((c) => c.day === S.day).sort((a, b) => a.start - b.start).find((c) => c.end > m) || null;
}

/* ════════════════════ B · 登录与注册 ════════════════════ */
const DEMO_USER = 'sample_01', DEMO_PASS = 'haiz2026';
function vLogin() {
  const L = S.login;
  if (S.authed) {
    def('logout', { go: true, label: () => '退出登录', set: () => { S.authed = false; store.set('authed', false); L.state = 'idle'; L.pass = ''; } });
    def('toSettings', { go: true, label: () => '个人空间', set: () => go('settings') });
    return `<p class="jing">欢迎回来，${esc(D.ACCOUNT.name)}${ex}。</p>

  def('newDue', { name: '截止', opts: ['今天', '明天', '后天', '这周五', '不定日子'], get: () => S.newDue || 0, set: (i) => { S.newDue = i; } });

function saveTasks() { store.set('tasks', S.tasks); }
function taskAct(t, i) {

function inboxAct(it, i) {
  if (i === 0 || i === 1) {
    S.tasks.push({ id: 'n' + Date.now(), title: it.guess.title, subject: it.guess.subject, due: it.guess.due, done: false, example: true, source: it.from });

function fmtLeft() { const s = Math.max(0, Math.round((S.focus.end - Date.now()) / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
let focusTimer = 0;

const PLACES = ['lanshu', 'beimen', 'nanmen', 'yihao', 'erhao', 'sanhao', 'sihao', 'keji', 'kexue', 'library', 'yanchi', 'hujulongpan', 'fengqitang', 'yanlintang', 'yishu', 'yundong', 'canteen1', 'canteen3', 'zhiwuyuan', 'xiaoyouhui'];
const B = Object.fromEntries(C.b.map((b) => [b.id, b]));
const ctr = (b) => [(b.r[0] + b.r[2]) / 2, (b.r[1] + b.r[3]) / 2];
function vMap() {
  const M = S.map;
  const names = PLACES.map((id) => B[id].n);
  def('from', { name: '我在', opts: names, get: () => PLACES.indexOf(M.from), set: (i) => { M.from = PLACES[i]; } });
  def('to', { name: '想去', opts: names, get: () => PLACES.indexOf(M.to), set: (i) => { M.to = PLACES[i]; } });
  def('how', { name: '怎么去', opts: ['走过去', '骑车过去', '只在图上看看'], get: () => M.how, set: (i) => { M.how = i; } });
  def('time', { name: '时间', opts: ['此刻', '清晨', '正午', '傍晚', '夜里'], get: () => M.time, set: (i) => { M.time = i; } });
  const a = B[M.from], b = B[M.to];
  const [ax, ay] = ctr(a), [bx, by] = ctr(b);
  const meters = Math.round((Math.abs(ax - bx) + Math.abs(ay - by)) * 0.167);
  const speed = [1.2, 3.5, 0][M.how];
  const mins = speed ? Math.max(1, Math.round(meters / speed / 60)) : 0;
  // 途经：路线 L 形拐点附近最近的地标
  const via = PLACES.filter((id) => id !== M.from && id !== M.to).map((id) => { const [x, y] = ctr(B[id]); return [id, Math.hypot(x - bx, y - ay)]; }).sort((p, q) => p[1] - q[1])[0];
  def('via', { go: true, label: () => B[via[0]].n, set: () => { M.to = via[0]; } });
  def('enter', { go: true, label: () => '第一人称校园', href: R + 'campus-3d.html' });
  def('act4', { go: true, label: () => '六幕的第四幕', href: R + 'index.html#map' });
  const tint = ['', 'filter:sepia(.25) hue-rotate(-10deg)', '', 'filter:sepia(.5) saturate(1.3)', 'filter:invert(.88) hue-rotate(180deg)'][M.time];
  return `
  <p class="jing">我在 ${w('from')}，想去 ${w('to')}，${w('how')}。</p>
  <p class="jing s">${speed ? `大约 ${meters} 米，${mins} 分钟${jz('沿校园主轴折线估算，不是实地导航')}，途中会经过 ${w('via')}。` : `${esc(b.n)} 在 ${esc(a.n)} 的${dirWord(ax, ay, bx, by)}，相距约 ${meters} 米。`}</p>
  <div class="shu" data-k="shu-map" style="max-width:40em">
    ${planSVG(M.from, M.to, tint)}
    <p class="note">在图上点一栋楼，它就填进「想去」；按住 Shift（或长按）就填进「我在」。平面来自项目既有的近似数据，方向与精度未独立复核，北在上。</p>
  </div>
  <div class="shu" data-k="shu-place">
    ${b.img ? `<figure><img src="${R + b.img}" alt="${esc(b.n)}" loading="lazy" style="max-height:220px"><figcaption>图片来源：海南中学官网，经 HAIZ 既有页面使用。</figcaption></figure>` : ''}
    <p><b>${esc(b.n)}</b>　${esc(b.d || b.c)}</p>
  </div>
  <p class="jing s">校园停在 ${w('time')}。走进去，可以打开 ${w('enter')}，或者回到 ${w('act4')} 看它从水面里升起。</p>`;
}
function dirWord(ax, ay, bx, by) { const dx = bx - ax, dy = by - ay; const ang = Math.atan2(dy, dx) * 180 / Math.PI; const dirs = ['东', '东北', '北', '西北', '西', '西南', '南', '东南']; return dirs[((Math.round(ang / 45) % 8) + 8) % 8] + '面'; }
function planSVG(from, to, style) {
  const bs = C.b.filter((b) => b.k !== 'corr');
  const xs = bs.flatMap((b) => [b.r[0], b.r[2]]), ys = bs.flatMap((b) => [b.r[1], b.r[3]]);
  const x0 = Math.min(...xs) - 40, x1 = Math.max(...xs) + 40, y0 = Math.min(...ys) - 40, y1 = Math.max(...ys) + 40;
  const H = y1 - y0; const fy = (y) => y1 - y + y0; // 翻转：北在上
  const rect = (r, cls, extra = '') => `<rect class="${cls}" x="${r[0]}" y="${fy(r[3])}" width="${r[2] - r[0]}" height="${r[3] - r[1]}" ${extra}/>`;
  const [ax, ay] = ctr(B[from]), [bx, by] = ctr(B[to]);
  const lb = (id, cls) => { const b = B[id]; const [x, y] = ctr(b); return `<text x="${x}" y="${fy(b.r[3]) - 12}" text-anchor="middle" class="${cls}">${esc(b.n)}</text>`; };
  return `<svg class="plan" viewBox="${x0} ${y0} ${x1 - x0} ${H}" role="img" aria-label="校园平面示意：从${esc(B[from].n)}到${esc(B[to].n)}" style="${style}">
    ${C.roads.map((r) => rect(r, 'rd')).join('')}
    ${C.green.map((g) => rect(g.r, 'gr')).join('')}
    ${bs.map((b) => rect(b.r, 'bd' + (b.id === from ? ' from' : '') + (b.id === to ? ' to' : ''), `data-b="${b.id}"><title>${esc(b.n)}</title></rect`)).join('').replace(/\/><title>/g, '><title>').replace(/<\/title><\/rect\/>/g, '</title></rect>')}
    <path class="route" d="M${ax} ${fy(ay)} L${bx} ${fy(ay)} L${bx} ${fy(by)}"/>
    ${lb(from, '')}${lb(to, 'lbl-to')}
  </svg>`;
}

    if (g.parentElement.classList.contains('nb')) return;
    const nb = document.createElement('span'); nb.className = 'nb';

    if (prev && prev.nodeType === 3 && prev.textContent.length) { const t = prev.textContent; prev.textContent = t.slice(0, -1); nb.appendChild(document.createTextNode(t.slice(-1))); }
    else if (prev && prev.nodeType === 1 && !prev.matches('p,div') && !prev.querySelector('input')) nb.appendChild(prev);

    if (next && next.nodeType === 3 && /^[，。；：、！？）」]/.test(next.textContent)) { nb.appendChild(document.createTextNode(next.textContent[0])); next.textContent = next.textContent.slice(1); }

  S.tasks.forEach((t) => I.push({ t: '做「' + t.title + '」', sub: '任务 · 示例', run: () => go('pocket') }));
  I.push({ t: '专注 25 分钟', run: () => { go('pocket'); startFocus(); render(); } });
  I.push({ t: '把字调大', run: () => { S.pref.size = 1; applyPref(); store.set('pref', S.pref); go('settings'); } });
  I.push({ t: '夜里的颜色', run: () => { S.pref.theme = 2; applyPref(); store.set('pref', S.pref); go('settings'); } });
  I.push({ t: '减少动画', run: () => { S.pref.motion = 1; applyPref(); store.set('pref', S.pref); go('settings'); } });
  I.push({ t: '测一下重力加速度', sub: '实验册 · 单摆', run: () => go('read') });
  return I;
}
function openSearch(el) {
  const main = $('#main');
  main.innerHTML = `我想 <span class="blank"><input id="q" placeholder="做什么？" aria-label="我想……（搜索）" autocomplete="off" size="8" role="combobox" aria-expanded="true" aria-controls="para"></span>${stop('q', 'wait')}`;
  const q = $('#q'); q.focus(); INDEX = buildIndex();
  const update = () => {
    const v = q.value.trim(); fit(q);
    const hits = (v ? INDEX.filter((x) => (x.t + (x.sub || '')).toLowerCase().includes(v.toLowerCase()) || [...v].every((ch) => (x.t + (x.sub || '')).includes(ch))) : INDEX.slice(0, 8)).slice(0, 9);
    P = { id: 'search', el: q, list: hits.map((h) => ({ label: h.t, run: h.run })), sel: 0, cur: 0, search: true };
    para.style.fontSize = getComputedStyle(q).fontSize;
    para.innerHTML = hits.length ? hits.map((h, i) => `<li role="option" id="po${i}" aria-selected="${i === 0}" data-i="${i}">${esc(h.t)}${h.sub ? `<small>${esc(h.sub)}</small>` : ''}</li>`).join('') : '<li aria-disabled="true">没有这样的句子，换个说法？</li>';
    para.classList.add('on'); veil.classList.add('on');
    const r = q.getBoundingClientRect(); const mobile = innerWidth <= 720;
    para.style.left = Math.max(8, Math.min(r.left, innerWidth - para.offsetWidth - 8)) + 'px';
    para.style.top = (mobile ? Math.max(8, r.top - para.offsetHeight - 8) : r.bottom + 6) + 'px';
    const stp = $('#main .stop'); if (stp) { stp.dataset.s = hits.length && v ? 'ok' : 'wait'; stp.textContent = hits.length && v ? '。' : '？'; }
  };
  q.addEventListener('input', update);
  q.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); movePara(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); movePara(-1); }
    else if (e.key === 'Enter') { e.preventDefault(); runSearch(P && P.sel); }
    else if (e.key === 'Escape') { P = null; para.classList.remove('on'); veil.classList.remove('on'); render(); }
  });
  update();
}
function runSearch(i) { if (!P || !P.search || !P.list[i]) return; const run = P.list[i].run; P = null; para.classList.remove('on'); veil.classList.remove('on'); run(); render(); }
para.addEventListener('click', (e) => { if (P && P.search) { const li = e.target.closest('li'); if (li && li.dataset.i != null) runSearch(+li.dataset.i); } }, true);

/* ════════════════════ 事件 ════════════════════ */
document.addEventListener('click', (e) => {
  const wEl = e.target.closest('.w');
  if (wEl && !(P && P.search)) { e.preventDefault(); if (P && P.el === wEl) return closePara(); openPara(wEl); return; }
  const st = e.target.closest('.stop'); if (st) return onStop(st);
  const bk = e.target.closest('[data-back]'); if (bk) { const i = +bk.dataset.back; const v = S.written[i]; S.written = S.written.slice(0, i); go(v, true); return; }
  const gt = e.target.closest('[data-goto]'); if (gt) return go(gt.dataset.goto);
  const bd = e.target.closest('[data-b]'); if (bd && S.view === 'map') { const id = bd.dataset.b; if (!PLACES.includes(id)) return toast(B[id].n + ' 不在地点列表里'); if (e.shiftKey) S.map.from = id; else S.map.to = id; render(); }
});
// 长按地图上的楼 = 我在
let lp = 0; document.addEventListener('pointerdown', (e) => { const bd = e.target.closest('[data-b]'); if (!bd) return; lp = setTimeout(() => { if (PLACES.includes(bd.dataset.b)) { S.map.from = bd.dataset.b; render(); lp = -1; } }, 550); });
document.addEventListener('pointerup', () => clearTimeout(lp));

document.addEventListener('input', (e) => {
  const k = e.target.dataset && e.target.dataset.in; if (!k) return;
  const v = e.target.value; fit(e.target);
  if (k === 'newTask') S.newTitle = v; else S.login[k] = v;
  if (S.login.state === 'err') S.login.state = 'idle';
  render();
});
document.addEventListener('keydown', (e) => {
  if (e.getModifierState && e.target.tagName === 'INPUT' && e.target.type === 'password') { const c = e.getModifierState('CapsLock'); if (c !== !!S.login.caps) { S.login.caps = c; render(); } }
  if (P && !P.search) {
    if (e.key === 'ArrowDown') { e.preventDefault(); movePara(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); movePara(-1); }
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pickPara(P.sel); }
    else if (e.key === 'Escape' || e.key === 'Tab') { e.preventDefault(); closePara(); }
    return;
  }
  const t = e.target;
  if (t.classList && t.classList.contains('w') && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    // 不打开栏，直接在词上换：↑↓
    e.preventDefault(); const d = DEFS[t.dataset.w]; if (!d || d.go || d.search) return;
    const dir = e.key === 'ArrowDown' ? 1 : -1;
    if (d.num) { d.set(Math.min(d.max, Math.max(d.min, +(d.get() + dir * d.step).toFixed(4)))); }
    else { const n = d.opts.length; d.set((d.get() + dir + n) % n); }
    lastPick = { id: t.dataset.w, dir }; const k = t.dataset.k; render(); const again = document.querySelector(`[data-k="${k}"]`); again && again.focus();
    return;
  }
  if (t.tagName === 'INPUT' && e.key === 'Enter') { e.preventDefault(); const st = t.closest('p')?.querySelector('.stop'); st && onStop(st); }
  if (e.key === '/' && t.tagName !== 'INPUT') { e.preventDefault(); openSearch(); }
});
// 在词上滚轮 / 竖拖 = 换（加速键，不是唯一入口）
document.addEventListener('wheel', (e) => {
  const t = e.target.closest('.w'); if (!t || P) return; const d = DEFS[t.dataset.w]; if (!d || d.go || d.search || !(d.num || d.opts.length > 2)) return;
  e.preventDefault(); const dir = e.deltaY > 0 ? 1 : -1;
  if (d.num) d.set(Math.min(d.max, Math.max(d.min, +(d.get() + dir * d.step).toFixed(4)))); else d.set(Math.min(d.opts.length - 1, Math.max(0, d.get() + dir)));
  lastPick = { id: t.dataset.w, dir }; render();
}, { passive: false });
let drag = null;
document.addEventListener('pointerdown', (e) => { const t = e.target.closest('.w.num'); if (!t) return; drag = { t, y: e.clientY, id: t.dataset.w, moved: false, k: t.dataset.k }; t.setPointerCapture(e.pointerId); });
document.addEventListener('pointermove', (e) => {
  if (!drag) return; const d = DEFS[drag.id]; const dy = drag.y - e.clientY;
  if (Math.abs(dy) > 14) { drag.moved = true; const dir = dy > 0 ? 1 : -1; d.set(Math.min(d.max, Math.max(d.min, +(d.get() + dir * d.step).toFixed(4)))); drag.y = e.clientY; lastPick = { id: drag.id, dir: -dir }; render(); drag.t = document.querySelector(`[data-k="${drag.k}"]`) || drag.t; }
});
document.addEventListener('pointerup', (e) => { if (drag && drag.moved) { e.preventDefault(); const t = drag.t; t && t.addEventListener('click', (ev) => ev.stopPropagation(), { once: true, capture: true }); } drag = null; }, true);

function onStop(st) {
  const id = st.dataset.stop, s = st.dataset.s;
  if (s === 'wait') {
    // ？：带你去缺的地方
    const missing = st.closest('p')?.querySelector('input:placeholder-shown, input[aria-invalid="true"]') || document.querySelector('#view input:placeholder-shown');
    if (missing) { missing.focus(); missing.closest('.blank').classList.add('flash'); setTimeout(() => missing.closest('.blank').classList.remove('flash'), 900); say('还缺：' + missing.placeholder); }
    return;
  }
  if (s !== 'ok' && id !== 'lab') return;
  if (id === 'nav') return;
  if (id === 'openWork') { const objs = D.WORKS.filter((x) => x.verb === VERBS[S.home.verb]); location.href = R + objs[S.home.obj].href; return; }
  if (id === 'login') return doLogin();
  if (id === 'addTask') {
    const due = new Date(); const di = S.newDue || 0; if (di === 1) due.setDate(due.getDate() + 1); if (di === 2) due.setDate(due.getDate() + 2); if (di === 3) due.setDate(due.getDate() + ((5 - due.getDay() + 7) % 7)); due.setHours(21, 0, 0, 0);
    S.tasks.push({ id: 'n' + Date.now(), title: S.newTitle.trim(), subject: SUBJ[S.newSubj || 0], due: di === 4 ? new Date(Date.now() + 30 * 864e5).toISOString() : due.toISOString(), done: false, example: false, source: '' });
    S.newTitle = ''; saveTasks(); say('记下了'); const inp = document.querySelector('[data-in="newTask"]'); if (inp) inp.value = ''; render(); return;
  }
  if (id === 'focus') { startFocus(); render(); return; }
}
function doLogin() {
  const L = S.login; L.state = 'busy'; render();
  setTimeout(() => {
    if (L.mode === 0) {
      if (L.user === DEMO_USER && L.pass === DEMO_PASS) { S.authed = true; store.set('authed', true); L.state = 'idle'; L.pass = ''; say('登录成功'); }
      else { L.state = 'err'; L.err = '账号或口令不对'; say('账号或口令不对'); }
    } else if (L.mode === 1) { L.state = 'err'; L.err = '演示环境不创建真实账号'; }
    else { L.state = 'idle'; toast('演示：找回请求不会真的发出。'); }
    render();
  }, 900);
}

/* ════════════════════ 导航 ════════════════════ */
function go(v, fromBack) {
  if (!VIEW_FN[v]) v = 'home';
  if (v !== S.view && !fromBack) S.written.push(S.view);
  S.view = v; S.confirm = null;
  if (location.hash.slice(1) !== v) history.pushState(null, '', '#' + v);
  render({ nav: true }); window.scrollTo({ top: 0, behavior: HZ.reduced() ? 'auto' : 'smooth' });
  $('#view').focus({ preventScroll: true });
}
addEventListener('popstate', () => { const v = location.hash.slice(1) || 'home'; if (v !== S.view) { S.view = VIEW_FN[v] ? v : 'home'; render({ nav: true }); } });
addEventListener('resize', () => placePara());

function say(t) { $('#live').textContent = t; }
function toast(t) {
  const p = document.createElement('p'); p.className = 'jing s flash'; p.style.color = 'var(--ink2)'; p.textContent = t;
  $('#view').appendChild(p); p.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); say(t); setTimeout(() => p.remove(), 6000);
}
function flash(sel) { const el = $(sel); if (el) { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); } }
function focusIn(k) { setTimeout(() => { const el = document.querySelector(`[data-in="${k}"]`); el && el.focus(); }, 30); }

applyPref();
S.view = VIEW_FN[location.hash.slice(1)] ? location.hash.slice(1) : 'home';
render({ fresh: true });
if (new URLSearchParams(location.search).has('embed')) document.querySelector('[data-lab]').style.display = 'none';
</script>
