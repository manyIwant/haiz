<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut">
<title>年轮 · HAIZ 设计实验室</title>
<meta name="description" content="方案三「年轮」：圆心是来处，外圈是此刻；转动是周期，向内是更深。所有界面都是同一种同心圆仪器。">
<style>
/* ───────────────────────── 年轮 · Tokens ─────────────────────────
   一件仪器：石墨底、骨白刻线、一种「此刻」的颜色。 */
:root{
  --bg:#0f1110; --bg2:#161917; --line:#e9e4d8; --dim:#e9e4d838; --faint:#e9e4d814; --text:#ecE8de; --text2:#b9b4a8; --text3:#7f7b72;
  --now:#cde36b; --now-soft:#cde36b26; --warn:#ff7a59; --past:#8fa7c9;
  --sans:-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei","WenQuanYi Zen Hei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --fs:1; --t:320ms; --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
:root[data-theme="light"]{ --bg:#efece4; --bg2:#e6e2d8; --line:#1e211f; --dim:#1e211f40; --faint:#1e211f12; --text:#1b1d1c; --text2:#4b4d4a; --text3:#7d7d76; --now:#5d7a00; --now-soft:#5d7a0022; --past:#3d5f93; color-scheme:light }
@media (prefers-color-scheme: light){ :root[data-theme="auto"]{ --bg:#efece4; --bg2:#e6e2d8; --line:#1e211f; --dim:#1e211f40; --faint:#1e211f12; --text:#1b1d1c; --text2:#4b4d4a; --text3:#7d7d76; --now:#5d7a00; --now-soft:#5d7a0022; --past:#3d5f93; color-scheme:light } }
:root[data-motion="reduce"]{ --t:0ms }
@media (prefers-reduced-motion: reduce){ :root:not([data-motion="normal"]){ --t:0ms } }

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
body{font-family:var(--sans);font-size:calc(15.5px*var(--fs));line-height:1.65;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
a{color:inherit}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--now);outline-offset:2px}

/* ───────── 版面：左边一件仪器，右边是准线指着的那一页 ───────── */
.app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(360px,.85fr)}
.dialwrap{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
#dial{width:min(100%, 96vh);height:min(100%, 96vh);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;overflow:visible}
#dial:active{cursor:grabbing}
.panel{position:relative;overflow-y:auto;padding:52px 48px 60px 36px;border-left:1px solid var(--faint);scrollbar-width:thin}
.panel::before{content:"";position:fixed;left:57.5%;top:50%;width:24px;height:1px;background:var(--now)}

/* SVG 仪器 */
.ring{fill:none;stroke:var(--dim);stroke-width:1}
.ring.active{stroke:var(--line);stroke-width:1.4}
.ring.future{stroke-dasharray:2 6}
.ringband{fill:none;stroke:transparent;stroke-width:46;cursor:grab}
.tick{stroke:var(--dim);stroke-width:1}
.tick.major{stroke:var(--text3)}
.it circle{fill:var(--bg);stroke:var(--line);stroke-width:1.2;transition:r var(--t) var(--ease)}
.it text{fill:var(--text2);font-size:15px;font-family:var(--sans);pointer-events:none;dominant-baseline:middle}
.it.sel circle{fill:var(--now);stroke:var(--now)}
.it.sel text{fill:var(--text);font-weight:600}
.it.hit circle{stroke:var(--now);stroke-width:3}
.it.warn circle{stroke:var(--warn)}
.it.done circle{fill:var(--dim);stroke:var(--dim)}
.it.done text{fill:var(--text3);text-decoration:line-through}
.it{cursor:pointer}
.arc{fill:none;stroke-linecap:butt}
.arc.course{stroke:var(--line);stroke-width:9;opacity:.55}
.arc.course.now{stroke:var(--now);opacity:1}
.arc.focus{stroke:var(--now);stroke-width:4}
.idx{stroke:var(--now);stroke-width:1.5}
.ringlabel{fill:var(--text3);font-size:12px;letter-spacing:.2em;font-family:var(--sans)}
.ringlabel.active{fill:var(--now)}
.core text{fill:var(--text);font-family:var(--sans);text-anchor:middle;dominant-baseline:middle}
.core circle{fill:var(--bg2);stroke:var(--dim)}
.core.go{cursor:pointer}
.core.go circle{stroke:var(--now);stroke-width:2}
.nav text{fill:var(--text3);font-size:14px;letter-spacing:.3em}
.nav .it.sel text{fill:var(--now);font-weight:600}
.nav .it circle{display:none}
.status{fill:none;stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset 500ms var(--ease),stroke var(--t)}
.bd{fill:var(--bg2);stroke:var(--text3);stroke-width:1.4;cursor:pointer}
.bd.sel{fill:var(--now);stroke:var(--now)}
.shadow{fill:#000;opacity:.35}
.rd{fill:var(--faint)}
.mins{fill:var(--text3);font-size:12px}
.node circle{fill:var(--bg);stroke:var(--line);stroke-width:1.5;cursor:grab}
.node.on circle{fill:var(--now);stroke:var(--now)}
.node text{fill:var(--text2);font-size:13px}
.node.drag circle{stroke-width:3}

/* 面板文字 */
.kicker{font-size:12px;letter-spacing:.24em;color:var(--text3);margin:0 0 10px;display:flex;gap:10px;align-items:center}
.kicker b{color:var(--now);font-weight:500}
h1.t{font-size:calc(32px*var(--fs));line-height:1.25;font-weight:600;margin:0 0 .35em;letter-spacing:.01em}
h2.t{font-size:calc(20px*var(--fs));font-weight:600;margin:1.6em 0 .5em}
.p{margin:.3em 0 .9em;color:var(--text)}
.note{font-size:calc(12.5px*var(--fs));color:var(--text3);line-height:1.6}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.ex{font-size:11px;letter-spacing:.12em;color:var(--now);border:1px solid currentColor;padding:0 .45em;margin-left:.4em;vertical-align:.15em;white-space:nowrap}
.img{display:block;width:100%;height:auto;max-height:260px;object-fit:cover;margin:8px 0 12px;border-radius:0;filter:saturate(.85)}
.row{display:flex;gap:12px;align-items:baseline;padding:10px 0;border-top:1px solid var(--faint)}
.row .m{flex:1;min-width:0}
.row small{display:block;color:var(--text3);font-size:12.5px}
.row small.late{color:var(--warn)}
.row.done .m b{text-decoration:line-through;color:var(--text3)}

/* 刻口按钮：一个带刻痕的圆，点它就是“做” */
.notchbtn{display:inline-flex;align-items:center;gap:10px;background:none;border:0;padding:8px 2px;cursor:pointer;color:var(--text);font-size:calc(15px*var(--fs))}
.notchbtn::before{content:"";flex:0 0 22px;height:22px;border-radius:50%;border:1.5px solid var(--line);background:conic-gradient(var(--bg) 0 340deg,var(--line) 340deg 360deg);transition:transform var(--t) var(--ease)}
.notchbtn:hover::before{transform:rotate(90deg)}
.notchbtn.primary::before{background:conic-gradient(var(--now) 0 340deg,var(--bg) 340deg 360deg);border-color:var(--now)}
.notchbtn[disabled]{opacity:.4;cursor:not-allowed}
.notchbtn.small{font-size:13px;padding:4px 2px}
.notchbtn.small::before{flex-basis:16px;height:16px}
.bar{display:flex;flex-wrap:wrap;gap:4px 18px;margin:10px 0}

/* 刻口选择：短弧上的几道刻痕 */
.notches{display:flex;align-items:flex-end;gap:0;margin:6px 0 16px;position:relative;height:52px}
.notches::before{content:"";position:absolute;left:0;right:0;bottom:16px;height:1px;background:var(--dim)}
.notches button{flex:1;position:relative;height:100%;background:none;border:0;cursor:pointer;color:var(--text3);font-size:13px;padding:0}
.notches button::after{content:"";position:absolute;left:50%;bottom:10px;width:1px;height:12px;background:var(--text3);transition:height var(--t) var(--ease),background var(--t)}
.notches button span{position:absolute;left:0;right:0;top:0}
.notches button[aria-checked="true"]{color:var(--text)}
.notches button[aria-checked="true"]::after{height:26px;width:3px;margin-left:-1px;background:var(--now)}
.lbl{font-size:13px;color:var(--text2)}

/* 闭环输入 */
.field{display:block;margin:16px 0 8px}
.field span{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text2);letter-spacing:.12em}
.field span em{font-style:normal;color:var(--warn);letter-spacing:0}
.field span em.ok{color:var(--now)}
.field input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--dim);padding:10px 0;font-size:calc(19px*var(--fs));outline:0;border-radius:0}
.field input:focus{border-bottom-color:var(--now)}
.field .eye{background:none;border:0;color:var(--text2);cursor:pointer;font-size:12.5px;padding:4px 0;float:right;margin-top:-34px}

/* 刻度弧（滑块） */
.arcs{display:flex;flex-wrap:wrap;gap:6px 18px;margin:8px 0}
.arcslider{width:132px;text-align:center;touch-action:none}
.arcslider svg{width:132px;height:80px;display:block;overflow:visible;cursor:pointer}
.arcslider .trk{fill:none;stroke:var(--dim);stroke-width:2}
.arcslider .val{fill:none;stroke:var(--now);stroke-width:3}
.arcslider .knob{fill:var(--bg);stroke:var(--now);stroke-width:2}
.arcslider .v{font-family:var(--mono);font-size:18px;margin-top:-30px;display:block;pointer-events:none}
.arcslider .l{font-size:12px;color:var(--text3);display:block;margin-top:6px}
.arcslider svg:focus-visible{outline:none}
.arcslider svg:focus-visible .knob{stroke-width:4}

/* 画满一圈才算数（危险操作） */
.hold{display:inline-flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;color:var(--warn);font-size:14px;padding:6px 0;touch-action:none;user-select:none;-webkit-user-select:none}
.hold svg{width:26px;height:26px;transform:rotate(-90deg)}
.hold .bgc{fill:none;stroke:var(--dim);stroke-width:2}
.hold .fg{fill:none;stroke:var(--warn);stroke-width:2.5;stroke-dasharray:69.1;stroke-dashoffset:69.1}

.search{display:block;margin:0 0 18px}
.search input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--dim);padding:8px 0;font-size:16px;outline:0}
.search input:focus{border-bottom-color:var(--now)}
.hits button{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--faint);padding:8px 0;cursor:pointer;color:var(--text)}
.hits small{color:var(--text3);margin-left:8px}
table.t{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:13px}
table.t th{text-align:left;color:var(--text3);font-weight:400;border-bottom:1px solid var(--dim);padding:4px 8px 4px 0}
table.t td{border-bottom:1px solid var(--faint);padding:5px 8px 5px 0}
.toast{visibility:hidden;position:fixed;left:50%;top:18px;transform:translate(-50%,-200%);background:var(--line);color:var(--bg);padding:8px 16px;font-size:14px;transition:transform var(--t) var(--ease);z-index:90;max-width:90vw}
.toast.on{visibility:visible;transform:translate(-50%,0)}
.lab-tag{position:fixed;top:12px;left:16px;z-index:30;font-size:11.5px;color:var(--text3);text-decoration:none}
.lab-tag:hover{color:var(--now)}
.hintline{position:absolute;left:16px;bottom:14px;font-size:12px;color:var(--text3);max-width:60%}
.pend line{stroke:var(--line);stroke-width:1.4}.pend circle{fill:var(--now)}

/* ───────── 手机：仪器缩到拇指所在的角上，只露出四分之一 ───────── */
@media (max-width: 760px){
  body{overflow:auto}
  .app{position:static;display:block}
  .panel{border:0;padding:44px 16px calc(var(--dialvis,320px) + 30px);overflow:visible;min-height:100vh}
  .panel::before{display:none}
  .dialwrap{position:fixed;right:0;bottom:0;width:var(--dialvis,320px);height:var(--dialvis,320px);overflow:visible;z-index:20;pointer-events:none}
  .dialwrap::before{content:"";position:absolute;right:calc(-1*var(--dialvis,320px));bottom:calc(-1*var(--dialvis,320px));width:calc(2*var(--dialvis,320px));height:calc(2*var(--dialvis,320px));border-radius:50%;background:radial-gradient(circle,var(--bg) 66%,transparent 71%);pointer-events:none}
  :root[data-hand="left"] .dialwrap{right:auto;left:0}
  :root[data-hand="left"] .dialwrap::before{right:auto;left:calc(-1*var(--dialvis,320px))}
  #dial{position:absolute;width:calc(2*var(--dialvis,320px));height:calc(2*var(--dialvis,320px));right:calc(-1*var(--dialvis,320px));bottom:calc(-1*var(--dialvis,320px));pointer-events:auto}
  :root[data-hand="left"] #dial{right:auto;left:calc(-1*var(--dialvis,320px))}
  .hintline{display:none}
  .it text{font-size:24px}
  .ringlabel{font-size:18px}
  .nav text{font-size:22px}
  .mins{font-size:18px}
  h1.t{font-size:calc(27px*var(--fs))}
  .dialtoggle{display:block!important}
  .lab-tag{top:10px}
}
.dialtoggle{display:none;position:fixed;z-index:25;bottom:calc(var(--dialvis,320px) + 6px);right:12px;background:var(--bg2);border:1px solid var(--dim);color:var(--text2);font-size:12px;padding:4px 10px;border-radius:999px;cursor:pointer}
:root[data-hand="left"] .dialtoggle{right:auto;left:12px}
</style>
</head>
<body>
<a class="lab-tag" href="../index.html" data-lab>设计实验室 · 方案三「年轮」</a>
<div class="app">
  <div class="dialwrap" id="dialwrap">
    <svg id="dial" viewBox="-560 -560 1120 1120" role="application" aria-roledescription="同心圆转盘" aria-label="转盘：左右键转动，上下键向内或向外换一圈，回车选中"></svg>
    <p class="hintline" id="hint"></p>
  </div>
  <main class="panel" id="panel" aria-live="polite"></main>
</div>
<button class="dialtoggle" id="dialtoggle" aria-expanded="true">收起转盘</button>
<div class="toast" id="toast" role="status"></div>

<script src="../shared/data.js"></script>
<script src="../shared/campus.js"></script>
<script>
/* ════════════════════════════════════════════════════════════════
   年轮 · 规则
   1. 圆心是来处，外圈是此刻。（1923 / 榄仁树 / 你的身份在圆心；今天、正在发生、公开的东西在外圈）
   2. 转动是周期（一天、一周、一个分类），向内是更深（更早、更私密、更根本、更接近出处）。
   3. 准线是固定的：被转到准线上的，就是被选中的；准线一直指向右边那一页（手机上指向上方）。
   4. 键盘：←→ 转动，↑↓ 换一圈（向外 / 向内），Enter 选中。点、拖、滚轮都可以。
   5. 每个界面都是同一件仪器：表单是一圈圈闭合的环，设置是数据在哪一圈，地图是以树为圆心的距离环。
   ════════════════════════════════════════════════════════════════ */
const D = window.HAIZ_SAMPLE, C = window.HAIZ_CAMPUS, R = HZ.root;
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = { get(k, d) { try { const v = localStorage.getItem('hz-nl-' + k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem('hz-nl-' + k, JSON.stringify(v)); } catch {} } };
const mobile = () => innerWidth <= 760;
const rad = (a) => a * Math.PI / 180;
const pol = (r, a) => [r * Math.cos(rad(a)), r * Math.sin(rad(a))];
const norm = (a) => ((a % 360) + 540) % 360 - 180; // -180..180

const S = {
  view: 'home',
  rot: {}, active: {},
  pref: store.get('pref', { motion: 0, size: 0, theme: 0, hand: 0 }),
  tasks: store.get('tasks', D.TASKS.map((t) => ({ ...t }))),
  inbox: D.INBOX.map((x) => ({ ...x })),
  focus: { min: 25, running: false, end: 0 },
  authed: store.get('authed', false),
  login: { mode: 0, nick: '', user: '', pass: '', pass2: '', show: false, err: '', busy: false, crack: null },
  map: { time: 15 },
  lab: { L: 1.0, deg: 4, n: 30, t: null, rows: [] },
  scope: store.get('scope', { tasks: 1, prefs: 1, leaf: 2, nick: 3, intake: 1 }),
  devices: D.ACCOUNT.devices.map((d) => ({ ...d })),
  q: '', hits: [],
  dialSmall: false,
};
/* 准线方向：桌面指向右（0°），手机右手指向左上（-135°），左手指向右上（-45°） */
const IDX = () => mobile() ? (S.pref.hand === 1 ? -45 : -135) : 0;

/* ════════════════════ 视图：每个视图描述自己的年轮 ════════════════════
   ring: { id, label, items:[{id,label,a?}], kind:'cat'|'clock'|'status', future?, r? } 从内到外 */
const NAV = [
  { id: 'home', label: '树' }, { id: 'login', label: '入口' }, { id: 'pocket', label: '口袋' },
  { id: 'map', label: '校园' }, { id: 'read', label: '实验册' }, { id: 'settings', label: '我' },
];
const PLACES = ['lanshu', 'beimen', 'nanmen', 'yihao', 'erhao', 'sanhao', 'sihao', 'keji', 'kexue', 'library', 'yanchi', 'hujulongpan', 'fengqitang', 'yanlintang', 'yishu', 'yundong', 'canteen1', 'canteen3', 'zhiwuyuan', 'xiaoyouhui'];
const B = Object.fromEntries(C.b.map((b) => [b.id, b]));
const ctr = (b) => [(b.r[0] + b.r[2]) / 2, (b.r[1] + b.r[3]) / 2];

function model() {
  const v = S.view;
  if (v === 'home') {
    const todo = S.tasks.filter((t) => !t.done);
    const m = HZ.minuteNow(); const nxt = D.COURSES.filter((c) => c.day === HZ.today() && c.end > m).sort((a, b) => a.start - b.start)[0];
    return {
      core: { a: '1923', b: '榄仁树' },
      rings: [
        { id: 'roots', label: '根脉 · 校史', kind: 'cat', items: D.HISTORY.map((h) => ({ id: h.id, label: h.label, warn: h.grade === 'gap' })) },
        { id: 'campus', label: '校园', kind: 'cat', items: ['lanshu', 'yihao', 'library', 'yanchi', 'fengqitang', 'beimen', 'yundong', 'hujulongpan'].map((id) => ({ id, label: B[id].n })) },
        { id: 'works', label: '作品与工具', kind: 'cat', items: D.WORKS.map((x) => ({ id: x.id, label: x.name })) },
        { id: 'today', label: '今天', kind: 'cat', items: [
          { id: 'next', label: nxt ? '下一节 ' + nxt.name : '课上完了' },
          ...todo.slice(0, 4).map((t) => ({ id: 't:' + t.id, label: t.title.length > 9 ? t.title.slice(0, 9) + '…' : t.title, warn: new Date(t.due) < new Date() })),
          { id: 'inbox', label: '收件 ' + S.inbox.length },
          { id: 'focus', label: '专注' },
        ] },
      ],
      defaultActive: 'today',
    };
  }
  if (v === 'login') {
    const L = S.login, reg = L.mode === 1;
    const okUser = /^[A-Za-z0-9_]{4,20}$/.test(L.user), okPass = L.pass.length >= 8;
    const rings = reg
      ? [{ id: 'pass2', label: '再写一遍', ok: L.pass2 && L.pass2 === L.pass, typed: L.pass2.length }, { id: 'pass', label: '口令', ok: okPass, typed: L.pass.length / 8 }, { id: 'user', label: '账号', ok: okUser, typed: L.user.length / 4 }, { id: 'nick', label: '昵称', ok: !!L.nick.trim(), typed: L.nick.length }]
      : [{ id: 'pass', label: '口令', ok: okPass, typed: L.pass.length / 8 }, { id: 'user', label: '账号', ok: okUser, typed: L.user.length / 4 }];
    rings.forEach((r) => { r.kind = 'status'; r.items = []; });
    const all = rings.every((r) => r.ok);
    return { core: S.authed ? { a: '已进入', b: D.ACCOUNT.name } : { a: L.busy ? '……' : reg ? '注册' : '进入', b: all ? '按下圆心' : '由外向内', go: all && !L.busy }, rings, status: true };
  }
  if (v === 'pocket') {
    const today = HZ.today();
    const rings = [];
    for (let d = 1; d <= 5; d++) rings.push({ id: 'd' + d, label: '周' + HZ.wd(d) + (d === today ? ' · 今天' : ''), kind: 'clock', future: d > today, items: [] });
    // 外圈最外：专注
    return { core: { a: '本周', b: '示例课表' }, rings, clock: true, defaultActive: 'd' + today };
  }
  if (v === 'map') {
    const [ox, oy] = ctr(B.lanshu);
    const items = PLACES.filter((id) => id !== 'lanshu').map((id) => { const [x, y] = ctr(B[id]); return { id, label: B[id].n, a: Math.atan2(-(y - oy), x - ox) * 180 / Math.PI, dist: Math.hypot(x - ox, y - oy) * 0.167 }; });

  const da = norm(a - drag.last); const now = performance.now();
  drag.vel = da / Math.max(8, now - drag.t); drag.last = a; drag.t = now;
  setRot(drag.ring, rotOf(drag.ring) + da);
  if (M.clock) { shareClock(); drawDial(); } else if (M.map) drawDial();
  else { // 只换选中态，不重画全部
    const ring = M.rings.find((r) => r.id === drag.ring); const si = selectedIndex(ring);
    document.querySelectorAll(`#g-${drag.ring} .it`).forEach((g) => { g.classList.toggle('sel', +g.dataset.item === si); g.querySelector('circle').setAttribute('r', +g.dataset.item === si ? 8 : 5); const t = g.querySelector('text'); t.setAttribute('transform', `rotate(${-rotOf(drag.ring)})`); });
  }
});
svg.addEventListener('pointerup', (e) => {
  const d0 = drag; drag = null; if (!d0) return;
  if (d0.core) { coreAction(); return; }
  if (d0.node) { if (!d0.moved) { const it = SCOPE_ITEMS.find((s) => s.id === d0.node); setScope(it.id, S.scope[it.id] < it.max ? S.scope[it.id] + 1 : it.min); } return; }
  if (d0.sun) { render(); return; }
  if (d0.nav) { const n = e.target.closest('[data-nav]'); if (n) go(n.dataset.nav); return; }
  if (d0.ring && d0.moved) { if (M.clock) { renderPanel(); return; } snap(d0.ring, d0.vel); return; }
  // 点一下
  const t = d0.tap; if (!t) return;
  const it = t.closest('[data-item]'); if (it) { const rid = it.dataset.ring; S.active[S.view] = rid; turnTo(rid, +it.dataset.item); return; }
  const tk = t.closest('[data-task]'); if (tk) { seekTask(tk.dataset.task); return; }
  const bd = t.closest('[data-b]'); if (bd && M.map) { const ring = M.rings[0]; const i = ring.items.findIndex((x) => x.id === bd.dataset.b); if (i >= 0) turnTo('places', i); return; }
  if (d0.ring) { renderPanel(); drawDial(); }
});
svg.addEventListener('wheel', (e) => { e.preventDefault(); if (M.status || M.scope) return; step(e.deltaY > 0 ? 1 : -1); }, { passive: false });
svg.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' && false) { e.preventDefault(); step(1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
  else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    e.preventDefault(); if (M.status || M.scope) return;
    const ids = M.rings.map((r) => r.id); const i = ids.indexOf(activeId());
    const ni = Math.max(0, Math.min(ids.length - 1, i + (e.key === 'ArrowUp' ? 1 : -1))); setActive(ids[ni]);
  } else if (e.key === 'Enter') { if (M.core.go) coreAction(); else $('#panel button, #panel input')?.focus(); }
});
svg.setAttribute('tabindex', '0');
function coreAction() {
  if (S.view === 'login' && M.core.go) return doLogin();
  if (S.view === 'read') { const ring = 'why'; S.active.read = ring; render(); toast('圆心：' + D.LAB.sources[0]); }
}
function seekTask(id) { const t = S.tasks.find((x) => x.id === id); const due = new Date(t.due); const d = due.getDay(); if (d < 1 || d > 5) return toast('这件事的截止日不在周一到周五'); S.active.pocket = 'd' + d; M = model(); const to = IDX() - clockA(due.getHours() * 60 + due.getMinutes()); animateRot('d' + d, to, () => { shareClock(); render(); }); }
function setScope(id, lvl) {
  S.scope[id] = lvl; store.set('scope', S.scope);
  if (id === 'tasks' && lvl === 2) { S.syncErr = true; setTimeout(() => { S.scope.tasks = 1; store.set('scope', S.scope); render(); toast('同步没有成功，已退回这台设备（演示）'); }, 900); }
  render();
}

/* ════════════════════ 导航：换视图 = 新的年轮从圆心长出来 ════════════════════ */
const VIEWS = ['home', 'login', 'pocket', 'map', 'read', 'settings'];
function go(v) {
  if (!VIEWS.includes(v)) v = 'home';
  if (v === S.view) return;
  S.view = v; S.q = ''; S.hits = [];
  if (location.hash.slice(1) !== v) history.pushState(null, '', '#' + v);
  render();
  if (!HZ.reduced()) {
    svg.querySelectorAll('.ring, [id^="g-"]:not(#g-nav), .core, .status').forEach((el, i) => el.animate([{ opacity: 0, transform: (el.getAttribute('transform') || '') + ' scale(.6)' }, { opacity: 1, transform: (el.getAttribute('transform') || '') + ' scale(1)' }], { duration: 360, delay: i * 18, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' }));
    $('#panel').animate([{ opacity: 0, transform: 'translateX(-12px)' }, { opacity: 1, transform: 'none' }], { duration: 260, easing: 'cubic-bezier(.2,.8,.2,1)' });
  }
  $('#panel').scrollTop = 0; if (mobile()) scrollTo(0, 0);
}
addEventListener('popstate', () => { const v = location.hash.slice(1) || 'home'; if (v !== S.view) go(v); });

/* ════════════════════ 面板事件 ════════════════════ */
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2600); }
document.addEventListener('click', (e) => {
  const t = e.target;
  const g = t.closest('[data-go]'); if (g) { const pl = g.dataset.place; go(g.dataset.go); if (pl) { const ring = M.rings[0]; const i = ring.items.findIndex((x) => x.id === pl); if (i >= 0) turnTo('places', i); } return; }
  const hr = t.closest('[data-href]'); if (hr) { location.href = hr.dataset.href; return; }
  const hit = t.closest('[data-hit]'); if (hit) { const [rid, iid] = hit.dataset.hit.split(':'); S.active.home = rid; const ring = M.rings.find((r) => r.id === rid); S.q = ''; S.hits = []; render(); turnTo(rid, ring.items.findIndex((x) => x.id === iid)); return; }
  const dn = t.closest('[data-done]'); if (dn) { const task = S.tasks.find((x) => x.id === dn.dataset.done); task.done = true; store.set('tasks', S.tasks); render(); toast('做完了：' + task.title); return; }
  const un = t.closest('[data-undo]'); if (un) { const task = S.tasks.find((x) => x.id === un.dataset.undo); task.done = false; store.set('tasks', S.tasks); render(); return; }
  const pk = t.closest('[data-pick]'); if (pk) { const [rid, i] = pk.dataset.pick.split(':'); S.active[S.view] = rid; turnTo(rid, +i); return; }
  const sk = t.closest('[data-seek]'); if (sk) { seekTask(sk.dataset.seek); return; }
  if (t.closest('[data-now]')) { const id = activeId(); S.active.pocket = 'd' + HZ.today(); animateRot('d' + HZ.today(), IDX() - clockA(HZ.minuteNow()), () => { shareClock(); render(); }); return; }
  const ac = t.closest('[data-accept]'); if (ac) { const it = S.inbox.find((x) => x.id === ac.dataset.accept); S.tasks.push({ id: 'n' + Date.now(), title: it.guess.title, subject: it.guess.subject, due: it.guess.due, done: false, example: true, source: it.from }); store.set('tasks', S.tasks); S.inbox = S.inbox.filter((x) => x !== it); render(); toast('收下了，它落在年轮上截止的那一刻'); return; }
  const rj = t.closest('[data-reject]'); if (rj) { S.inbox = S.inbox.filter((x) => x.id !== rj.dataset.reject); render(); return; }
  if (t.closest('[data-fstart]')) { const F = S.focus; F.running = true; F.end = Date.now() + F.min * 60000; clearInterval(fT); fT = setInterval(() => { const el = $('#fl'); const left = Math.max(0, Math.round((F.end - Date.now()) / 1000)); if (el) el.textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0'); if (left % 15 === 0 && S.view === 'pocket') drawDial(); if (!left) { F.running = false; clearInterval(fT); render(); toast('专注结束'); } }, 1000); render(); return; }
  if (t.closest('[data-fstop]')) { S.focus.running = false; clearInterval(fT); render(); return; }
  const nt = t.closest('[data-notch]'); if (nt) { const id = nt.dataset.notch, i = +nt.dataset.i; if (id === 'mode') { S.login.mode = i; S.login.err = ''; S.login.crack = null; render(); return; } S.pref[id] = i; store.set('pref', S.pref); applyPref(); render(); return; }
  const sc = t.closest('[data-scope]'); if (sc) { const it = SCOPE_ITEMS.find((s) => s.id === sc.dataset.scope); setScope(it.id, S.scope[it.id] < it.max ? S.scope[it.id] + 1 : S.scope[it.id] - 1); return; }
  if (t.closest('[data-eye]')) { S.login.show = !S.login.show; renderPanel(); return; }
  if (t.closest('[data-logout]')) { S.authed = false; store.set('authed', false); render(); return; }
  if (t.closest('[data-step]')) { step(1); return; }
  if (t.closest('[data-deeper]')) { S.active.read = 'data'; render(); return; }
  if (t.closest('[data-core-go]')) { toast('出处：' + D.LAB.sources.join('；')); return; }
  if (t.closest('[data-rec]')) { const o = labCalc(); S.lab.rows.push({ L: S.lab.L, deg: S.lab.deg, n: S.lab.n, t: S.lab.t, g: o.g }); S.lab.t = null; render(); toast('记下了'); return; }
  if (t.closest('[data-again]')) { S.lab.t = null; renderPanel(); return; }
});
let fT = 0;
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'q') {
    S.q = t.value.trim(); const hits = [];
    if (S.q) M.rings.forEach((r) => r.items.forEach((it) => { if (it.label.includes(S.q) || (r.id === 'roots' && (D.HISTORY.find((h) => h.id === it.id) || {}).title?.includes(S.q))) hits.push({ ring: r.id, id: it.id, label: it.label, ringLabel: r.label }); }));
    hits.sort((a, b) => (b.label === S.q) - (a.label === S.q) || a.label.length - b.label.length); S.hits = hits.map((h) => h.ring + ':' + h.id); S.hitList = hits; render(); return;
  }
  const k = t.dataset.in; if (k) { S.login[k] = t.value; S.login.err = ''; S.login.crack = null; render(); }
});
document.addEventListener('submit', (e) => {
  e.preventDefault(); const f = e.target;
  if (f.id === 'lf') { if (M.core.go) doLogin(); else { const first = [...f.querySelectorAll('input')].find((i) => { const k = i.dataset.in; return !(M.rings.find((r) => r.id === k) || {}).ok; }); first && first.focus(); S.login.crack = first && first.dataset.in; drawDial(); } return; }
  if (f.id === 'af') { const v = f.t.value.trim(); if (!v) return f.t.focus(); const due = new Date(); due.setDate(due.getDate() + (/明天/.test(v) ? 1 : 0)); due.setHours(21, 0, 0, 0); S.tasks.push({ id: 'n' + Date.now(), title: v, subject: '其他', due: due.toISOString(), done: false, example: false, source: '' }); store.set('tasks', S.tasks); render(); toast('记下了，落在今晚 21:00'); $('#af input')?.focus(); }
});
function doLogin() {
  const L = S.login; L.busy = true; render();
  setTimeout(() => {
    L.busy = false;
    if (L.mode === 0 && L.user === 'sample_01' && L.pass === 'haiz2026') { S.authed = true; store.set('authed', true); L.pass = ''; render(); toast('所有的环都闭合了'); return; }
    L.err = L.mode === 1 ? '演示环境不创建真实账号。' : '账号或口令不对。'; L.crack = L.mode === 1 ? null : 'pass'; render();
  }, 800);
}
// 画满一圈（按住确认）
let hold = null;
function holdStart(btn) { const fg = btn.querySelector('.fg'); const t0 = performance.now(); const dur = HZ.reduced() ? 900 : 1000; hold = { btn, raf: 0 };
  const f = (t) => { const p = Math.min(1, (t - t0) / dur); fg.style.strokeDashoffset = 69.1 * (1 - p); if (p >= 1) { const id = btn.dataset.hold; hold = null; holdDone(id); return; } hold.raf = requestAnimationFrame(f); }; hold.raf = requestAnimationFrame(f); }
function holdEnd() { if (!hold) return; cancelAnimationFrame(hold.raf); hold.btn.querySelector('.fg').style.strokeDashoffset = 69.1; hold = null; }
function holdDone(id) {
  if (id === 'wipe') { try { Object.keys(localStorage).filter((k) => k.startsWith('hz-nl-')).forEach((k) => localStorage.removeItem(k)); } catch {} S.tasks = D.TASKS.map((t) => ({ ...t })); S.pref = { motion: 0, size: 0, theme: 0, hand: 0 }; S.scope = { tasks: 1, prefs: 1, leaf: 2, nick: 3, intake: 1 }; applyPref(); toast('已清除'); }
  else { const did = id.split(':')[1]; const d = S.devices.find((x) => x.id === did); S.devices = S.devices.filter((x) => x.id !== did); toast('「' + (d ? d.name : '') + '」已退出'); }
  render();
}
document.addEventListener('pointerdown', (e) => { const b = e.target.closest('[data-hold]'); if (b) { e.preventDefault(); holdStart(b); } });
['pointerup', 'pointercancel', 'pointerleave'].forEach((ev) => document.addEventListener(ev, holdEnd, true));
document.addEventListener('keydown', (e) => { const b = e.target.closest && e.target.closest('[data-hold]'); if (b && (e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); holdStart(b); } });
document.addEventListener('keyup', (e) => { if (e.key === ' ' || e.key === 'Enter') holdEnd(); });
// 刻度弧
let arcDrag = null;
function arcSet(el, clientX, clientY) {
  const r = el.getBoundingClientRect(); const x = (clientX - r.left) / r.width * 132 - 66, y = (clientY - r.top) / r.height * 72 - 62;
  let a = Math.atan2(y, x) * 180 / Math.PI; if (a > 0) a = a > 90 ? 180 : 0; // 只取上半圆
  const p = (a + 180) / 180; const min = +el.dataset.min, max = +el.dataset.max, st = +el.dataset.step;
  const v = Math.round((min + p * (max - min)) / st) * st; arcVal(el.dataset.arc, +v.toFixed(3));
}
function arcVal(id, v) {
  if (id === 'fmin') S.focus.min = v; else { S.lab[id] = v; S.lab.t = null; }
  renderPanel(); if (S.view === 'pocket') drawDial();
  const el = document.querySelector(`[data-arc="${id}"]`); el && el.focus({ preventScroll: true });
}
document.addEventListener('pointerdown', (e) => { const el = e.target.closest('[data-arc]'); if (!el) return; arcDrag = el.dataset.arc; arcSet(el, e.clientX, e.clientY); });
document.addEventListener('pointermove', (e) => { if (!arcDrag) return; const el = document.querySelector(`[data-arc="${arcDrag}"]`); if (el) arcSet(el, e.clientX, e.clientY); });
document.addEventListener('pointerup', () => { arcDrag = null; });
document.addEventListener('keydown', (e) => {
  const el = e.target.closest && e.target.closest('[data-arc]'); if (!el) return;
  const st = +el.dataset.step, min = +el.dataset.min, max = +el.dataset.max; const cur = +el.getAttribute('aria-valuenow');
  if (['ArrowRight', 'ArrowUp'].includes(e.key)) { e.preventDefault(); arcVal(el.dataset.arc, +Math.min(max, cur + st).toFixed(3)); }
  if (['ArrowLeft', 'ArrowDown'].includes(e.key)) { e.preventDefault(); arcVal(el.dataset.arc, +Math.max(min, cur - st).toFixed(3)); }
});
// 设置里的节点也能用键盘移动
document.addEventListener('keydown', (e) => { const n = e.target.closest && e.target.closest('[data-node]'); if (!n) return; const it = SCOPE_ITEMS.find((s) => s.id === n.dataset.node); if (e.key === 'ArrowUp' || e.key === 'ArrowRight') { e.preventDefault(); setScope(it.id, Math.min(it.max, S.scope[it.id] + 1)); } if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') { e.preventDefault(); setScope(it.id, Math.max(it.min, S.scope[it.id] - 1)); } });

function applyPref() {
  const P = S.pref, r = document.documentElement;
  if (P.motion === 1) r.dataset.motion = 'reduce'; else if (P.motion === 0) r.dataset.motion = 'normal'; else delete r.dataset.motion;
  r.style.setProperty('--fs', [1, 1.12, 1.25][P.size]);
  r.dataset.theme = ['dark', 'light', 'auto'][P.theme] || 'dark';
  if (P.hand === 1) r.dataset.hand = 'left'; else delete r.dataset.hand;
  sizeDial();
}
function sizeDial() { const vis = S.dialSmall ? 150 : Math.min(330, Math.round(innerWidth * 0.84)); document.documentElement.style.setProperty('--dialvis', vis + 'px'); $('#dialtoggle').textContent = S.dialSmall ? '展开转盘' : '收起转盘'; $('#dialtoggle').setAttribute('aria-expanded', !S.dialSmall); }
$('#dialtoggle').addEventListener('click', () => { S.dialSmall = !S.dialSmall; sizeDial(); });
let lastMobile = mobile();
addEventListener('resize', () => { sizeDial(); if (mobile() !== lastMobile) { lastMobile = mobile(); S.rot = {}; } render(); });

applyPref();
S.view = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'home';
render();
if (new URLSearchParams(location.search).has('embed')) document.querySelector('[data-lab]').style.display = 'none';
</script>
