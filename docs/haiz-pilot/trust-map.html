<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAIZ · 数据与信任边界</title><style>:root{font-family:system-ui,sans-serif;color:#21392d;background:#f4f3ed}body{max-width:1150px;margin:6vh auto;padding:24px}header small{letter-spacing:3px}h1{font-size:38px;font-weight:550}p{line-height:1.8}svg{width:100%;height:auto}svg text{font:17px system-ui;fill:#21392d}svg .small{font-size:14px;fill:#526658}svg rect{fill:#fff;stroke:#84998b;stroke-width:1}svg .private{fill:#e3ede5}svg .public{fill:#efdfcf}svg path{fill:none;stroke:#526658;stroke-width:1.5;marker-end:url(#arrow)}.legend{display:flex;gap:10px;flex-wrap:wrap}button{background:#fff;color:#21392d;border:1px solid #84998b;border-radius:8px;padding:13px;cursor:pointer;min-height:44px}button:focus-visible{outline:3px solid #aa663d}article{border-top:1px solid #84998b;margin-top:24px;padding:24px 0}#details{white-space:pre-line}.diagram{overflow:auto}svg{min-width:700px}@media(max-width:650px){h1{font-size:27px}}</style><header><small>HAIZ / TRUST MAP / FICTIONAL PILOT</small><h1>公开一条提醒，<br>不等于公开整份工作。</h1><p>目前实现为单实例HTTPS自托管试用包；未部署公网、未验证物理设备或学校系统。</p></header><div class="diagram"><svg viewBox="0 0 1100 510" role="img" aria-labelledby="title desc"><title id="title">教师私人资料到教室公共摘要的边界</title><desc id="desc">两台浏览器经HTTPS代理访问带Cookie会话的试用服务，服务端分别保存私人草稿和经确认的公开通知。教室仅读取公开白名单。STILLROOM仅会话本地。ClassIsland未连接。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" style="fill:#526658;stroke:none;marker-end:none"/></marker></defs><rect x="20" y="55" width="225" height="90" rx="10" class="private"/><text x="40" y="87">教师手机 / Windows</text><text x="40" y="117" class="small">同账号、每设备独立邀请</text><rect x="305" y="55" width="190" height="90" rx="10"/><text x="325" y="87">HTTPS · Caddy</text><text x="325" y="117" class="small">域名与可信证书待部署</text><rect x="555" y="55" width="240" height="90" rx="10"/><text x="575" y="87">身份与授权校验</text><text x="575" y="117" class="small">Cookie / 到期 / 撤销 / 限速</text><path d="M245 100H300"/><path d="M495 100H550"/><rect x="555" y="210" width="240" height="110" rx="10" class="private"/><text x="575" y="245">私人草稿 / 课程 / 待办</text><text x="575" y="275" class="small">所有者 + 授权班级 + revision</text><text x="575" y="298" class="small">资料仅名称与描述，非原文件</text><path d="M675 145V205"/><rect x="855" y="210" width="220" height="110" rx="10" class="public"/><text x="875" y="245">独立 Notice 公共对象</text><text x="875" y="275" class="small">确认标题、摘要、范围与期限</text><text x="875" y="298" class="small">私人正文不进入此边界</text><path d="M795 260H850"/><text x="806" y="240" class="small">确认</text><rect x="855" y="385" width="220" height="85" rx="10" class="public"/><text x="875" y="420">学生 / 教室只读屏</text><text x="875" y="448" class="small">仅本班有效摘要 · 撤回重验</text><path d="M965 320V380"/><rect x="20" y="210" width="225" height="110" rx="10" class="private"/><text x="40" y="245">STILLROOM 自习</text><text x="40" y="275" class="small">仅本机当前会话，未发到服务端</text><text x="40" y="298" class="small">本地艺术SVG · 非真实校园</text><rect x="305" y="385" width="300" height="85" rx="10" style="stroke-dasharray:6 5"/><text x="325" y="420">ClassIsland / 希沃</text><text x="325" y="448" class="small">尚未连接 · 不修改课表、铃声或程序文件</text></svg></div><div class="legend"><button data-topic="identity">① 身份与撤销</button><button data-topic="private">② 私人缓存</button><button data-topic="public">③ 公开与离线</button><button data-topic="deployment">④ 部署边界</button></div><article aria-live="polite"><h2 id="heading">从权限开始，而不是从页面开始。</h2><p id="details">点击上方边界，查看已实现的约束和仍存在的限制。</p></article><script>const topics={identity:['身份与撤销','邀请30分钟、一次使用；会话8小时，管理员可撤销，退出在服务端失效。
