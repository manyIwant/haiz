<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020a13">
  <meta name="description" content="HAIZ Pocket — 校园工具的本机入口。">
  <title>HAIZ Pocket · 进入本机空间</title>
  <!--
    Lamp optical arrangement adapted from Aceternity UI's free Lamp
    component by Manu Arora (MIT): mirrored conic-gradient(70/290deg)
    with bottom and side masks, blur layers and animated emitter.
    This page launches the actual Flutter Web workspace, not a mockup.
  -->
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif; }
    *, *::before, *::after { box-sizing: border-box; }
    html { min-height: 100%; background: #020a13; }
    body { margin: 0; min-height: 100vh; background: #020a13; color: #e8f6fa; -webkit-font-smoothing: antialiased; }
    .screen { position: relative; isolation: isolate; min-height: 100svh; overflow: hidden; background: radial-gradient(ellipse 80% 60% at 50% 30%, #071e29 0%, #020b15 65%, #020a13 100%); }
    .ambient { position: absolute; pointer-events: none; z-index: -1; width: 85vw; height: 550px; left: 50%; top: -190px; transform: translateX(-50%); background: radial-gradient(ellipse at center, rgba(22, 120, 145, .11), transparent 65%); }
    .lamp { position: absolute; z-index: 0; pointer-events: none; left: 50%; transform: translateX(-50%); top: 0; width: min(1200px, 100vw); height: 350px; isolation: isolate; }
    .lamp-inner { position: relative; width: 100%; height: 100%; }
    /* Both conic beams share the same emitter at center x / y=190px.
       The light exists only within the upper-left / upper-right quadrant. */
    .beam { position: absolute; top: 0; width: 50%; height: 190px; opacity: 0; filter: blur(10px); animation: beam-open 1250ms cubic-bezier(.16,1,.3,1) 100ms both; mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,.72) 28%, black 90%); }
    .beam-left { left: 0; transform-origin: right bottom; background: conic-gradient(from 270deg at 100% 100%, transparent 0deg, rgba(6,182,212,.21) 21deg, rgba(8,188,212,.62) 49deg, rgba(35,199,218,.20) 74deg, transparent 90deg, transparent 360deg); }
    .beam-right { right: 0; transform-origin: left bottom; background: conic-gradient(from 0deg at 0% 100%, transparent 0deg, rgba(35,199,218,.20) 16deg, rgba(8,188,212,.62) 41deg, rgba(6,182,212,.21) 69deg, transparent 90deg, transparent 360deg); }
    .beam .fade-bottom, .beam .fade-edge, .dark-veil { display: none; }
    .soft-bloom { position: absolute; left: 50%; top: 146px; transform: translateX(-50%); width: min(31rem, 80vw); height: 150px; border-radius: 50%; background: rgba(4, 155, 183, .48); filter: blur(56px); opacity: 0; animation: bloom 1350ms ease-out 160ms both; }
    .concentrated-bloom { position: absolute; left: 50%; top: 156px; transform: translateX(-50%); width: min(22rem, 60vw); height: 95px; border-radius: 50%; background: rgba(37, 211, 230, .40); filter: blur(29px); opacity: 0; animation: bloom 1200ms ease-out 180ms both; }
    .horizon-blur { position: absolute; top: 186px; left: 50%; height: 8px; transform: translateX(-50%); background: #36d5e7; border-radius: 100%; filter: blur(14px); animation: horizon 1250ms cubic-bezier(.16,1,.3,1) 120ms both; }
    .horizon { position: absolute; top: 189px; left: 50%; height: 2px; transform: translateX(-50%); background: linear-gradient(90deg, transparent, #8ef0f4 24%, #affbff 50%, #8ef0f4 76%, transparent); box-shadow: 0 0 12px rgba(70,229,239,.6); animation: horizon 1250ms cubic-bezier(.16,1,.3,1) 140ms both; }
    .upper-shade { position: absolute; z-index: 2; left: 0; right: 0; top: 0; height: 34px; background: linear-gradient(to bottom, #020b15, transparent); }
    .content { position: relative; z-index: 3; display: flex; min-height: 100svh; flex-direction: column; align-items: center; margin: auto; padding: 244px 24px 48px; }
    .identity { text-align: center; animation: rise 1000ms cubic-bezier(.16,1,.3,1) 340ms both; }
    .wordmark { margin: 0; font-weight: 300; letter-spacing: .24em; padding-left: .24em; line-height: 1; font-size: clamp(45px, 5vw, 64px); color: #f1fdff; }
    .subbrand { margin: 18px 0 0; font-size: 10px; letter-spacing: .30em; color: #92b8c3; }
    .entry { width: min(100%, 460px); margin: 82px auto 0; padding: 29px 30px 25px; border: 1px solid rgba(113, 187, 204, .20); border-radius: 24px; background: linear-gradient(145deg, rgba(17,40,55,.84), rgba(8,25,39,.91)); box-shadow: 0 30px 100px rgba(0,0,0,.25), inset 0 1px 0 rgba(185,237,244,.055); backdrop-filter: blur(18px); animation: rise 1150ms cubic-bezier(.16,1,.3,1) 470ms both; }
    .eyebrow { font-size: 10px; letter-spacing: .20em; color: #8ec8d2; margin: 0 0 19px; }
    .entry h2 { margin: 0 0 13px; font-size: 27px; letter-spacing: -.02em; font-weight: 500; }
    .entry .intro { margin: 0; color: #aec8d1; font-size: 14px; line-height: 1.85; }
    .go { display: flex; justify-content: center; align-items: center; gap: 14px; min-height: 54px; border-radius: 13px; text-decoration: none; background: #b8eced; color: #092b36; font-size: 15px; font-weight: 600; margin-top: 28px; transition: background .2s ease, transform .2s ease; }
    .go:hover { background: #d8fcfb; transform: translateY(-2px); }
    .go:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    .privacy { font-size: 11px; line-height: 1.7; color: #92adb7; text-align: center; margin: 17px 0 0; }
    .footer { font-size: 10px; letter-spacing: .19em; color: #688e9c; margin: 30px auto 0; text-align: center; animation: rise 900ms ease 680ms both; }
    @keyframes beam-open { from { opacity: .24; scale: .56 1; } to { opacity: 1; scale: 1 1; } }
    @keyframes bloom { from { opacity: 0; scale: .65; } to { opacity: 1; scale: 1; } }
    @keyframes horizon { from { opacity: 0; width: 120px; } to { opacity: 1; width: min(30rem, 85vw); } }
    @keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 600px) {
      .lamp { width: 100vw; height: 318px; }
      .beam { top: 0; width: 50%; height: 176px; }
      .soft-bloom { top: 140px; }
      .concentrated-bloom { top: 148px; }
      .horizon, .horizon-blur { top: 176px; }
      .content { padding: 237px 20px 40px; }
      .entry { margin-top: 65px; padding: 26px 24px 23px; }
      .entry h2 { font-size: 25px; }
      .footer { font-size: 9px; letter-spacing: .12em; }
    }
    @media (max-height: 710px) {
      .content { padding-top: 195px; }
      .entry { margin-top: 46px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0ms !important; transition-duration: 0ms !important; }
    }
  </style>
</head>
<body>
  <div class="screen">
    <div class="ambient" aria-hidden="true"></div>
    <div class="lamp" aria-hidden="true">
      <div class="lamp-inner">
        <div class="beam beam-left"><div class="fade-bottom"></div><div class="fade-edge"></div></div>
        <div class="beam beam-right"><div class="fade-bottom"></div><div class="fade-edge"></div></div>
        <div class="dark-veil"></div>
        <div class="soft-bloom"></div>
        <div class="concentrated-bloom"></div>
        <div class="horizon-blur"></div>
        <div class="horizon"></div>
        <div class="upper-shade"></div>
      </div>
    </div>
    <main class="content">
      <header class="identity">
        <h1 class="wordmark">HAIZ</h1>
        <p class="subbrand">POCKET / CAMPUS</p>
      </header>
      <section class="entry" aria-labelledby="welcome">
        <p class="eyebrow">HAIZ / 本机空间</p>
        <h2 id="welcome">欢迎回来</h2>
        <p class="intro">你的课表、待办与校园空间，<br>从这里开始。</p>
        <a class="go" href="./app/?fromLamp=1">进入本机空间 <span aria-hidden="true">→</span></a>
        <p class="privacy">仅打开此设备的访客数据 · 无账号验证或云端同步</p>
      </section>
      <p class="footer">A QUIETER WAY TO STAY CONNECTED</p>
    </main>
  </div>
</body>
</html>
