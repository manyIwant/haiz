<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>HAIZ · Toybox V2 抓娃娃机验证 & 角色艺术验收台</title>
  <style>

    [data-host-theme="ocean"] { --bg:#DAE8F1; --panel:#F3F8FC; --border:rgba(20,56,82,0.14); --text:#152B3D; --muted:#4E6C84; --accent:#1D445E; --accent-fg:#F4F9FC; --chip:#C9DFEC; }

    .nav-controls { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

    .seg-btn.is-active { background:var(--panel); color:var(--text); box-shadow:0 1px 4px rgba(0,0,0,0.12); }
    .view-section { display:none; width:100%; max-width:920px; }
    .view-section.is-active { display:block; }
    .host-card { max-width:420px; margin:28px auto 0; background:var(--panel); border:1.5px solid var(--border); border-radius:26px; padding:26px 24px; box-shadow:0 22px 54px rgba(18,15,12,0.10); }

    .btn-primary { width:100%; height:46px; border:none; border-radius:14px; background:var(--accent); color:var(--accent-fg); font-size:14.5px; font-weight:650; cursor:pointer; }

    <span class="brand-title">HAIZ · TOYBOX V2</span>

    gl.uniform3fv(this._uMain.uKeyDir, this.lights.keyDir);
    gl.uniform3fv(this._uMain.uKeyColor, this.lights.keyColor);
    gl.uniform3fv(this._uMain.uFillDir, this.lights.fillDir);
    gl.uniform3fv(this._uMain.uFillColor, this.lights.fillColor);
    gl.uniform3fv(this._uMain.uRimDir, this.lights.rimDir);
    gl.uniform3fv(this._uMain.uRimColor, this.lights.rimColor);
    gl.uniform3fv(this._uMain.uSkyColor, this.lights.skyColor);
    gl.uniform3fv(this._uMain.uGroundColor, this.lights.groundColor);
    gl.uniform1f(this._uMain.uExposure, this.lights.exposure);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this._shadowTex);
    gl.uniform1i(this._uMain.uShadowMap, 0);

    const normMat = new Float32Array(9);
    const drawMesh = (m) => {
      const gpu = this._getGeoGpu(m.geometry);
      const mat = m.material;
      m4NormalMat3(m.worldMatrix, normMat);
      gl.uniformMatrix4fv(this._uMain.uModel, false, m.worldMatrix);
      gl.uniformMatrix3fv(this._uMain.uNormalMat, false, normMat);
      gl.uniform3fv(this._uMain.uColor, mat.color);
      gl.uniform1f(this._uMain.uRoughness, mat.roughness);
      gl.uniform1f(this._uMain.uMetalness, mat.metalness);
      gl.uniform1f(this._uMain.uFuzz, mat.fuzz);
      gl.uniform1i(this._uMain.uFabric, mat.fabric);
      gl.uniform1f(this._uMain.uOpacity, mat.opacity);
      gl.uniform3fv(this._uMain.uEmissive, mat.emissive);
      gl.uniform1f(this._uMain.uEmissiveIntensity, mat.emissiveIntensity);
      gl.uniform1f(this._uMain.uReceiveShadow, mat.receiveShadow ? 1.0 : 0.0);
      gl.bindVertexArray(gpu.vao);
      gl.drawElements(gl.TRIANGLES, gpu.count, gl.UNSIGNED_SHORT, 0);
    };

    gl.disable(gl.BLEND);
    gl.depthMask(true);
    for (let i = 0; i < opaque.length; i++) drawMesh(opaque[i]);

    if (transparent.length > 0) {
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      gl.depthMask(false);
      for (let i = 0; i < transparent.length; i++) drawMesh(transparent[i]);
      gl.depthMask(true);
      gl.disable(gl.BLEND);
    }

    gl.bindVertexArray(null);
  }

  destroy() {
    if (this._destroyed) return;
    this._destroyed = true;
    const gl = this.gl;
    for (const b of this._allBuffers) {
      gl.deleteVertexArray(b.vao);
      gl.deleteBuffer(b.pBuf);
      gl.deleteBuffer(b.nBuf);
      gl.deleteBuffer(b.uBuf);
      gl.deleteBuffer(b.iBuf);
    }
    this._allBuffers.length = 0;
    if (this._shadowTex) gl.deleteTexture(this._shadowTex);
    if (this._shadowFbo) gl.deleteFramebuffer(this._shadowFbo);
    if (this._mainProg) gl.deleteProgram(this._mainProg);
    if (this._shadowProg) gl.deleteProgram(this._shadowProg);
  }
}

/**
 * HAIZ Campus Toybox — Spec-Compliant glTF 2.0 Binary (.glb) Exporter
 */

function pad4(n) {
  return (n + 3) & ~3;
}
function exportNodeToGLB(rootNode, assetName = 'haiz-toybox-character') {
  rootNode.updateWorldMatrix(null);

  const meshes = [];
  const collect = (n) => {
    if (!n.visible) return;
    if (n.isMesh && n.geometry) meshes.push(n);
    for (const c of n.children) collect(c);
  };
  collect(rootNode);

  const binChunks = [];
  let byteOffset = 0;
  const bufferViews = [];
  const accessors = [];
  const materials = [];
  const primitives = [];

  const pushChunk = (typedArray, target) => {
    const u8 = new Uint8Array(typedArray.buffer, typedArray.byteOffset, typedArray.byteLength);
    const paddedLen = pad4(u8.byteLength);
    const chunk = new Uint8Array(paddedLen);
    chunk.set(u8);
    const bvIdx = bufferViews.length;
    bufferViews.push({
      buffer: 0,
      byteOffset,
      byteLength: u8.byteLength,
      ...(target ? { target } : {})
    });
    binChunks.push(chunk);
    byteOffset += paddedLen;
    return bvIdx;
  };

  for (let i = 0; i < meshes.length; i++) {
    const m = meshes[i];
    const geo = m.geometry;
    const mat = m.material;
    const vCount = geo.positions.length / 3;

    const posBaked = new Float32Array(geo.positions.length);
    const normBaked = new Float32Array(geo.normals.length);
    const nm = m4NormalMat3(m.worldMatrix);
    const min = [Infinity, Infinity, Infinity];
    const max = [-Infinity, -Infinity, -Infinity];

    for (let v = 0; v < vCount; v++) {
      const idx = v * 3;
      const wp = m4TransformPoint(m.worldMatrix, [
        geo.positions[idx],
        geo.positions[idx + 1],
        geo.positions[idx + 2]
      ]);
      posBaked[idx] = wp[0];
      posBaked[idx + 1] = wp[1];
      posBaked[idx + 2] = wp[2];
      for (let k = 0; k < 3; k++) {
        if (wp[k] < min[k]) min[k] = wp[k];
        if (wp[k] > max[k]) max[k] = wp[k];
      }

      const nx = geo.normals[idx], ny = geo.normals[idx + 1], nz = geo.normals[idx + 2];
      let wnx = nm[0] * nx + nm[3] * ny + nm[6] * nz;
      let wny = nm[1] * nx + nm[4] * ny + nm[7] * nz;
      let wnz = nm[2] * nx + nm[5] * ny + nm[8] * nz;
      const len = Math.hypot(wnx, wny, wnz) || 1;
      normBaked[idx] = wnx / len;
      normBaked[idx + 1] = wny / len;
      normBaked[idx + 2] = wnz / len;
    }

    const posBv = pushChunk(posBaked, 34962);
    const normBv = pushChunk(normBaked, 34962);
    const idxBv = pushChunk(geo.indices, 34963);

    const posAcc = accessors.length;
    accessors.push({ bufferView: posBv, componentType: 5126, count: vCount, type: 'VEC3', min, max });

    const normAcc = accessors.length;
    accessors.push({ bufferView: normBv, componentType: 5126, count: vCount, type: 'VEC3' });

    const idxAcc = accessors.length;
    accessors.push({ bufferView: idxBv, componentType: 5123, count: geo.indices.length, type: 'SCALAR' });

    const matIdx = materials.length;
    materials.push({
      name: `${assetName}_mat_${i}`,
      pbrMetallicRoughness: {
        baseColorFactor: [mat.color[0], mat.color[1], mat.color[2], mat.opacity ?? 1.0],
        metallicFactor: mat.metalness ?? 0.0,
        roughnessFactor: mat.roughness ?? 0.85
      }
    });

    primitives.push({
      attributes: { POSITION: posAcc, NORMAL: normAcc },
      indices: idxAcc,
      material: matIdx
    });
  }

  const gltf = {
    asset: { version: '2.0', generator: 'HAIZ Campus Toybox V2 Exporter' },
    scene: 0,
    scenes: [{ name: assetName, nodes: [0] }],
    nodes: [{ name: assetName, mesh: 0 }],
    meshes: [{ name: assetName, primitives }],
    materials,
    accessors,
    bufferViews,
    buffers: [{ byteLength: byteOffset }]
  };

  const jsonBytes = new TextEncoder().encode(JSON.stringify(gltf));
  const jsonPaddedLen = pad4(jsonBytes.byteLength);
  const jsonChunk = new Uint8Array(jsonPaddedLen);
  jsonChunk.fill(0x20);
  jsonChunk.set(jsonBytes);

  const totalLen = 12 + 8 + jsonPaddedLen + 8 + byteOffset;
  const glb = new Uint8Array(totalLen);
  const dv = new DataView(glb.buffer);

  dv.setUint32(0, 0x46546c67, true);
  dv.setUint32(4, 2, true);
  dv.setUint32(8, totalLen, true);

  dv.setUint32(12, jsonPaddedLen, true);
  dv.setUint32(16, 0x4e4f534a, true);
  glb.set(jsonChunk, 20);

  const binHeaderOffset = 20 + jsonPaddedLen;
  dv.setUint32(binHeaderOffset, byteOffset, true);
  dv.setUint32(binHeaderOffset + 4, 0x004e4942, true);
  let cursor = binHeaderOffset + 8;
  for (const c of binChunks) {
    glb.set(c, cursor);
    cursor += c.byteLength;
  }

  return glb;
}

const BUILTIN_BUILDERS = {
  'lanren-spirit': buildLanrenSpirit,
  'sunshine-duck': buildSunshineDuck,
  'campus-cat': buildCampusCat,
  'schoolbag-bear': buildSchoolbagBear,
  'ocean-whale': buildOceanWhale,
  'hainan-fawn': buildHainanFawn
};
function createToyboxCharacter(id, options = {}) {
  const meta = getCharacterMeta(id) || getCharacterMeta('lanren-spirit');
  const customBuilder = getCustomCharacterBuilder(id);
  const built = customBuilder ? customBuilder() : (BUILTIN_BUILDERS[id] || buildLanrenSpirit)();
  const { root, parts } = built;

  const rest = {
    bodyScale: [...parts.bodyPivot.scale],
    bodyPos: [...parts.bodyPivot.position],
    headRot: parts.headPivot ? [...parts.headPivot.rotation] : [0, 0, 0],
    leftArmRot: parts.leftArm ? [...parts.leftArm.rotation] : [0, 0, 0],
    rightArmRot: parts.rightArm ? [...parts.rightArm.rotation] : [0, 0, 0],
    leftEarRot: parts.leftEar ? [...parts.leftEar.rotation] : [0, 0, 0],
    rightEarRot: parts.rightEar ? [...parts.rightEar.rotation] : [0, 0, 0],
    accRot: parts.accessory ? [...parts.accessory.rotation] : [0, 0, 0],
    leftEyeScale: parts.leftEye ? [...parts.leftEye.scale] : [1, 1, 1],
    rightEyeScale: parts.rightEye ? [...parts.rightEye.scale] : [1, 1, 1]
  };

  const phaseOffset = options.phaseOffset ?? Math.random() * Math.PI * 2;
  let blinkCooldown = 2.2 + Math.random() * 2.6;
  let blinkTimer = 0;
  let bounceTimer = 0;

  function triggerBounce() {
    bounceTimer = 0.55;
  }

  function animate(time, dt, mode = 'idle', reducedMotion = false) {
    if (reducedMotion) {
      parts.bodyPivot.scale = [...rest.bodyScale];
      parts.bodyPivot.position = [...rest.bodyPos];
      if (parts.headPivot) parts.headPivot.rotation = [...rest.headRot];
      return;
    }

    const t = time + phaseOffset;

    blinkCooldown -= dt;
    if (blinkCooldown <= 0) {
      blinkTimer = 0.16;
      blinkCooldown = (meta.personality === 'cozy' ? 2.6 : 3.2) + Math.random() * 2.8;
    }

/**
 * HAIZ Toybox V2 — Deterministic Verification State Machine
 */

const TRANSITIONS = Object.freeze({
  [VerificationState.CLOSED]: [VerificationState.WAKING],
  [VerificationState.WAKING]: [VerificationState.SEEKING, VerificationState.ERROR, VerificationState.CLOSED],
  [VerificationState.SEEKING]: [
    VerificationState.DESCENDING,
    VerificationState.VERIFYING,
    VerificationState.ERROR,
    VerificationState.CLOSED
  ],
  [VerificationState.DESCENDING]: [VerificationState.GRASPING, VerificationState.CLOSED],
  [VerificationState.GRASPING]: [VerificationState.LIFTING, VerificationState.CLOSED],
  [VerificationState.LIFTING]: [VerificationState.CARRYING, VerificationState.RETRY_HINT, VerificationState.CLOSED],
  [VerificationState.CARRYING]: [VerificationState.DROPPING, VerificationState.CLOSED],
  [VerificationState.DROPPING]: [
    VerificationState.CELEBRATING,
    VerificationState.VERIFYING,
    VerificationState.RETRY_HINT,
    VerificationState.CLOSED
  ],
  [VerificationState.CELEBRATING]: [VerificationState.VERIFYING, VerificationState.SUCCESS, VerificationState.CLOSED],
  [VerificationState.RETRY_HINT]: [VerificationState.SEEKING, VerificationState.WAKING, VerificationState.CLOSED],
  [VerificationState.VERIFYING]: [
    VerificationState.SUCCESS,
    VerificationState.RETRY_HINT,
    VerificationState.ERROR,
    VerificationState.CLOSED
  ],
  [VerificationState.SUCCESS]: [VerificationState.WAKING, VerificationState.CLOSED],
  [VerificationState.ERROR]: [VerificationState.WAKING, VerificationState.SEEKING, VerificationState.CLOSED]
});
class VerificationStateMachine {
  constructor(initial = VerificationState.CLOSED) {
    this._state = initial;
  }

  get state() {
    return this._state;
  }

  getStepIndex() {
    switch (this._state) {
      case VerificationState.WAKING:
      case VerificationState.SEEKING:
      case VerificationState.RETRY_HINT:
        return 1;
      case VerificationState.DESCENDING:
      case VerificationState.GRASPING:
      case VerificationState.LIFTING:
        return 2;
      case VerificationState.CARRYING:
      case VerificationState.DROPPING:
      case VerificationState.CELEBRATING:
      case VerificationState.VERIFYING:
      case VerificationState.SUCCESS:
        return 3;
      default:
        return 1;
    }
  }

  canTransition(next) {
    return (TRANSITIONS[this._state] || []).includes(next);
  }

  transition(next) {
    if (next === this._state) return true;
    if (!this.canTransition(next)) return false;
    this._state = next;
    return true;
  }

  forceReset(state = VerificationState.CLOSED) {
    this._state = state;
  }
}

function sanitizeChallengeSubmission(raw) {
  return {
    challengeId: String(raw.challengeId || ''),
    nonce: String(raw.nonce || ''),
    selectedCharacterId: String(raw.selectedCharacterId || ''),
    antiBotToken: raw.antiBotToken ? String(raw.antiBotToken) : null,
    inputModality: ['joystick', 'keyboard', 'touch', 'accessible'].includes(raw.inputModality)
      ? raw.inputModality
      : 'joystick',
    elapsedMs: Math.max(0, Math.min(600000, Math.round(Number(raw.elapsedMs) || 0))),
    attemptIndex: Math.max(1, Math.min(50, Math.round(Number(raw.attemptIndex) || 1)))
  };
}

function shuffledIds(seedOffset = 0) {
  const ids = CHARACTER_REGISTRY.map((c) => c.id);
  for (let i = ids.length - 1; i > 0; i--) {
    const j = Math.floor(((Math.random() + seedOffset) % 1) * (i + 1));
    [ids[i], ids[j]] = [ids[j], ids[i]];
  }
  return ids;
}
class MockToyboxAdapter {
  constructor(options = {}) {
    this.isMock = true;
    this.latencyMs = typeof options.latencyMs === 'number' ? options.latencyMs : 420;
    this.forcedTargetId = options.forcedTargetId || null;
    this.requireAntiBotToken = Boolean(options.requireAntiBotToken);
    this._sessions = new Map();
    this._seq = 0;
  }

  async fetchChallenge(signal) {
    await this._delay(Math.min(220, this.latencyMs), signal);
    this._seq += 1;
    const layoutOrder = this.forcedTargetId ? CHARACTER_REGISTRY.map((c) => c.id) : shuffledIds();
    const targetId = this.forcedTargetId || layoutOrder[Math.floor(Math.random() * layoutOrder.length)];
    const target = CHARACTER_REGISTRY.find((c) => c.id === targetId) || CHARACTER_REGISTRY[0];

    const challengeId = `mock_v2_${Date.now().toString(36)}_${this._seq}`;
    const nonce = Math.random().toString(36).slice(2, 12);
    const expiresAt = Date.now() + 120000;

    this._sessions.set(challengeId, {
      targetId: target.id,
      nonce,
      expiresAt,
      status: 'PENDING'
    });

    return {
      challengeId,
      nonce,
      layoutOrder,
      targetCharacterId: target.id,
      targetNameZh: target.nameZh,
      expiresAt,
      status: 'PENDING',
      isMock: true
    };
  }

  async verifyChallenge(rawSubmission, signal) {
    const sub = sanitizeChallengeSubmission(rawSubmission);
    await this._delay(this.latencyMs, signal);

    const rec = this._sessions.get(sub.challengeId);
    if (!rec) {
      return { verified: false, code: 'CHALLENGE_NOT_FOUND', message: '验证会话已失效，请重新获取。', retryable: true, isMock: true };
    }
    if (rec.status !== 'PENDING') {
      return { verified: false, code: 'CHALLENGE_CONSUMED', message: '该次验证已结束，请开启新一轮挑战。', retryable: true, isMock: true };
    }
    if (Date.now() > rec.expiresAt) {
      rec.status = 'EXPIRED';
      return { verified: false, code: 'CHALLENGE_EXPIRED', message: '本次挑战已超时，请再试一次。', retryable: true, isMock: true };
    }
    if (rec.nonce !== sub.nonce) {
      return { verified: false, code: 'INVALID_NONCE', message: '验证凭证不一致。', retryable: true, isMock: true };
    }
    if (this.requireAntiBotToken && !sub.antiBotToken) {
      return { verified: false, code: 'MISSING_ANTIBOT_TOKEN', message: '缺少独立反机器人验证凭证。', retryable: true, isMock: true };
    }
    if (sub.selectedCharacterId !== rec.targetId) {
      return { verified: false, code: 'WRONG_CHARACTER', message: '抓到的玩偶与目标不一致，再试试看。', retryable: true, isMock: true };
    }

    rec.status = 'VERIFIED';
    const token = `haiz_v2_mock.${btoa(`${sub.challengeId}:${rec.nonce}`).replace(/=+$/, '')}`;
    return {
      verified: true,
      code: 'OK',
      message: '抓到啦，欢迎来到 HAIZ。',
      verificationToken: token,
      challengeId: sub.challengeId,
      verifiedAt: new Date().toISOString(),
      isMock: true
    };
  }

  _delay(ms, signal) {
    return new Promise((resolve, reject) => {
      if (signal && signal.aborted) {
        reject(new DOMException('Aborted', 'AbortError'));

      }
      const timer = setTimeout(() => {
        if (signal) signal.removeEventListener('abort', onAbort);
        resolve();
      }, ms);
      const onAbort = () => {
        clearTimeout(timer);
        reject(new DOMException('Aborted', 'AbortError'));
      };
      if (signal) signal.addEventListener('abort', onAbort, { once: true });
    });
  }
}
class HttpDualLayerAdapter {
  constructor(options = {}) {
    if (!options.baseUrl) {
      throw new Error('HttpDualLayerAdapter requires baseUrl.');
    }
    this.isMock = false;
    this.baseUrl = options.baseUrl.replace(/\/+$/, '');
    this.headers = options.headers || {};
    this.credentials = options.credentials || 'same-origin';
    this.antiBotProvider = options.antiBotProvider || null;
    this.fetchImpl = options.fetch || (typeof fetch === 'function' ? fetch.bind(globalThis) : null);
  }

  async fetchChallenge(signal) {
    const res = await this.fetchImpl(`${this.baseUrl}/challenge`, {
      method: 'POST',
      credentials: this.credentials,
      headers: { 'Content-Type': 'application/json', ...this.headers },
      body: JSON.stringify({ client: 'haiz-toybox-v2', version: '2.0.0' }),
      signal
    });
    if (!res.ok) throw new Error(`Challenge HTTP ${res.status}`);
    const data = await res.json();
    if (!data || !data.challengeId || !data.targetCharacterId) {
      throw new Error('Invalid server challenge response');
    }
    return { ...data, isMock: false };
  }

  async verifyChallenge(rawSubmission, signal) {
    let antiBotToken = rawSubmission.antiBotToken || null;
    if (!antiBotToken && this.antiBotProvider && typeof this.antiBotProvider.getToken === 'function') {
      antiBotToken = await this.antiBotProvider.getToken(signal);
    }
    const payload = sanitizeChallengeSubmission({ ...rawSubmission, antiBotToken });
    const res = await this.fetchImpl(`${this.baseUrl}/verify`, {
      method: 'POST',
      credentials: this.credentials,
      headers: { 'Content-Type': 'application/json', ...this.headers },
      body: JSON.stringify(payload),
      signal
    });
    if (!res.ok) {
      return {
        verified: false,
        code: `HTTP_${res.status}`,
        message: '服务端验证请求失败，请稍后重试。',
        retryable: true,
        isMock: false
      };
    }
    const data = await res.json();
    return {
      verified: Boolean(data && data.verified === true && data.verificationToken),
      code: data.code || (data.verified ? 'OK' : 'REJECTED'),
      message: data.message || (data.verified ? '抓到啦，欢迎来到 HAIZ。' : '服务端验证未通过。'),
      verificationToken: data.verificationToken || null,
      challengeId: payload.challengeId,
      retryable: data.retryable !== false,
      isMock: false
    };
  }
}

/**
 * HAIZ Toybox V2 — Spring-Damper Claw Kinematics
 */
class ClawKinematics {
  constructor() {
    this.reset();
  }

  reset() {
    this.x = 0.0;
    this.vx = 0.0;
    this.clawY = SHOWCASE_BOUNDS.restClawY;
    this.targetClawY = SHOWCASE_BOUNDS.restClawY;
    this.swingAngle = 0.0;
    this.swingVel = 0.0;
    this.prongOpen = 0.30;
    this.targetProngOpen = 0.30;
    this.weightStretch = 0.0;
  }

  step(dt, inputX, allowMove, hasPayload) {
    const cdt = Math.min(0.05, Math.max(0.001, dt));
    const maxSpeed = hasPayload ? 2.15 : 2.70;
    const accel = allowMove ? 14.5 : 0.0;
    const damp = 8.0;

    const prevVx = this.vx;
    if (allowMove && Math.abs(inputX) > 0.02) {
      this.vx += inputX * accel * cdt;
      this.vx = Math.max(-maxSpeed, Math.min(maxSpeed, this.vx));
    } else {
      this.vx *= Math.exp(-damp * cdt);
      if (Math.abs(this.vx) < 0.004) this.vx = 0;
    }

    const nextX = this.x + this.vx * cdt;
    if (nextX < SHOWCASE_BOUNDS.minX) {
      this.x = SHOWCASE_BOUNDS.minX;
      this.vx = Math.max(0, -this.vx * 0.18);
    } else if (nextX > SHOWCASE_BOUNDS.maxX) {
      this.x = SHOWCASE_BOUNDS.maxX;
      this.vx = Math.min(0, -this.vx * 0.18);
    } else {
      this.x = nextX;
    }

    const ax = (this.vx - prevVx) / cdt;
    const k = hasPayload ? 24.0 : 34.0;
    const c = hasPayload ? 3.6 : 4.8;
    const torque = -ax * (hasPayload ? 0.025 : 0.017) - k * this.swingAngle - c * this.swingVel;
    this.swingVel += torque * cdt;
    this.swingAngle = Math.max(-0.28, Math.min(0.28, this.swingAngle + this.swingVel * cdt));

    this.clawY += (this.targetClawY - this.clawY) * (1 - Math.exp(-10.5 * cdt));
    this.prongOpen += (this.targetProngOpen - this.prongOpen) * (1 - Math.exp(-13.0 * cdt));

    const targetW = hasPayload ? 0.068 : 0.0;
    this.weightStretch += (targetW - this.weightStretch) * (1 - Math.exp(-8.5 * cdt));

    return { speedRatio: Math.min(1, Math.abs(this.vx) / maxSpeed) };
  }

  impulseSwing(v) {
    this.swingVel += v;
  }

  isOverPrizeChute() {
    return Math.abs(this.x - SHOWCASE_BOUNDS.chuteX) <= SHOWCASE_BOUNDS.chuteRadius;
  }
}

/**
 * HAIZ Toybox V2 — Procedural Web Audio Mechanical & Toy Foley Engine
 */
class SoundEngine {
  constructor(enabled = true) {
    this._enabled = Boolean(enabled);
    this._ctx = null;
    this._servoOsc = null;
    this._servoGain = null;
    this._destroyed = false;
  }

  get enabled() { return this._enabled; }

  setEnabled(flag) {
    this._enabled = Boolean(flag);
    if (!this._enabled) this.stopServo();
  }

  unlock() {
    if (this._destroyed || !this._enabled || typeof window === 'undefined') return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!this._ctx) {
      try { this._ctx = new AC(); } catch (_e) { return; }
    }
    if (this._ctx.state === 'suspended') this._ctx.resume().catch(() => {});
  }

  _ready() {
    if (this._destroyed || !this._enabled || !this._ctx) return false;
    if (this._ctx.state === 'suspended') this._ctx.resume().catch(() => {});
    return this._ctx.state === 'running';
  }

  playWake() {
    if (!this._ready()) return;
    const t = this._ctx.currentTime;
    this._tone(440, 523.25, t, 0.14, 0.04, 'sine');
    this._tone(659.25, 659.25, t + 0.08, 0.16, 0.035, 'triangle');
  }

  playButtonClick() {
    if (!this._ready()) return;
    const t = this._ctx.currentTime;
    this._tone(860, 260, t, 0.045, 0.09, 'triangle');
    this._tone(165, 105, t + 0.01, 0.05, 0.075, 'sine');
  }

  updateServo(speedRatio) {
    if (!this._ready() || speedRatio < 0.06) {
      this.stopServo();
      return;
    }
    const ctx = this._ctx;
    const t = ctx.currentTime;
    if (!this._servoOsc) {
      const osc = ctx.createOscillator();
      const filter = ctx.createBiquadFilter();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      filter.type = 'lowpass';
      filter.frequency.value = 240;
      gain.gain.setValueAtTime(0.0001, t);
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t);
      this._servoOsc = osc;
      this._servoGain = gain;
    }
    const c = Math.min(1, Math.max(0, speedRatio));
    this._servoOsc.frequency.setTargetAtTime(100 + c * 46, t, 0.04);
    this._servoGain.gain.setTargetAtTime(0.010 + c * 0.014, t, 0.05);
  }

  stopServo() {
    if (!this._servoOsc || !this._servoGain || !this._ctx) return;
    const t = this._ctx.currentTime;
    try {
      this._servoGain.gain.setTargetAtTime(0.0001, t, 0.03);
      const osc = this._servoOsc;
      setTimeout(() => { try { osc.stop(); osc.disconnect(); } catch (_e) {} }, 90);
    } catch (_e) {}
    this._servoOsc = null;
    this._servoGain = null;
  }

  playDescent() {
    if (!this._ready()) return;
    const t = this._ctx.currentTime;
    this._tone(300, 185, t, 0.34, 0.042, 'triangle');
  }

  playGrab(caught) {
    if (!this._ready()) return;
    const t = this._ctx.currentTime;
    if (caught) {
      this._tone(195, 310, t, 0.11, 0.08, 'sine');
      this._tone(392, 523.25, t + 0.07, 0.14, 0.055, 'triangle');
    } else {
      this._tone(230, 135, t, 0.12, 0.05, 'triangle');
    }
  }

  playDrop() {
    if (!this._ready()) return;
    const t = this._ctx.currentTime;
    this._tone(500, 250, t, 0.14, 0.055, 'sine');
    this._tone(160, 110, t + 0.15, 0.09, 0.07, 'sine');
  }

  playPopUpCelebration() {
    if (!this._ready()) return;
    const t = this._ctx.currentTime;
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      this._tone(f, f, t + i * 0.07, 0.30, 0.06, 'sine');
    });
  }

  playSoftRetry() {
    if (!this._ready()) return;
    const t = this._ctx.currentTime;
    this._tone(320, 255, t, 0.14, 0.052, 'sine');
    this._tone(255, 215, t + 0.11, 0.15, 0.042, 'sine');
  }

  _tone(f0, f1, start, dur, amp, type) {
    const ctx = this._ctx;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(f0, start);
    if (f0 !== f1) osc.frequency.exponentialRampToValueAtTime(Math.max(20, f1), start + dur);
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.linearRampToValueAtTime(amp, start + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(start);
    osc.stop(start + dur + 0.02);
  }

  destroy() {
    this._destroyed = true;
    this.stopServo();
    if (this._ctx) {
      try { this._ctx.close(); } catch (_e) {}
      this._ctx = null;
    }
  }
}

  _populateCharacters(layoutOrder) {
    if (this.plushGroup) {
      this.root.remove(this.plushGroup);
    }
    this.plushGroup = new Node3D('plushGroup');
    this.entries.clear();

    const ids = Array.isArray(layoutOrder) && layoutOrder.length === 6
      ? layoutOrder
      : CHARACTER_REGISTRY.map((c) => c.id);

    ids.forEach((id, idx) => {
      const slot = SHOWCASE_SLOTS[idx % SHOWCASE_SLOTS.length];
      const char = createToyboxCharacter(id, { phaseOffset: idx * 1.15 });
      char.root.position = [slot.x, slot.y, slot.z];
      char.root.rotation = [0, slot.rotY, slot.tiltZ];
      char.root.scale = [slot.scale, slot.scale, slot.scale];
      this.plushGroup.add(char.root);

      this.entries.set(id, {
        id,
        char,
        meta: char.meta,
        homePos: [slot.x, slot.y, slot.z],
        homeRot: [0, slot.rotY, slot.tiltZ],
        baseScale: slot.scale,
        collected: false,
        settleAmp: 0,
        settlePhase: 0
      });
    });

    this.root.add(this.plushGroup);
  }

  applyLayout(layoutOrder) {
    this.carriedEntry = null;
    this.droppingEntry = null;
    this.returningEntry = null;
    this.celebratingEntry = null;
    this._populateCharacters(layoutOrder);
  }

  applyTheme(themeId) {
    const t = TOYBOX_THEMES[themeId] || TOYBOX_THEMES.porcelain;
    this.themeId = t.id;
    this.renderer.clearColor = [...t.stageClear];
    this.wallMat.color = [...t.wallColor];
    this.floorMat.color = [...t.floorColor];
    this.wallMeshes.forEach((m) => { m.material.color = [...t.wallColor]; });
    this.floorMeshes.forEach((m) => { m.material.color = [...t.floorColor]; });
    this.renderer.lights.keyColor = [...t.keyColor];
    this.renderer.lights.fillColor = [...t.fillColor];
    this.renderer.lights.rimColor = [...t.rimColor];
    this.renderer.lights.skyColor = [...t.skyColor];
    this.renderer.lights.groundColor = [...t.groundColor];
    this.renderer.lights.exposure = t.exposure;
  }

  setReducedMotion(flag) { this.reducedMotion = Boolean(flag); }
  setCameraOverride(cam) { this._cameraOverride = cam; }

  triggerWakeAnimation() {
    this.kinematics.reset();
    this.carriedEntry = null;
    this.droppingEntry = null;
    this.returningEntry = null;
    this.celebratingEntry = null;
    this._wakeActive = !this.reducedMotion;
    this._wakeT = 0;
  }

  findCatchableCharacter() {
    const cx = this.kinematics.x;
    let best = null;
    let bestDist = 0.56;
    this.entries.forEach((e) => {
      if (e.collected) return;
      const d = Math.abs(e.char.root.position[0] - cx);
      if (d < bestDist) {
        bestDist = d;
        best = e;
      }
    });
    return best;
  }

  attachToClaw(entry) {
    if (!entry) return;
    this.carriedEntry = entry;
    this.grabAnchor.add(entry.char.root);
    const gh = entry.char.root.userData.grabHeight || 0.76;
    entry.char.root.position = [0, -gh * 0.92, 0];
    entry.char.root.rotation = [0, entry.homeRot[1] * 0.35, 0];
    this.kinematics.impulseSwing((Math.random() - 0.5) * 0.55);

    this.entries.forEach((other) => {
      if (other === entry || other.collected) return;
      const dist = Math.abs(other.homePos[0] - entry.homePos[0]);
      if (dist < 1.1) {
        other.settleAmp = (1.1 - dist) * 0.08;
        other.settlePhase = 0;
      }
    });
  }

  releaseCarried(intoChute) {
    const entry = this.carriedEntry;
    if (!entry) return null;
    this.carriedEntry = null;

    this.root.updateWorldMatrix(null);
    const wp = m4TransformPoint(entry.char.root.worldMatrix, [0, 0, 0]);
    this.plushGroup.add(entry.char.root);
    entry.char.root.position = wp;
    entry.char.root.scale = [entry.baseScale, entry.baseScale, entry.baseScale];

    if (intoChute) {
      this.droppingEntry = { entry, vy: -0.7, targetX: SHOWCASE_BOUNDS.chuteX, done: false };
    } else {
      this.returningEntry = { entry, progress: 0, startPos: [...wp] };
    }
    return entry;
  }

  returnToPile(entry) {
    if (!entry) return;
    if (this.carriedEntry === entry) this.carriedEntry = null;
    if (this.droppingEntry && this.droppingEntry.entry === entry) this.droppingEntry = null;
    this.root.updateWorldMatrix(null);
    const wp = m4TransformPoint(entry.char.root.worldMatrix, [0, 0, 0]);
    this.plushGroup.add(entry.char.root);
    entry.char.root.position = wp;
    entry.char.root.visible = true;
    entry.collected = false;
    this.returningEntry = { entry, progress: 0, startPos: [...wp] };
  }

  startPopUpCelebration(characterId) {
    const entry = this.entries.get(characterId);
    if (!entry) return;
    this.droppingEntry = null;
    this.carriedEntry = null;
    this.plushGroup.add(entry.char.root);
    entry.char.root.visible = true;
    entry.collected = true;
    entry.char.root.position = [SHOWCASE_BOUNDS.chuteX + 0.06, SHOWCASE_BOUNDS.floorY - 0.65, 0.56];
    entry.char.root.rotation = [0, 0.22, 0];
    const s = entry.baseScale * 1.12;
    entry.char.root.scale = [s, s, s];
    this.celebratingEntry = { entry, progress: 0 };
  }

  setChuteHighlighted(active) { this._chuteHighlight = Boolean(active); }

  resize() {
    if (this._destroyed || !this.canvas) return;
    const parent = this.canvas.parentElement;
    const w = Math.max(240, parent ? parent.clientWidth : this.canvas.clientWidth || 440);
    const h = Math.max(200, parent ? parent.clientHeight : this.canvas.clientHeight || 310);
    const isLowPower = typeof navigator !== 'undefined' && navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4;
    this.renderer.setSize(w, h, isLowPower ? 1.5 : 2.0);
    const aspect = w / h;
    this.camera.eye[2] = aspect < 1.25 ? 6.25 : 5.55;
  }

  start() {
    if (this._destroyed || this._rafId !== null) return;
    this._paused = false;
    this._lastTime = performance.now();
    const tick = (now) => {
      if (this._destroyed || this._paused) {
        this._rafId = null;
        return;
      }
      const dt = Math.min(0.05, Math.max(0.001, (now - this._lastTime) / 1000));
      this._lastTime = now;
      this.stepAndRender(dt);
      this._rafId = requestAnimationFrame(tick);
    };
    this._rafId = requestAnimationFrame(tick);
  }

  stepAndRender(dt = 0.016) {
    this._elapsed += dt;
    if (this.onFrame) this.onFrame(dt);

    if (this._wakeActive) {
      this._wakeT += dt * 1.6;
      if (this._wakeT >= 1) {
        this._wakeActive = false;
        this.kinematics.targetProngOpen = 0.30;
      } else {
        this.kinematics.targetProngOpen = 0.30 + Math.sin(this._wakeT * Math.PI) * 0.55;
      }
    }

    this.carriageGroup.position[0] = this.kinematics.x;
    const clawRelY = this.kinematics.clawY - SHOWCASE_BOUNDS.railY - this.kinematics.weightStretch;
    const springLen = Math.max(0.24, -clawRelY - 0.19);
    this.springMesh.scale = [1, springLen, 1];
    this.rodMesh.scale = [1, springLen, 1];
    this.clawPivot.position[1] = clawRelY;
    this.clawPivot.rotation[2] = this.reducedMotion ? 0 : this.kinematics.swingAngle;

    const openRad = 0.06 + this.kinematics.prongOpen * 0.58;
    for (let i = 0; i < this.prongs.length; i++) {
      this.prongs[i].rotation[2] = openRad;
    }

    if (this.droppingEntry && !this.droppingEntry.done) {
      const d = this.droppingEntry;
      d.vy -= 11.8 * dt;
      d.entry.char.root.position[1] += d.vy * dt;
      d.entry.char.root.position[0] += (d.targetX - d.entry.char.root.position[0]) * Math.min(1, dt * 8);
      d.entry.char.root.rotation[2] += dt * 1.3;
      if (d.entry.char.root.position[1] <= SHOWCASE_BOUNDS.floorY - 0.58) {
        d.entry.collected = true;
        d.entry.char.root.visible = false;
        d.done = true;
      }
    }

    if (this.returningEntry) {
      const r = this.returningEntry;
      r.progress = Math.min(1, r.progress + dt * 2.5);
      const ease = 1 - Math.pow(1 - r.progress, 3);
      for (let k = 0; k < 3; k++) {
        r.entry.char.root.position[k] = r.startPos[k] + (r.entry.homePos[k] - r.startPos[k]) * ease;
      }
      r.entry.char.root.position[1] += Math.sin(r.progress * Math.PI) * 0.24;
      r.entry.char.root.rotation[2] = r.entry.homeRot[2] * ease;
      if (r.progress >= 1) {
        r.entry.char.root.position = [...r.entry.homePos];
        r.entry.char.root.rotation = [...r.entry.homeRot];
        r.entry.char.triggerBounce();
        this.returningEntry = null;
      }
    }

    if (this.celebratingEntry) {
      const c = this.celebratingEntry;
      c.progress = Math.min(1, c.progress + dt * 2.6);
      const t = c.progress;
      const overshoot = t < 1 ? 1 - Math.pow(1 - t, 3) + Math.sin(t * Math.PI) * 0.12 : 1;
      const startY = SHOWCASE_BOUNDS.floorY - 0.52;
      const endY = SHOWCASE_BOUNDS.floorY + 0.16;
      c.entry.char.root.position[1] = startY + (endY - startY) * overshoot;
    }

    this.entries.forEach((entry) => {
      if (entry === this.carriedEntry) {
        entry.char.animate(this._elapsed, dt, 'grabbed', this.reducedMotion);
      } else if (this.celebratingEntry && this.celebratingEntry.entry === entry) {
        entry.char.animate(this._elapsed, dt, 'celebrate', this.reducedMotion);
      } else if (!entry.collected) {
        entry.char.animate(this._elapsed, dt, 'idle', this.reducedMotion);
        if (entry.settleAmp > 0.001) {
          entry.settlePhase += dt * 12.5;
          entry.settleAmp *= Math.exp(-4.5 * dt);
          entry.char.root.rotation[2] = entry.homeRot[2] + Math.sin(entry.settlePhase) * entry.settleAmp;
        }
      }
    });

    const targetGlow = this._chuteHighlight ? 1.0 : 0.0;
    this._chuteGlow += (targetGlow - this._chuteGlow) * Math.min(1, dt * 8);
    this.chuteRimMat.emissiveIntensity = 0.08 + this._chuteGlow * 1.15;

    this.renderer.render(this.root, this._cameraOverride || this.camera);
  }

  pause() {
    this._paused = true;
    if (this._rafId !== null) {
      cancelAnimationFrame(this._rafId);
      this._rafId = null;
    }
  }

  resume() {
    if (this._destroyed) return;
    this._paused = false;
    this.start();
  }

  destroy() {
    this._destroyed = true;
    this.pause();
    this.renderer.destroy();
  }
}

/**
 * HAIZ Campus Toybox V2 — Independent Character Art Inspection Studio Scene
 */
class CharacterStudioScene {
  constructor(canvas, options = {}) {
    this.canvas = canvas;
    this.themeId = options.theme || 'porcelain';
    this.renderer = new ToyboxRenderer(canvas, { preserveDrawingBuffer: Boolean(options.preserveDrawingBuffer) });
    this.root = new Node3D('studioRoot');

    this.yaw = 0.34;
    this.pitch = 0.16;
    this.distance = 2.82;
    this.autoRotate = Boolean(options.autoRotate);
    this.animMode = 'idle';

    this._elapsed = 0;
    this._rafId = null;
    this._lastTime = 0;
    this._destroyed = false;
    this.currentCharacter = null;

    this._buildTurntable();
    this.applyTheme(this.themeId);
    this.setCharacter(options.characterId || 'lanren-spirit');
    this._bindOrbitControls();
    this.resize();
  }

  _buildTurntable() {
    this.plinthMat = { color: [0.85, 0.80, 0.72], roughness: 0.72, metalness: 0.04, fuzz: 0.2, fabric: FABRIC.PLUSH, castShadow: false };
    this.ringMat = { color: [0.82, 0.70, 0.45], roughness: 0.26, metalness: 0.82, fuzz: 0.0, fabric: FABRIC.METAL, castShadow: false };

    const plinth = new Mesh3D(createCylinder(0.72, 0.78, 0.16, 40), this.plinthMat, 'plinth');
    plinth.position = [0, -0.08, 0];
    const brassRing = new Mesh3D(createCylinder(0.73, 0.73, 0.025, 40), this.ringMat, 'plinthRing');
    brassRing.position = [0, -0.005, 0];
    const floorPlane = new Mesh3D(createBox(8, 0.1, 8), this.plinthMat, 'studioFloor');
    floorPlane.position = [0, -0.21, 0];

    this.root.add(plinth, brassRing, floorPlane);
    this.charMount = new Node3D('charMount');
    this.root.add(this.charMount);
  }

  setCharacter(id) {
    if (this.currentCharacter) {
      this.charMount.remove(this.currentCharacter.root);
    }
    this.currentCharacter = createToyboxCharacter(id, { phaseOffset: 0 });
    this.currentCharacter.root.position = [0, 0, 0];
    this.currentCharacter.root.scale = [1.05, 1.05, 1.05];
    this.charMount.add(this.currentCharacter.root);
    return this.currentCharacter.meta;
  }

  setAnimationMode(mode) {
    this.animMode = mode;
    if (mode === 'bounce' && this.currentCharacter) {
      this.currentCharacter.triggerBounce();
      this.animMode = 'idle';
    }
  }

  setOrbit(yaw, pitch, distance) {
    if (typeof yaw === 'number') this.yaw = yaw;
    if (typeof pitch === 'number') this.pitch = Math.max(-0.2, Math.min(0.85, pitch));
    if (typeof distance === 'number') this.distance = Math.max(1.7, Math.min(4.2, distance));
  }

  applyTheme(themeId) {
    const t = TOYBOX_THEMES[themeId] || TOYBOX_THEMES.porcelain;
    this.themeId = t.id;
    this.renderer.clearColor = [...t.stageClear];
    this.plinthMat.color = [...t.floorColor];
    this.root.children.forEach((c) => {
      if (c.name === 'plinth' || c.name === 'studioFloor') c.material.color = [...t.floorColor];
    });
    this.renderer.lights.keyColor = [...t.keyColor];
    this.renderer.lights.fillColor = [...t.fillColor];
    this.renderer.lights.rimColor = [...t.rimColor];
    this.renderer.lights.skyColor = [...t.skyColor];
    this.renderer.lights.groundColor = [...t.groundColor];
    this.renderer.lights.exposure = t.exposure;
  }

  exportCurrentGLB() {
    if (!this.currentCharacter) return null;
    this.currentCharacter.animate(0, 0.016, 'idle', true);
    return exportNodeToGLB(this.currentCharacter.root, this.currentCharacter.id);
  }

  _bindOrbitControls() {
    let dragging = false;
    let lastX = 0, lastY = 0;

    this._onDown = (e) => {
      dragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
      this.autoRotate = false;
      try { this.canvas.setPointerCapture(e.pointerId); } catch (_e) {}
    };
    this._onMove = (e) => {
      if (!dragging) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;
      this.yaw -= dx * 0.012;
      this.pitch = Math.max(-0.12, Math.min(0.75, this.pitch + dy * 0.009));
    };
    this._onUp = () => { dragging = false; };
    this._onWheel = (e) => {
      e.preventDefault();
      this.distance = Math.max(1.7, Math.min(4.0, this.distance + e.deltaY * 0.002));
    };

    this.canvas.addEventListener('pointerdown', this._onDown);
    this.canvas.addEventListener('pointermove', this._onMove);
    this.canvas.addEventListener('pointerup', this._onUp);
    this.canvas.addEventListener('pointercancel', this._onUp);
    this.canvas.addEventListener('wheel', this._onWheel, { passive: false });
  }

  resize() {
    if (this._destroyed || !this.canvas) return;
    const parent = this.canvas.parentElement;
    const w = Math.max(240, parent ? parent.clientWidth : this.canvas.clientWidth || 420);
    const h = Math.max(240, parent ? parent.clientHeight : this.canvas.clientHeight || 360);
    this.renderer.setSize(w, h, 2.0);
  }

  start() {
    if (this._destroyed || this._rafId !== null) return;
    this._lastTime = performance.now();
    const tick = (now) => {
      if (this._destroyed) return;
      const dt = Math.min(0.05, Math.max(0.001, (now - this._lastTime) / 1000));
      this._lastTime = now;
      this.stepAndRender(dt);
      this._rafId = requestAnimationFrame(tick);
    };
    this._rafId = requestAnimationFrame(tick);
  }

  stepAndRender(dt = 0.016) {
    this._elapsed += dt;
    if (this.autoRotate) this.yaw += dt * 0.45;
    if (this.currentCharacter) {
      this.currentCharacter.animate(this._elapsed, dt, this.animMode, false);
    }
    const targetY = 0.49;
    const eye = [
      Math.sin(this.yaw) * Math.cos(this.pitch) * this.distance,
      targetY + Math.sin(this.pitch) * this.distance,
      Math.cos(this.yaw) * Math.cos(this.pitch) * this.distance
    ];
    this.renderer.render(this.root, {
      fov: 30,
      eye,
      target: [0, targetY, 0],
      shadowTarget: [0, 0.2, 0],
      shadowExtent: 1.8
    });
  }

  destroy() {
    this._destroyed = true;
    if (this._rafId !== null) cancelAnimationFrame(this._rafId);
    this.canvas.removeEventListener('pointerdown', this._onDown);
    this.canvas.removeEventListener('pointermove', this._onMove);
    this.canvas.removeEventListener('pointerup', this._onUp);
    this.canvas.removeEventListener('pointercancel', this._onUp);
    this.canvas.removeEventListener('wheel', this._onWheel);
    this.renderer.destroy();
  }
}

/**
 * HAIZ Toybox V2 — Tactile Machine Console & Input Controller
 */
class ConsoleController {
  constructor(elements, callbacks = {}) {
    this.joystickEl = elements.joystickEl;
    this.shaftEl = elements.shaftEl;
    this.knobEl = elements.knobEl;
    this.actionBtnEl = elements.actionBtnEl;
    this.stageEl = elements.stageEl;

    this.onAction = callbacks.onAction || (() => {});
    this.onCancel = callbacks.onCancel || (() => {});
    this.onFirstGesture = callbacks.onFirstGesture || (() => {});

    this._pointerId = null;
    this._originX = 0;
    this._originY = 0;
    this._joyX = 0;
    this._joyY = 0;
    this._keys = { left: false, right: false };
    this._lastModality = 'joystick';
    this._enabled = true;
    this._cleanups = [];

    this._bind();
  }

  get lastModality() { return this._lastModality; }

  getHorizontalInput() {
    if (!this._enabled) return 0;
    const k = (this._keys.right ? 1 : 0) - (this._keys.left ? 1 : 0);
    return k !== 0 ? k : this._joyX;
  }

  setEnabled(flag) {
    this._enabled = Boolean(flag);
    if (!this._enabled) {
      this._resetJoy();
      this._keys.left = false;
      this._keys.right = false;
    }
  }

  _on(target, type, fn, opts) {
    if (!target) return;
    target.addEventListener(type, fn, opts);
    this._cleanups.push(() => target.removeEventListener(type, fn, opts));
  }

  _bind() {
    this._on(this.joystickEl, 'pointerdown', (e) => {
      if (!this._enabled) return;
      e.preventDefault();
      this.onFirstGesture();
      this._pointerId = e.pointerId;
      this._lastModality = e.pointerType === 'touch' ? 'touch' : 'joystick';
      const rect = this.joystickEl.getBoundingClientRect();
      this._originX = rect.left + rect.width / 2;
      this._originY = rect.top + rect.height / 2;
      try { this.joystickEl.setPointerCapture(e.pointerId); } catch (_err) {}
      this._updateJoy(e.clientX, e.clientY);
    });

    this._on(this.joystickEl, 'pointermove', (e) => {
      if (this._pointerId !== e.pointerId || !this._enabled) return;
      e.preventDefault();
      this._updateJoy(e.clientX, e.clientY);
    });

    const endJoy = (e) => {
      if (this._pointerId !== e.pointerId) return;
      this._pointerId = null;
      this._resetJoy();
    };
    this._on(this.joystickEl, 'pointerup', endJoy);
    this._on(this.joystickEl, 'pointercancel', endJoy);

    let stagePid = null;
    let stageStartX = 0;
    this._on(this.stageEl, 'pointerdown', (e) => {
      if (!this._enabled) return;
      this.onFirstGesture();
      stagePid = e.pointerId;
      stageStartX = e.clientX;
      this._lastModality = e.pointerType === 'touch' ? 'touch' : 'joystick';
    });
    this._on(this.stageEl, 'pointermove', (e) => {
      if (stagePid !== e.pointerId || !this._enabled) return;
      const dx = e.clientX - stageStartX;
      this._joyX = Math.max(-1, Math.min(1, dx / 42));
      this._renderJoy(this._joyX, 0);
    });
    const endStage = (e) => {
      if (stagePid !== e.pointerId) return;
      stagePid = null;
      this._resetJoy();
    };
    this._on(this.stageEl, 'pointerup', endStage);
    this._on(this.stageEl, 'pointercancel', endStage);

    this._on(this.actionBtnEl, 'pointerdown', () => this.onFirstGesture());
    this._on(this.actionBtnEl, 'click', () => {
      if (!this._enabled) return;
      this.onFirstGesture();
      this.onAction();
    });

    this._on(window, 'keydown', (e) => {
      if (!this._enabled) return;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        this.onFirstGesture();
        this._keys.left = true;
        this._lastModality = 'keyboard';
        this._renderJoy(-0.85, 0);
      } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        this.onFirstGesture();
        this._keys.right = true;
        this._lastModality = 'keyboard';
        this._renderJoy(0.85, 0);
      } else if (e.code === 'Space') {
        if (document.activeElement && document.activeElement.dataset && document.activeElement.dataset.tbSecondary === 'true') {
          return;
        }
        e.preventDefault();
        this.onFirstGesture();
        this._lastModality = 'keyboard';
        this._pressBtnVisual();
        this.onAction();
      } else if (e.key === 'Escape') {
        this.onCancel();
      }
    });

    this._on(window, 'keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        this._keys.left = false;
        this._renderJoy(this._keys.right ? 0.85 : 0, 0);
      } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        this._keys.right = false;
        this._renderJoy(this._keys.left ? -0.85 : 0, 0);
      }
    });
  }

  _updateJoy(cx, cy) {
    const r = 24;
    const dx = cx - this._originX;
    const dy = cy - this._originY;
    const d = Math.hypot(dx, dy);
    const cd = Math.min(r, d);
    const a = Math.atan2(dy, dx);
    this._joyX = d > 1 ? (Math.cos(a) * cd) / r : 0;
    this._joyY = d > 1 ? (Math.sin(a) * cd) / r : 0;
    this._renderJoy(this._joyX, this._joyY);
  }

  _resetJoy() {
    this._joyX = 0;
    this._joyY = 0;
    this._renderJoy(0, 0);
  }

  _renderJoy(nx, ny) {
    if (!this.knobEl || !this.shaftEl) return;
    this.knobEl.style.transform = `translate3d(${(nx * 13).toFixed(1)}px, ${(ny * 7).toFixed(1)}px, 0)`;
    this.shaftEl.style.transform = `translateX(-50%) rotate(${(nx * 24).toFixed(1)}deg)`;
  }

  _pressBtnVisual() {
    if (!this.actionBtnEl) return;
    this.actionBtnEl.classList.add('is-pressed');
    setTimeout(() => { if (this.actionBtnEl) this.actionBtnEl.classList.remove('is-pressed'); }, 150);
  }

  destroy() {
    this._cleanups.forEach((fn) => fn());
    this._cleanups.length = 0;
  }
}

  if (container) container.appendChild(root);

  function applyThemeVars(themeId) {
    const t = TOYBOX_THEMES[themeId] || TOYBOX_THEMES.porcelain;

    root.style.setProperty('--tb-backdrop', t.backdrop);

    if (toastTimer) clearTimeout(toastTimer);

    toastTimer = setTimeout(() => els.toast.classList.remove('is-visible'), ms);

  function setStatusVeil(mode, title = '', sub = '') {
    if (!mode) {
      els.statusVeil.classList.remove('is-visible');
      els.statusVeil.innerHTML = '';

    if (mode === 'verifying') {
      els.statusVeil.innerHTML = `<div class="haiz-tb-spinner"></div><strong style="font-size:14px">${title}</strong><span style="font-size:12px;opacity:.75">${sub}</span>`;

    const step = fsm.getStepIndex();
    const isSuccess = fsm.state === VerificationState.SUCCESS;
    els.steps.forEach((el) => {
      const idx = Number(el.dataset.step);
      el.classList.toggle('is-active', !isSuccess && idx === step);
      el.classList.toggle('is-done', isSuccess || idx < step);
    });
    const busy = [
      VerificationState.WAKING,
      VerificationState.DESCENDING,
      VerificationState.GRASPING,
      VerificationState.LIFTING,
      VerificationState.DROPPING,
      VerificationState.CELEBRATING,
      VerificationState.VERIFYING,
      VerificationState.SUCCESS
    ].includes(fsm.state);
    els.actionBtn.disabled = busy;
    els.actionBtn.textContent = fsm.state === VerificationState.CARRYING ? '投放' : '抓取';
  }

  function renderPrompt() {
    if (!activeChallenge) {
      els.prompt.textContent = '正在唤醒抓娃娃机…';
      return;
    }
    const meta = getCharacterMeta(activeChallenge.targetCharacterId);
    const color = meta ? meta.accentHex : '#D4573F';
    const name = meta ? meta.nameZh : activeChallenge.targetNameZh || activeChallenge.targetCharacterId;
    els.prompt.innerHTML = `<span class="haiz-tb-swatch" style="background:${color}"></span><span>请带走那只「${name}」</span>`;
  }

  function buildA11yGrid() {
    els.a11yGrid.innerHTML = '';
    CHARACTER_REGISTRY.forEach((c) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'haiz-tb-a11y-btn';
      btn.innerHTML = `<span class="haiz-tb-swatch" style="background:${c.accentHex}"></span><span>${c.nameZh}</span>`;
      btn.addEventListener('click', () => {
        if (fsm.state !== VerificationState.SEEKING) return;
        sound.unlock();
        sound.playButtonClick();
        attemptIndex += 1;
        submitVerification(c.id, 'accessible');
      });
      els.a11yGrid.appendChild(btn);
    });
  }

  function toggleAccessible(force) {
    accessibleMode = typeof force === 'boolean' ? force : !accessibleMode;
    els.a11yBtn.classList.toggle('is-active', accessibleMode);
    els.a11yPanel.classList.toggle('is-visible', accessibleMode);
    els.vitrine.style.display = accessibleMode ? 'none' : '';
    els.deck.style.display = accessibleMode ? 'none' : '';
    els.a11yLink.textContent = accessibleMode ? '返回抓娃娃机' : '键盘辅助入口';
    if (accessibleMode) {
      buildA11yGrid();
      if (scene) scene.pause();
    } else if (scene && fsm.state !== VerificationState.CLOSED) {
      scene.resume();
      scene.resize();
    }
  }

  function ensureScene() {
    if (scene) return true;
    try {
      scene = new ToyboxMachineScene(els.canvas, {
        theme: currentTheme,
        reducedMotion,
        preserveDrawingBuffer: opts.preserveDrawingBuffer,
        onFrame: handleFrame
      });
      if (typeof ResizeObserver !== 'undefined') {
        resizeObserver = new ResizeObserver(() => { if (scene) scene.resize(); });
        resizeObserver.observe(els.vitrine);
      }
      return true;
    } catch (_err) {
      toggleAccessible(true);
      return false;
    }
  }

  function handleFrame(dt) {
    if (!scene) return;
    const allowMove = fsm.state === VerificationState.SEEKING || fsm.state === VerificationState.CARRYING;
    const inputX = controls ? controls.getHorizontalInput() : 0;
    const hasPayload = Boolean(scene.carriedEntry);
    const { speedRatio } = scene.kinematics.step(dt, inputX, allowMove, hasPayload);
    if (allowMove && speedRatio > 0.08) sound.updateServo(speedRatio);
    else sound.stopServo();

    const overChute = hasPayload && scene.kinematics.isOverPrizeChute();
    scene.setChuteHighlighted(overChute);
    els.chutePill.classList.toggle('is-ready', overChute);
    els.chuteDoor.classList.toggle('is-ready', overChute);
    if (fsm.state === VerificationState.CARRYING) {
      els.chuteDoorLabel.textContent = overChute ? '准备投放 · 按下松开' : '左移至出口投放';
    }
  }

  function clearTimers() { if (phaseTimer) { clearTimeout(phaseTimer); phaseTimer = null; } }
  function abortInFlight() { if (abortCtrl) { try { abortCtrl.abort(); } catch (_e) {} abortCtrl = null; } }

  function onAction() {
    if (fsm.state === VerificationState.SEEKING) startGrab();
    else if (fsm.state === VerificationState.CARRYING) startDrop();
  }

  function startGrab() {
    if (!scene || !fsm.transition(VerificationState.DESCENDING)) return;
    attemptIndex += 1;
    sound.playButtonClick();
    sound.playDescent();
    syncUI();

    scene.kinematics.targetProngOpen = 0.94;
    scene.kinematics.targetClawY = SHOWCASE_BOUNDS.grabMinY;

    clearTimers();
    phaseTimer = setTimeout(() => {
      if (isDestroyed || fsm.state !== VerificationState.DESCENDING) return;
      fsm.transition(VerificationState.GRASPING);
      const caught = scene.findCatchableCharacter();
      scene.kinematics.targetProngOpen = caught ? 0.14 : 0.04;

      phaseTimer = setTimeout(() => {
        if (isDestroyed || fsm.state !== VerificationState.GRASPING) return;
        fsm.transition(VerificationState.LIFTING);
        sound.playGrab(Boolean(caught));
        if (caught) scene.attachToClaw(caught);
        scene.kinematics.targetClawY = SHOWCASE_BOUNDS.restClawY;

        phaseTimer = setTimeout(() => {
          if (isDestroyed || fsm.state !== VerificationState.LIFTING) return;
          if (caught) {
            fsm.transition(VerificationState.CARRYING);
            syncUI();
            showToast(`抓起「${caught.meta.nameZh}」，左移至奖品出口投放`);
          } else {
            fsm.transition(VerificationState.RETRY_HINT);
            scene.kinematics.targetProngOpen = 0.30;
            sound.playSoftRetry();
            showToast('差一点点，再往玩偶上方移移看');
            phaseTimer = setTimeout(() => {
              if (isDestroyed || fsm.state !== VerificationState.RETRY_HINT) return;
              fsm.transition(VerificationState.SEEKING);
              syncUI();
            }, 480);
          }
        }, 500);
      }, 220);
    }, 480);
  }

  function startDrop() {
    if (!scene || !scene.carriedEntry) return;
    sound.playButtonClick();
    if (!scene.kinematics.isOverPrizeChute()) {
      showToast('请先向左移动至左侧「奖品出口」上方再松开');
      scene.kinematics.impulseSwing(0.22);
      return;
    }
    if (!fsm.transition(VerificationState.DROPPING)) return;
    syncUI();
    scene.kinematics.targetProngOpen = 0.94;
    sound.playDrop();
    const dropped = scene.releaseCarried(true);

    clearTimers();
    phaseTimer = setTimeout(() => {
      if (isDestroyed || fsm.state !== VerificationState.DROPPING) return;
      scene.kinematics.targetProngOpen = 0.30;
      if (!dropped) {
        fsm.transition(VerificationState.SEEKING);
        syncUI();
        return;
      }

      if (activeChallenge && dropped.id !== activeChallenge.targetCharacterId) {
        fsm.transition(VerificationState.RETRY_HINT);
        sound.playSoftRetry();
        const target = getCharacterMeta(activeChallenge.targetCharacterId);
        showToast(`这只是「${dropped.meta.nameZh}」，我们要找的是「${target ? target.nameZh : ''}」`, 2500);
        scene.returnToPile(dropped);
        els.chuteDoor.classList.remove('is-ready');
        els.chuteDoorLabel.textContent = '奖品出口';
        phaseTimer = setTimeout(() => {
          if (isDestroyed || fsm.state !== VerificationState.RETRY_HINT) return;
          fsm.transition(VerificationState.SEEKING);
          syncUI();
        }, 680);
        return;
      }

      els.chuteDoor.classList.add('is-collected');
      els.chuteDoorLabel.textContent = '已收取';
      submitVerification(dropped.id, controls ? controls.lastModality : 'joystick');
    }, 430);
  }

  async function submitVerification(selectedCharacterId, modality) {
    if (!activeChallenge) return;
    const mySession = sessionSeq;
    const meta = getCharacterMeta(selectedCharacterId);

    if (scene && !accessibleMode) {
      scene.startPopUpCelebration(selectedCharacterId);
      sound.playPopUpCelebration();
    }

    if (!fsm.transition(VerificationState.VERIFYING)) return;
    syncUI();

    els.welcomeKicker.textContent = '正在等待服务端签发凭证…';
    els.welcomeTitle.textContent = '抓到啦！';
    els.welcomeSub.textContent = meta ? meta.welcomeLineZh : '正在确认真人验证结果…';
    els.welcomeCard.classList.add('is-visible');

    abortInFlight();
    abortCtrl = new AbortController();

    try {
      const result = await challengeProvider.verifyChallenge(
        {
          challengeId: activeChallenge.challengeId,
          nonce: activeChallenge.nonce,
          selectedCharacterId,
          inputModality: modality,
          elapsedMs: Date.now() - challengeStartMs,
          attemptIndex
        },
        abortCtrl.signal
      );

      if (isDestroyed || mySession !== sessionSeq || fsm.state === VerificationState.CLOSED) return;

      if (result && result.verified === true && result.verificationToken) {
        fsm.transition(VerificationState.SUCCESS);
        syncUI();
        els.welcomeKicker.textContent = result.isMock ? 'HAIZ · MOCK DEMO VERIFIED' : 'HAIZ · VERIFIED';
        els.welcomeTitle.textContent = '欢迎来到 HAIZ';
        els.welcomeSub.textContent = meta ? meta.welcomeLineZh : '服务端验证已通过。';
        els.welcomeCard.classList.add('is-visible');
        if (typeof opts.onSuccess === 'function') {
          setTimeout(() => {
            if (!isDestroyed && mySession === sessionSeq && fsm.state === VerificationState.SUCCESS) {
              opts.onSuccess(result);
            }
          }, 1150);
        }
      } else {
        els.welcomeCard.classList.remove('is-visible');
        sound.playSoftRetry();
        const msg = (result && result.message) || '服务端验证未通过，请重试。';
        fsm.transition(VerificationState.ERROR);
        setStatusVeil('error', '服务端验证未通过', msg);
        if (typeof opts.onFailure === 'function') opts.onFailure(result || { code: 'REJECTED', message: msg });
      }
    } catch (err) {
      if (err && err.name === 'AbortError') return;
      if (isDestroyed || mySession !== sessionSeq) return;
      els.welcomeCard.classList.remove('is-visible');
      fsm.transition(VerificationState.ERROR);
      setStatusVeil('error', '验证连接中断', '未能连接到验证服务，请重试。');
      if (typeof opts.onFailure === 'function') opts.onFailure({ code: 'NETWORK_ERROR', message: String(err) });
    }
  }

  async function startSession() {
    sessionSeq += 1;
    const mySession = sessionSeq;
    clearTimers();
    abortInFlight();
    setStatusVeil(null);
    els.welcomeCard.classList.remove('is-visible');
    els.chuteDoor.classList.remove('is-ready', 'is-collected');
    els.chuteDoorLabel.textContent = '奖品出口';
    els.chutePill.classList.remove('is-ready');
    attemptIndex = 0;

    fsm.forceReset(VerificationState.WAKING);
    syncUI();
    els.prompt.textContent = '正在唤醒抓娃娃机…';

    if (!accessibleMode) {
      const ok = ensureScene();
      if (ok && scene) {
        scene.triggerWakeAnimation();
        scene.resume();
        scene.resize();
      }
    }

    abortCtrl = new AbortController();
    try {
      const chl = await challengeProvider.fetchChallenge(abortCtrl.signal);
      if (isDestroyed || mySession !== sessionSeq || fsm.state === VerificationState.CLOSED) return;
      activeChallenge = chl;
      challengeStartMs = Date.now();
      if (scene && Array.isArray(chl.layoutOrder)) {
        scene.applyLayout(chl.layoutOrder);
      }
      renderPrompt();
      sound.playWake();

      phaseTimer = setTimeout(() => {
        if (isDestroyed || mySession !== sessionSeq || fsm.state !== VerificationState.WAKING) return;
        fsm.transition(VerificationState.SEEKING);
        syncUI();
      }, reducedMotion ? 60 : 420);
    } catch (err) {
      if (err && err.name === 'AbortError') return;
      if (isDestroyed || mySession !== sessionSeq) return;
      fsm.transition(VerificationState.ERROR);
      setStatusVeil('error', '无法获取挑战', err.message || '请稍后重试');
      if (typeof opts.onFailure === 'function') opts.onFailure({ code: 'FETCH_ERROR', message: String(err) });
    }
  }

  controls = new ConsoleController(
    {
      joystickEl: els.joystick,
      shaftEl: els.shaft,
      knobEl: els.knob,
      actionBtnEl: els.actionBtn,
      stageEl: els.vitrine
    },
    {
      onFirstGesture: () => sound.unlock(),
      onAction,
      onCancel: () => api.close(true)
    }
  );
  controls.setEnabled(false);

  els.soundBtn.addEventListener('click', () => {
    sound.setEnabled(!sound.enabled);
    if (sound.enabled) sound.unlock();
    updateSoundBtn();
  });
  els.a11yBtn.addEventListener('click', () => toggleAccessible());
  els.a11yLink.addEventListener('click', () => toggleAccessible());
  els.closeBtn.addEventListener('click', () => api.close(true));
  els.backdrop.addEventListener('click', () => { if (opts.closeOnBackdrop) api.close(true); });

  const onVis = () => {
    if (!scene || isDestroyed) return;
    if (document.hidden) {
      scene.pause();
      sound.stopServo();
    } else if (fsm.state !== VerificationState.CLOSED && !accessibleMode) {
      scene.resume();
    }
  };
  document.addEventListener('visibilitychange', onVis);

  applyThemeVars(currentTheme);
  updateSoundBtn();

  const api = {
    open() {
      if (isDestroyed) return;
      root.classList.add('is-open');
      controls.setEnabled(true);
      startSession();
    },
    reset() {
      if (isDestroyed) return;
      if (!root.classList.contains('is-open')) { this.open(); return; }
      startSession();
    },
    close(notifyCancel = false) {
      if (isDestroyed) return;
      clearTimers();
      abortInFlight();
      root.classList.remove('is-open');
      controls.setEnabled(false);
      sound.stopServo();
      if (scene) scene.pause();
      const wasActive = fsm.state !== VerificationState.CLOSED && fsm.state !== VerificationState.SUCCESS;
      fsm.forceReset(VerificationState.CLOSED);
      if (notifyCancel && wasActive && typeof opts.onCancel === 'function') opts.onCancel();
    },
    setTheme(themeId) { if (TOYBOX_THEMES[themeId]) applyThemeVars(themeId); },
    setReducedMotion(flag) { reducedMotion = Boolean(flag); if (scene) scene.setReducedMotion(reducedMotion); },
    getState() {
      return {
        state: fsm.state,
        theme: currentTheme,
        accessibleMode,
        challengeId: activeChallenge ? activeChallenge.challengeId : null,
        targetCharacterId: activeChallenge ? activeChallenge.targetCharacterId : null
      };
    },
    _getScene() { return scene; },
    _forceShowcaseCelebration(charId) {
      if (!scene) return;
      const id = charId || (activeChallenge && activeChallenge.targetCharacterId) || 'lanren-spirit';
      const meta = getCharacterMeta(id);
      scene.startPopUpCelebration(id);
      els.chuteDoor.classList.add('is-collected');
      els.chuteDoorLabel.textContent = '已收取';
      els.welcomeKicker.textContent = 'HAIZ · VERIFIED';
      els.welcomeTitle.textContent = '欢迎来到 HAIZ';
      els.welcomeSub.textContent = meta ? meta.welcomeLineZh : '欢迎来到 HAIZ。';
      els.welcomeCard.classList.add('is-visible');
      fsm.forceReset(VerificationState.SUCCESS);
      syncUI();
    },
    destroy() {
      if (isDestroyed) return;
      isDestroyed = true;
      clearTimers();
      abortInFlight();
      if (toastTimer) clearTimeout(toastTimer);
      document.removeEventListener('visibilitychange', onVis);
      if (resizeObserver) resizeObserver.disconnect();
      if (controls) controls.destroy();
      if (scene) scene.destroy();
      sound.destroy();
      if (root.parentNode) root.parentNode.removeChild(root);
    }
  };

  return api;
}
    window.addEventListener('load', function () {
      var currentTheme = 'porcelain';
      var adapter = new MockToyboxAdapter({ latencyMs: 420 });
      var statusBox = document.getElementById('statusBox');
      var openBtn = document.getElementById('openMachineBtn');
      var verification = createHumanVerification({
        container: document.body, theme: currentTheme, challengeProvider: adapter,
        onSuccess: function (res) { statusBox.innerHTML = '<strong>验证通过 · ' + res.message + '</strong>Mock Token: <code>' + res.verificationToken + '</code>'; openBtn.textContent = '再玩一次'; },
        onFailure: function (err) { statusBox.innerHTML = '<strong>服务端未通过</strong>' + (err.message || err.code); },
        onCancel: function () { statusBox.innerHTML = '<strong>已关闭验证</strong>可随时点击上方按钮再次唤醒。'; }
      });
      openBtn.addEventListener('click', function () { verification.open(); });
      var studio = null;
      var charGrid = document.getElementById('charGrid');
      function renderMeta(meta) {
        document.getElementById('metaName').textContent = meta.nameZh + ' · ' + meta.nameEn;
        document.getElementById('metaRole').textContent = meta.roleZh + ' · 性格：' + meta.personalityZh;
        document.getElementById('metaStory').textContent = meta.storyZh;
      }
      function ensureStudio() {
        if (studio) { studio.resize(); return; }
        studio = new CharacterStudioScene(document.getElementById('studioCanvas'), { characterId: 'lanren-spirit', theme: currentTheme, autoRotate: true });
        studio.start();
        CHARACTER_REGISTRY.forEach(function (c, i) {
          var b = document.createElement('button');
          b.type = 'button'; b.className = 'char-btn' + (i === 0 ? ' is-active' : '');
          b.innerHTML = '<span class="dot" style="background:' + c.accentHex + '"></span><span>' + c.nameZh + '</span>';
          b.addEventListener('click', function () {
            renderMeta(studio.setCharacter(c.id));
            charGrid.querySelectorAll('.char-btn').forEach(function (x) { x.classList.toggle('is-active', x === b); });
          });
          charGrid.appendChild(b);
        });
        renderMeta(studio.currentCharacter.meta);
      }
      document.querySelectorAll('[data-anim]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (!studio) return;
          studio.setAnimationMode(btn.dataset.anim);
          document.querySelectorAll('[data-anim]').forEach(function (x) { x.classList.toggle('is-active', x === btn); });
        });
      });
      document.getElementById('exportGlbBtn').addEventListener('click', function () {
        if (!studio) return;
        var glb = studio.exportCurrentGLB(); if (!glb) return;
        var blob = new Blob([glb], { type: 'model/gltf-binary' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a'); a.href = url; a.download = 'haiz-toybox-' + studio.currentCharacter.id + '.glb'; a.click();
        setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
      });
      document.querySelectorAll('[data-mode]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var mode = btn.dataset.mode;
          document.querySelectorAll('[data-mode]').forEach(function (x) { x.classList.toggle('is-active', x === btn); });
          document.getElementById('machineView').classList.toggle('is-active', mode === 'machine');
          document.getElementById('studioView').classList.toggle('is-active', mode === 'studio');
          if (mode === 'studio') { verification.close(false); ensureStudio(); } else { verification.open(); }
        });
      });
      document.querySelectorAll('[data-theme]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          currentTheme = btn.dataset.theme;
          document.body.dataset.hostTheme = currentTheme;
          document.querySelectorAll('[data-theme]').forEach(function (x) { x.classList.toggle('is-active', x === btn); });
          verification.setTheme(currentTheme);
          if (studio) studio.applyTheme(currentTheme);
        });
      });
      window.addEventListener('resize', function () { if (studio) studio.resize(); });
      setTimeout(function () { verification.open(); }, 200);
    });
  })();
  </script>
</body>
</html>
