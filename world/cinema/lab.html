<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAIZ Motion Lab</title><style>body{margin:0;font:16px system-ui;background:#f3f1ec;color:#242a38}main{max-width:1050px;margin:40px auto;padding:24px;display:grid;grid-template-columns:1fr 300px;gap:30px}svg{width:100%;height:65vh;border-radius:24px}button,select,input{font:inherit;min-height:44px}label{display:block;margin:20px 0}p{line-height:1.8}@media(max-width:650px){main{grid-template-columns:1fr}svg{height:55vh}}</style><main><div><svg viewBox="0 360 1000 1000" id="stage" role="img" aria-label="HAIZ字形到书页和窗框的连续路径形变"></svg></div><section><h1>Motion Lab</h1><p>同一组十个字形构件，依次拆解、弯折为书页、接续为窗框。拖动时间轴可以检查中间形态。</p><label>主题 <select id="theme"><option value="porcelain">Porcelain</option><option value="obsidian">Obsidian</option><option value="ocean">Ocean</option></select></label><label>时间 <input id="time" type="range" min="0" max="72" step="0.1" value="0"></label><button id="play">播放 / 暂停</button><p id="status" aria-live="polite"></p><a href="../index.html#study">返回书桌</a></section></main><script type="module">import{identityFrame}from './identity.js';const $=s=>document.querySelector(s);let f=0,playing=false,last=0;function paint(){const s=identityFrame(f,$('#theme').value);$('#stage').style.background=s.palette.base;$('#stage').innerHTML=s.pieces.map(p=>`<path data-piece="${p.id}" d="${p.d}" fill="${p.fill}"/>`).join('');$('#time').value=f;$('#status').textContent=s.label+' · '+f.toFixed(1)+' / 72帧';}function tick(t){if(playing){f=(f+Math.min((t-last)/1000,.05)*30)%73;paint();}last=t;requestAnimationFrame(tick)}$('#play').onclick=()=>playing=!playing;$('#time').oninput=e=>{playing=false;f=Number(e.target.value);paint()};$('#theme').onchange=paint;paint();requestAnimationFrame(tick);</script></html>
