<body><div id="app" data-theme="porcelain"><div class="shell">
<header class="topbar"><div class="brand">HAIZ<span class="period">.</span><small id="brandSub">DIGITAL CAMPUS</small></div><div class="top-actions"><button class="mini-action" id="filmBtn" aria-label="播放 HAIZ 品牌动效" title="播放品牌动效"><svg class="icon" viewBox="0 0 24 24"><path d="m9 6 10 6-10 6z"/></svg></button><button class="mini-action profile" id="profileBtn" aria-label="打开设置">我的</button></div></header>
<main class="surface" id="scroller"><div class="stage" id="stage"></div></main>
<div class="dock-area" id="dockArea"><nav class="dock" id="dock" aria-label="主导航"><div class="dock-lens" id="lens"></div></nav><button class="searchorb" id="openSearch" aria-label="打开搜索"><svg class="icon" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.5"/><path d="m16 16 5 5"/></svg></button></div>

</div></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), root=$('#app'),stage=$('#stage'),scroller=$('#scroller'),dock=$('#dock'),lens=$('#lens'),dockArea=$('#dockArea'),overlay=$('#filmOverlay');
const icons={today:'<path d="M4 10.5 12 4l8 6.5v9H4zM9 19.5v-6h6v6"/>',desk:'<path d="M4 8h16M6 8v12M18 8v12M3 20h18M8 4h8v4"/>',campus:'<path d="m3 7 6-3 6 3 6-3v14l-6 3-6-3-6 3zM9 4v14M15 7v14"/>',profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',team:'<circle cx="8" cy="8" r="3"/><circle cx="17" cy="9" r="2"/><path d="M2 21v-2a6 6 0 0 1 12 0v2M14 16a5 5 0 0 1 8 4"/>',notice:'<path d="M5 4h14v16H5zM8 9h8M8 13h8M8 17h5"/>',grid:'<rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',check:'<path d="m5 12 4 4L19 6"/>',pin:'<path d="M12 21s7-6 7-12A7 7 0 0 0 5 9c0 6 7 12 7 12z"/><circle cx="12" cy="9" r="2"/>'};

function showToast(txt){const t=$('#toast');t.textContent=txt;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2500)}
function section(title,side){return `<div class="sectionhead"><h2>${title}</h2><span>${side||''}</span></div>`}
function task(id,title,details){return `<button class="task-row ${done.has(id)?'done':''}" data-task="${id}"><span class="task-check">${done.has(id)?icon('check'):''}</span><span class="task-copy"><span class="taskname">${title}</span><span class="taskdetail">${details}</span></span><span class="status">${done.has(id)?'已完成':'待处理'}</span></button>`}
function daily(){return `<div class="masthead"><div><span class="overline">${dateText} · 演示</span><h1 class="mainheading">今天</h1></div><button class="text-button" data-action="settings">工作空间 ↗</button></div><section class="priority"><span class="gridline"></span><div class="p-top"><span>上次的记录</span><span class="p-num">练习 03</span></div><div class="p-main"><h2>几何光学 · 练习 03</h2><p>上次停在：整理折射条件</p></div><div class="p-bottom"><button class="button-primary" data-action="desk">继续学习 ${icon('arrow')}</button><span class="p-meta">本机演示数据</span></div></section>${section('待处理','可勾选完成')}<div class="row-list">${task('optics','物理 · 练习 03','复核折射条件')}${task('english','英语 · 演讲稿','校对第二部分内容')}${task('math','数学 · 错题整理','记录两道待复习题目')}</div>${section('常用入口','')}<div class="two-up"><button class="f-card" data-action="desk"><span class="icon-circle">${icon('desk')}</span><b>专注计时</b><span>25 分钟 · 可暂停</span></button><button class="f-card" data-action="campus"><span class="icon-circle">${icon('campus')}</span><b>校园资料</b><span>地点与公开信息</span></button></div><div class="info-strip"><span class="status-dot"></span>课表未连接。以上任务为本地演示数据。</div>`}
function focus(){return `<div class="focus-upper"><div class="overline">本机学习记录</div><h1>书桌</h1><p>继续「几何光学 · 练习 03」</p></div><section class="focus-board"><span class="fineline">专注计时 / ${Math.floor(duration/60)} MIN</span><div class="dial" id="dial"><div class="dial-content"><strong id="timerText">25:00</strong><span id="timerStatus">准备开始</span></div></div><div class="focus-controls"><button data-action="timerToggle" id="timerButton">开始专注</button><button class="secondary-btn" data-action="timerReset">重置</button></div><div class="duration">${[15,25,45].map(m=>`<button data-duration="${m}" class="${duration===m*60?'on':''}">${m} 分钟</button>`).join('')}</div></section>${section('留下思路','仅保存在本机')}<section class="note-card"><textarea id="noteField" maxlength="1800" placeholder="记下已经理解的内容，以及下一步准备做什么">${escapeHtml(note)}</textarea><div class="note-actions"><span id="noteStatus">本机草稿</span><button class="small-save" data-action="saveNote">保存记录</button></div></section>${section('上次的学习记录','')}<div class="row-list"><div class="actionrow"><div><strong>几何光学</strong><p>下一步：整理折射条件</p></div><button data-action="desk">查看</button></div></div>`}
const mapDrawing=`<svg viewBox="0 0 200 160" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><pattern id="gridMap" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" stroke="#b8d9df" stroke-opacity=".12" fill="none"/></pattern></defs><rect width="200" height="160" fill="url(#gridMap)"/><path d="M-12 44 L59 44 85 61 210 61M48 -6V56L85 92V180M-20 127L65 127 106 98 230 98" fill="none" stroke="#a4becc" stroke-width="6" stroke-opacity=".35"/><path d="M-12 44 L59 44 85 61 210 61M48 -6V56L85 92V180M-20 127L65 127 106 98 230 98" fill="none" stroke="#d9ebef" stroke-width="1.5" stroke-opacity=".7"/><rect x="111" y="18" width="43" height="27" rx="3" stroke="#e3e6d6" fill="#849eab" fill-opacity=".25"/><rect x="14" y="79" width="46" height="27" rx="3" stroke="#e3e6d6" fill="#849eab" fill-opacity=".2"/><rect x="116" y="117" width="60" height="22" rx="3" stroke="#e3e6d6" fill="#849eab" fill-opacity=".2"/><circle cx="91" cy="87" r="16" fill="#dfb989" fill-opacity=".18" stroke="#d6a779"/><circle cx="91" cy="87" r="4" fill="#f7d4a5"/></svg>`;
function campus(){const samples=activeFilter==='places'?[['01','砚池','位置资料与校园介绍'],['02','凤栖堂','查看建筑与历史资料'],['03','陶然亭','地点介绍']]:activeFilter==='clubs'?[['01','社团索引','浏览社团分类'],['02','活动公告','示例内容，未接学校系统']]:[['01','校园新闻','查看公开发布内容'],['02','校内通知','未连接真实通知源']];return `<div class="masthead"><div><span class="overline">海南中学 · 府城校区</span><h1 class="mainheading">校园</h1></div><span class="status">府城校区</span></div><div class="segmentbar">${[['places','地点'],['clubs','社团'],['updates','动态']].map(([k,v])=>`<button data-filter="${k}" aria-pressed="${activeFilter===k}">${v}</button>`).join('')}</div><div class="campus-feature"><div class="campus-visual">${mapDrawing}<span class="watermark">校园索引 · 示意</span></div><div class="feature-copy"><div class="cap">资料索引</div><h3>校园资料索引</h3><p>查找地点、浏览校园故事。示意图不代表真实道路。</p><button data-action="map">查看资料 ${icon('arrow')}</button></div></div>${section(activeFilter==='places'?'地点':activeFilter==='clubs'?'社团':'动态','演示内容')}<div>${samples.map(([n,t,s])=>`<button class="campus-entry" data-place="${t}"><span class="index">${n}</span><span><strong>${t}</strong><p>${s}</p></span>${icon('arrow')}</button>`).join('')}</div><div class="info-strip"><span class="status-dot"></span>内容尚未连接学校正式数据源。</div>`}
function prefs(){return `<div class="masthead"><div><span class="overline">本机设置</span><h1 class="mainheading">设置</h1></div></div>${section('外观','立即生效')}<div class="themechips">${[['porcelain','Porcelain'],['obsidian','Obsidian'],['ocean','Ocean']].map(([v,l])=>`<button data-theme-choice="${v}" aria-pressed="${theme===v}">${l}</button>`).join('')}</div>${section('工作空间','演示切换')}<div class="role-toggle"><button data-role="student" aria-pressed="${role==='student'}">学生</button><button data-role="teacher" aria-pressed="${role==='teacher'}">教师</button></div><div class="prefgroup"><div class="pref"><div><label>品牌动效</label><p>可单独播放；不影响每次打开 App</p></div><button class="small-save" data-action="film">播放</button></div><div class="pref"><div><label>减少动效</label><p>跟随设备系统设置</p></div><span class="status" id="reduceStatus">自动</span></div><div class="pref"><div><label>学习记录</label><p>仅保存在当前浏览器，不会上传</p></div><span class="status">本机</span></div><div class="pref"><div><label>版本</label><p>Editorial 02 · 交互设计原型</p></div><span class="status">Prototype</span></div></div>`}
function teacherHome(){return `<div class="masthead"><div><span class="overline">教师工作空间 · 演示</span><h1 class="mainheading">工作台</h1></div><span class="status">离线演示</span></div><section class="priority"><div class="p-top"><span>今日事务</span><span class="p-num">LOCAL</span></div><div class="p-main"><h2>今日待办</h2><p>作业收取、班级通知、教学资料</p></div><div class="p-bottom"><button class="button-primary" data-action="classroom">查看班级 ${icon('arrow')}</button><span class="p-meta">未连接校方服务</span></div></section>${section('工作概览','虚构演示数据')}<div class="teacher-kpis"><div class="kpi"><span>待确认通知</span><strong>02</strong><em>演示</em></div><div class="kpi"><span>待整理事项</span><strong>03</strong><em>演示</em></div></div>${section('常用操作','')}<div class="row-list"><div class="actionrow"><div><strong>发布班级通知</strong><p>先预览，再选择可见范围</p></div><button data-action="announcements">打开</button></div><div class="actionrow"><div><strong>作业收取</strong><p>统计记录 · 尚未连接扫描设备</p></div><button data-action="classroom">查看</button></div></div>`}
function teacherClass(){return `<div class="masthead"><div><span class="overline">班级工具 · 本机演示</span><h1 class="mainheading">班级</h1></div></div><div class="teacher-kpis"><div class="kpi"><span>课表来源</span><strong style="font-size:22px">未连接</strong><em>ClassIsland 模拟适配器</em></div><div class="kpi"><span>同步状态</span><strong style="font-size:22px">本机</strong><em>仅供原型演示</em></div></div>${section('班级工具','')}<div class="row-list"><div class="actionrow"><div><strong>作业收取统计</strong><p>学号扫描功能处于规划阶段</p></div><button data-action="scan">了解</button></div><div class="actionrow"><div><strong>班级通知</strong><p>发布前检查班级与有效时间</p></div><button data-action="announcements">查看</button></div><div class="actionrow"><div><strong>课堂屏幕</strong><p>需要授权的 Windows 教室设备</p></div><button data-action="screen">说明</button></div></div>`}
function teacherNotice(){return `<div class="masthead"><div><span class="overline">创建通知 · 本机演示</span><h1 class="mainheading">公告</h1></div></div><div class="note-card" style="padding:20px"><div class="overline" style="margin-bottom:12px">本机草稿 · 未发布</div><input id="announcementTitle" maxlength="80" placeholder="公告标题" style="background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:12px;width:100%;color:var(--ink);margin-bottom:10px"><textarea id="announcementBody" placeholder="公告内容（演示）" maxlength="3000"></textarea><div class="note-actions"><span>不发送到真实班级</span><button class="small-save" data-action="previewNotice">预览</button></div></div>${section('发布流程','')}<div class="row-list">${[['01','确认班级和可见范围'],['02','检查正文与有效时间'],['03','审核后发布']].map(([a,b])=>`<div class="actionrow"><strong><span style="color:var(--warm);font-size:11px;margin-right:12px">${a}</span>${b}</strong></div>`).join('')}</div>`}
const screens=()=>role==='teacher'?[teacherHome,teacherClass,teacherNotice,prefs]:[daily,focus,campus,prefs];
function setActive(index,opts={}){
 pageIndex=Math.min(3,Math.max(0,index));
 stage.innerHTML=screens()[pageIndex]();attachPage();
 stage.classList.remove('in');
 if(!opts.initial && !matchMedia('(prefers-reduced-motion: reduce)').matches){void stage.offsetWidth;stage.classList.add('in')}
 scroller.scrollTop=0;dockArea.classList.remove('compact');
 dock.querySelectorAll('button[data-tab]').forEach((b,i)=>b.setAttribute('aria-current',i===pageIndex?'page':'false'));
 target=pageIndex*stepWidth();if(opts.initial){position=target;velocity=0}
}
function setRole(r){role=r==='teacher'?'teacher':'student';save('haiz-editorial-role',role);$('#brandSub').textContent=role==='student'?'DIGITAL CAMPUS':'TEACHER WORKSPACE';renderDock();setActive(0,{initial:true});showToast(role==='student'?'学生工作空间':'教师工作空间 · 演示')}
function setTheme(t){if(!['porcelain','obsidian','ocean'].includes(t))t='porcelain';theme=t;root.dataset.theme=t;save('haiz-editorial-theme',t);document.querySelector('meta[name=theme-color]').content=t==='porcelain'?'#f4f2ee':t==='ocean'?'#0c2029':'#10151e';stage.querySelectorAll('[data-theme-choice]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.themeChoice===t)))}
function attachPage(){stage.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));stage.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{const n=b.dataset.task;if(done.has(n))done.delete(n);else done.add(n);save('haiz-editorial-done',JSON.stringify([...done]));const oldScroll=scroller.scrollTop;stage.innerHTML=screens()[pageIndex]();attachPage();scroller.scrollTop=oldScroll});stage.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{activeFilter=b.dataset.filter;stage.innerHTML=campus();attachPage()});stage.querySelectorAll('[data-duration]').forEach(b=>b.onclick=()=>{if(running){showToast('请先暂停计时');return}duration=Number(b.dataset.duration)*60;left=duration;stage.innerHTML=focus();attachPage()});stage.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>setRole(b.dataset.role));stage.querySelectorAll('[data-theme-choice]').forEach(b=>b.onclick=()=>setTheme(b.dataset.themeChoice));const ta=$('#noteField');if(ta)ta.addEventListener('input',()=>{$('#noteStatus').textContent='尚未保存'});renderTimer();const reduce=$('#reduceStatus');if(reduce)reduce.textContent=matchMedia('(prefers-reduced-motion: reduce)').matches?'已减少':'跟随系统'}
function action(kind){switch(kind){case 'desk':setActive(1);break;case 'campus':setActive(2);break;case 'settings':setActive(3);break;case 'film':playFilm();break;case 'timerToggle':toggleTimer();break;case 'timerReset':running=false;left=duration;renderTimer();break;case 'saveNote':note=$('#noteField').value;save('haiz-editorial-note',note);$('#noteStatus').textContent='已保存在本机';showToast('记录已保存');break;case 'classroom':setActive(1);break;case 'announcements':setActive(2);break;case 'map':showToast('当前为资料索引原型');break;case 'scan':showToast('HAIZ SCAN 尚未接入');break;case 'screen':showToast('需要连接授权的教室设备');break;case 'previewNotice':{const title=$('#announcementTitle').value.trim(),text=$('#announcementBody').value.trim();if(!title||!text){showToast('请填写标题和正文');return}showToast('预览完成 · 未发布');break}default:showToast('演示功能，尚未连接数据源')}}
function toggleTimer(){if(running){left=Math.max(0,(endAt-performance.now())/1000);running=false}else{endAt=performance.now()+left*1000;running=true}renderTimer()}
function renderTimer(){if(running){left=Math.max(0,(endAt-performance.now())/1000);if(left===0){running=false;showToast('计时结束')}}const text=$('#timerText'),stat=$('#timerStatus'),dial=$('#dial'),btn=$('#timerButton');if(text)text.textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(Math.floor(left%60)).padStart(2,'0')}`;if(stat)stat.textContent=running?'专注中':left===duration?'准备开始':'已暂停';if(dial)dial.style.setProperty('--progress',`${(1-left/duration)*100}%`);if(btn)btn.textContent=running?'暂停':'开始专注'}interval=setInterval(()=>{if(running)renderTimer()},200);
function renderDock(){dock.querySelectorAll('button[data-tab]').forEach(b=>b.remove());pages().forEach(([text,key],i)=>{const b=document.createElement('button');b.dataset.tab=String(i);b.innerHTML=icon(key)+`<span>${text}</span>`;b.setAttribute('aria-label',text);b.onclick=()=>{if(!pointerDown&&!dragging&&performance.now()>suppressClickUntil)setActive(i)};dock.appendChild(b)})}
function stepWidth(){return (dock.getBoundingClientRect().width-10)/4}
function animateLens(now){const dt=Math.min(.033,(now-lastFrame)/1000);lastFrame=now;const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;if(reduced){position=target;velocity=0}else{const stiffness=450,friction=39;velocity+=(target-position)*stiffness*dt;velocity*=Math.exp(-friction*dt);position+=velocity*dt;if(Math.abs(velocity)<.08&&Math.abs(target-position)<.1){position=target;velocity=0}}const distortion=1+Math.min(.085,Math.abs(velocity)/2000);lens.style.transform=`translate3d(${position.toFixed(2)}px,0,0) scaleX(${distortion.toFixed(4)})`;requestAnimationFrame(animateLens)}
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));function dragTarget(x){const r=dock.getBoundingClientRect();return clamp(x-r.left-5-stepWidth()/2,0,stepWidth()*3)}
dock.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;pointerDown=true;dragging=false;downX=lastDragX=e.clientX;lastDragTime=performance.now();releaseVelocity=0,suppressClickUntil=0;dock.setPointerCapture(e.pointerId)});
dock.addEventListener('pointermove',e=>{if(!pointerDown)return;const delta=e.clientX-downX;if(Math.abs(delta)>6)dragging=true;if(dragging){const now=performance.now(),elapsed=Math.max(8,now-lastDragTime);releaseVelocity=(e.clientX-lastDragX)/elapsed;lastDragX=e.clientX;lastDragTime=now;target=dragTarget(e.clientX)}});
dock.addEventListener('pointerup',e=>{if(!pointerDown)return;pointerDown=false;if(dragging){suppressClickUntil=performance.now()+200;const projected=dragTarget(e.clientX)+clamp(releaseVelocity*55,-45,45);dragging=false;setActive(Math.round(projected/stepWidth()))}else{setActive(Math.round(dragTarget(e.clientX)/stepWidth()))}});
dock.addEventListener('pointercancel',()=>{pointerDown=false;dragging=false;target=pageIndex*stepWidth()});
let previousY=0;scroller.addEventListener('scroll',()=>{const y=scroller.scrollTop;if(y<32||previousY>y+7)dockArea.classList.remove('compact');else if(y>125&&y>previousY+8)dockArea.classList.add('compact');previousY=y},{passive:true});
const dim=$('#dim'),searchSheet=$('#searchSheet');function openSearch(){dim.classList.add('open');searchSheet.classList.add('open');$('#searchInput').focus()}function closeSearch(){dim.classList.remove('open');searchSheet.classList.remove('open')}$('#openSearch').onclick=openSearch;$('#closeSearch').onclick=closeSearch;dim.onclick=closeSearch;
const resources=['几何光学','英语演讲稿','数学错题','校园地图','砚池','凤栖堂','陶然亭','社团索引','发布通知','学习记录'];$('#searchInput').oninput=e=>{const val=e.target.value.trim(),items=resources.filter(x=>x.includes(val));$('#searchResults').textContent=val?(items.length?items.join(' · '):'没有匹配的演示内容'):'输入关键词，查看演示内容。'};
const filmFrame=$('#filmIframe');function stopFilm(){clearTimeout(filmTimer);overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');filmFrame.src='about:blank'}
function playFilm(){if(matchMedia('(prefers-reduced-motion:reduce)').matches){showToast('已减少动效');return}stopFilm();filmTarget=role==='student'?1:0;overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');filmFrame.src='./archive/identity-01.html';filmFrame.onload=()=>{try{filmFrame.contentWindow.__haiz.playFilm()}catch{showToast('品牌片无法加载');stopFilm()}};filmTimer=setTimeout(()=>{stopFilm();setActive(filmTarget)},3950)}$('#filmBtn').onclick=playFilm;$('#filmSkip').onclick=()=>{stopFilm();setActive(filmTarget)};
$('#profileBtn').onclick=()=>setActive(3);window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(overlay.classList.contains('open'))stopFilm();closeSearch()}if(e.altKey&&['1','2','3','4'].includes(e.key))setActive(Number(e.key)-1)});
window.addEventListener('resize',()=>{target=position=pageIndex*stepWidth();velocity=0});
function escapeHtml(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
renderDock();setTheme(theme);setActive(0,{initial:true});$('#brandSub').textContent=role==='student'?'DIGITAL CAMPUS':'TEACHER WORKSPACE';requestAnimationFrame(animateLens);
window.__haizEditorial={setRole,setTheme,setActive,playFilm,stopFilm,getState:()=>({role,theme,pageIndex,left,running,note,done:[...done]})};
})();
</script></body></html>
