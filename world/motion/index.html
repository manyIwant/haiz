<script>
(()=>{

function hero(top,bottom,s) {return `<div class="artpanel" id="enterCinema" role="button" tabindex="0" aria-label="进入书桌"><div class="art-header"><span>${top}</span><span>01 / 03</span></div>${featureArt}<div class="art-footer"><div><strong>${bottom}</strong><small>${s}</small></div><span class="go">↗</span></div></div>`}
const views=[
 ()=>`<div class="pageanim"><div class="eyebrow">SAT / 24 OCT</div><h1 class="headline">今天。</h1><p class="subtext">你上次编辑的记录和最近安排。</p>${hero('PERSONAL SPACE','我的书桌','继续几何光学笔记')}<div class="space row"><b class="label">最近的事</b><span class="secondary">演示内容</span></div><div class="list"><button class="tile" id="startTask"><div><b>几何光学 · 练习 03</b><p>上次记录 · 继续整理条件</p></div><span class="sym">↗</span></button><button class="tile" id="otherTask"><div><b>英语演讲稿</b><p>待校对 · 本机草稿</p></div><span class="sym">↗</span></button></div><div class="pair"><div class="tiny"><span>课程</span><strong>未连接</strong></div><div class="tiny"><span>通知</span><strong>暂无</strong></div></div></div>`,
 ()=>`<div class="pageanim"><div class="eyebrow">PERSONAL / STUDY</div><h1 class="headline">我的书桌。</h1><p class="subtext">上次的记录保留在这里。</p><div class="space row"><b class="label">当前记录</b><span class="secondary">本机演示</span></div><section class="artpanel" style="height:226px;background:linear-gradient(140deg,var(--paper),var(--bg));cursor:default"><div class="art-header"><span>GEOMETRIC OPTICS</span><span>PRIVATE</span></div>${featureArt}<div class="art-footer"><div><strong>几何光学</strong><small>下一步：整理折射条件</small></div><span class="go">↗</span></div></section><div class="space row"><b class="label">专注计时</b><span class="secondary">单机模式</span></div><div class="tile" style="margin-top:11px"><div><strong id="clock" style="font-size:35px;font-variant-numeric:tabular-nums;font-weight:550">25:00</strong><p>可以暂停，计时仅保存在当前页面</p></div><button class="ghost" id="timerBtn">开始</button></div><div class="list"><button class="tile" id="backHome"><b>返回今天</b><span class="sym">↗</span></button></div></div>`,
 ()=>`<div class="pageanim"><div class="eyebrow">CAMPUS / EXPLORE</div><h1 class="headline">校园。</h1><p class="subtext">地点、活动和社团。</p>${hero('HAINAN MIDDLE SCHOOL','府城校区','地点资料 · 部分内容为演示')}<div class="space row"><b class="label">快速入口</b><span class="secondary">演示内容</span></div><div class="list"><button class="tile" id="mapBtn"><div><b>校园地图</b><p>浏览已有地点资料</p></div><span class="sym">↗</span></button><button class="tile" id="clubsBtn"><div><b>社团活动</b><p>查看公开信息</p></div><span class="sym">↗</span></button></div></div>`
];
let active=0,position=0,velocity=0,target=0,was=performance.now(),pointerId=null,lastPointerX=0,lastPointerTime=0,dragging=false,scrollY=0;
const stepWidth=()=>((dock.getBoundingClientRect().width-10)/3);
function bindViews(){const enter=document.querySelector('#enterCinema');if(enter){enter.addEventListener('click',()=>{if(active===0)playFilm();else setActive(1)});enter.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();enter.click()}})}const timer=document.querySelector('#timerBtn');if(timer)timer.onclick=toggleTimer;for(const id of ['startTask','otherTask']){const e=document.getElementById(id);if(e)e.onclick=playFilm}const b=document.querySelector('#backHome');if(b)b.onclick=()=>setActive(0)}
function setActive(index){active=Math.max(0,Math.min(2,index));target=active*stepWidth();tabs.forEach((b,i)=>b.setAttribute('aria-selected',String(active===i)));page.innerHTML=views[active]();scroller.scrollTop=0;dockWrap.classList.remove('compact');bindViews()}
function springLoop(now){const dt=Math.min(.032,(now-was)/1000);was=now;const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;if(reduced){position=target;velocity=0}else{const k=430,damping=42;velocity+=(target-position)*k*dt;velocity*=Math.exp(-damping*dt);position+=velocity*dt; if(Math.abs(velocity)<.05&&Math.abs(target-position)<.08){position=target;velocity=0}}const scale=1+Math.min(Math.abs(velocity)/1800,.09);lens.style.transform=`translate3d(${position.toFixed(2)}px,0,0) scaleX(${scale.toFixed(4)})`;dock.style.setProperty('--flare',`${(position+stepWidth()*.5)/dock.offsetWidth*100}%`);requestAnimationFrame(springLoop)}
function nearestIndex(clientX){const r=dock.getBoundingClientRect();return clamp(Math.round((clientX-r.left-5-stepWidth()/2)/stepWidth()),0,2)}
dock.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;pointerId=e.pointerId;dragging=false;lastPointerX=e.clientX;lastPointerTime=performance.now();dock.setPointerCapture(pointerId)});
dock.addEventListener('pointermove',e=>{if(pointerId!==e.pointerId)return;const move=e.clientX-lastPointerX;if(Math.abs(move)>5)dragging=true;if(!dragging)return;const r=dock.getBoundingClientRect();target=clamp(e.clientX-r.left-5-stepWidth()/2,0,2*stepWidth());lastPointerTime=performance.now()});
dock.addEventListener('pointerup',e=>{if(pointerId!==e.pointerId)return;const isDrag=dragging;pointerId=null;dragging=false;setActive(nearestIndex(e.clientX))});dock.addEventListener('pointercancel',()=>{pointerId=null;dragging=false;target=active*stepWidth()});
tabs.forEach((b,i)=>b.addEventListener('click',()=>{if(!dragging)setActive(i)}));
scroller.addEventListener('scroll',()=>{const y=scroller.scrollTop;if(y<25||scrollY>y+12)dockWrap.classList.remove('compact');else if(y>90&&y>scrollY+5)dockWrap.classList.add('compact');scrollY=y},{passive:true});
let timeLeft=1500,timerRunning=false,timerId=0,tickTime=0;function updateClock(){const c=document.querySelector('#clock'),b=document.querySelector('#timerBtn');if(c)c.textContent=`${String(Math.floor(timeLeft/60)).padStart(2,'0')}:${String(Math.floor(timeLeft%60)).padStart(2,'0')}`;if(b)b.textContent=timerRunning?'暂停':'开始'}function toggleTimer(){timerRunning=!timerRunning;tickTime=performance.now();if(timerRunning){clearInterval(timerId);timerId=setInterval(()=>{if(!timerRunning)return;let now=performance.now();timeLeft=Math.max(0,timeLeft-(now-tickTime)/1000);tickTime=now;updateClock();if(!timeLeft){timerRunning=false;clearInterval(timerId)}},250)}updateClock()}
function closeSearch(){scrim.classList.remove('open');searchSheet.classList.remove('open')}document.querySelector('#openSearch').onclick=()=>{const open=!searchSheet.classList.contains('open');searchSheet.classList.toggle('open',open);scrim.classList.toggle('open',open);if(open)document.querySelector('#query').focus()};document.querySelector('#closeSearch').onclick=closeSearch;scrim.onclick=closeSearch;
const data=['今日安排','学习记录','我的书桌','校园地图','社团活动','公开通知'];document.querySelector('#query').addEventListener('input',e=>{const q=e.target.value.trim();const result=document.querySelector('#results');result.textContent=q?data.filter(x=>x.includes(q)).join(' · ')||'没有匹配的演示结果':'输入关键词查看演示结果。'});
document.querySelector('#themeBtn').onclick=()=>settings.classList.toggle('open');let saved='porcelain';try{saved=localStorage.getItem('haiz-lucent-theme')||'porcelain'}catch{}
function setTheme(t){if(!['porcelain','obsidian','ocean'].includes(t))t='porcelain';root.dataset.theme=t;document.querySelectorAll('.theme-choice').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===t)));try{localStorage.setItem('haiz-lucent-theme',t)}catch{}}document.querySelectorAll('.theme-choice').forEach(b=>b.onclick=()=>{setTheme(b.dataset.theme);settings.classList.remove('open')});setTheme(saved);setActive(0);requestAnimationFrame(springLoop);
addEventListener('resize',()=>{target=position=active*stepWidth();velocity=0});addEventListener('keydown',e=>{if(e.key==='Escape'){if(isPlaying)skipFilm();closeSearch();settings.classList.remove('open')}if(e.altKey&&['1','2','3'].includes(e.key))setActive(Number(e.key)-1)});
// Deterministic frame hook for genuine MP4 export / regression snapshots.
window.__haiz={seek:(seconds)=>{isPlaying=false;cancelAnimationFrame(raf);film.classList.add('active');film.setAttribute('aria-hidden','false');film.style.opacity='1';filmFrame(seconds)},showApp:()=>{skipFilm()},setTheme,setActive,playFilm,segments:segments.map(s=>s.points.length)};
const params=new URLSearchParams(location.search);if(params.has('frame')){setActive(1);window.__haiz.seek(Number(params.get('frame'))/30)}
})();
</script></div></body></html>
