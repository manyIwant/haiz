/* FIELDNOTES 03 : Content is primary; motion explains continuity. */
#app{--folio:#aeb5c2;--signal:#c77c59;--ink-heavy:var(--ink);--frost:rgba(255,255,255,.26)}

.task-row .taskname{font-size:14px;font-weight:590}
.task-row .taskdetail{font-size:11px}
.task-row .status{font-size:10px}
.quick-ribbon{display:grid;grid-template-columns:1fr 1fr;gap:18px;border-top:1px solid var(--line);padding:19px 0}
.quick-link{display:flex;align-items:flex-start;gap:12px;border:0;background:transparent;text-align:left;color:var(--ink);padding:3px 0}
.quick-link svg{width:20px;height:20px;color:var(--accent);margin-top:2px}
.quick-link strong{display:block;font-size:12px;font-weight:610}
.quick-link small{display:block;font-size:10px;color:var(--muted);margin-top:6px}
/* Studio view, without unrealistic pseudo-photographic shapes */
.study-heading{padding:32px 0 5px}.study-heading h1{font-size:39px;font-weight:620;letter-spacing:-1.9px;margin:9px 0 8px}.study-heading p{font-size:12px;color:var(--muted);margin:0}
.lightfield{margin-top:20px;min-height:352px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;position:relative;isolation:isolate;view-transition-name:work-surface}
.lightfield::before{content:"";position:absolute;inset:0;background:linear-gradient(140deg,rgba(192,209,224,.28),transparent 42%),repeating-linear-gradient(90deg,transparent 0,transparent 45px,var(--line) 46px,transparent 47px);opacity:.44;pointer-events:none}
.lightfield .light-wash{position:absolute;inset:-55px;background:radial-gradient(ellipse 100% 80% at 82% -3%,var(--studio-light,rgba(229,179,123,.26)),transparent 72%);mix-blend-mode:normal;transition:background 1s}
.lightfield .light-slat{position:absolute;width:32%;height:230%;top:-55%;left:60%;background:linear-gradient(90deg,transparent,rgba(247,206,144,.17),transparent);transform:rotate(30deg);filter:blur(14px);pointer-events:none;animation:lightDrift 9s ease-in-out infinite alternate}
@keyframes lightDrift{from{transform:translateX(-18px) rotate(30deg)}to{transform:translateX(13px) rotate(30deg)}}
.lightfield[data-mood=rain]{--studio-light:rgba(121,172,205,.27)}
.lightfield[data-mood=night]{--studio-light:rgba(215,151,99,.26)}
.lightfield .topfolio{position:absolute;top:23px;left:23px;right:23px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:10px;letter-spacing:1.1px;z-index:1}
.lightfield .topfolio span:last-child{color:var(--warm)}
.lightfield .center-clock{position:absolute;left:23px;right:23px;top:94px;text-align:center;z-index:1}
.lightfield .center-clock strong{display:block;font-size:71px;font-weight:400;letter-spacing:-5px;font-variant-numeric:tabular-nums;line-height:1.15}
.lightfield .center-clock small{display:block;margin-top:12px;font-size:11px;color:var(--muted);letter-spacing:1px}
.lightfield .progress-rail{position:absolute;left:26px;right:26px;bottom:88px;height:1px;background:var(--line);z-index:1}
.lightfield .progress-rail span{display:block;height:2px;width:var(--progress,0%);background:var(--accent);transition:width .22s}
.lightfield .mood-bar{position:absolute;bottom:22px;left:23px;right:23px;display:flex;gap:7px;align-items:center;z-index:1}
.mood-bar button{border:1px solid var(--line);border-radius:100px;background:var(--surface2);color:var(--muted);padding:7px 11px;font-size:11px}
.mood-bar button[aria-pressed=true]{color:var(--ink);border-color:var(--accent);background:var(--accentsoft)}
.study-actions{display:flex;gap:11px;margin-top:12px}.study-actions button{flex:1;min-height:44px;border:1px solid var(--line);border-radius:9px;color:var(--ink);background:var(--surface);font-size:12px;font-weight:650}.study-actions button:first-child{background:var(--ink);color:var(--bg)}
.study-options{display:flex;gap:10px;margin-top:16px}.study-options button{border:none;border-bottom:2px solid transparent;background:transparent;color:var(--muted);padding:8px 5px;font-size:12px}.study-options button[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--accent)}
.note-card{border-radius:10px}.note-card textarea{font-size:14px;min-height:120px}
.note-card textarea::placeholder{color:var(--weak)}
/* Gallery / campus: document first, concept art clearly marked */
.campus-lead{position:relative;padding:25px 0 22px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:24px 0 18px}
.campus-lead .title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:18px}
.campus-lead strong{font-size:33px;font-weight:620;line-height:1.22;letter-spacing:-1.2px}
.campus-lead em{font:400 49px/1 Georgia,serif;font-style:normal;color:var(--warm);opacity:.83}
.campus-lead p{font-size:12px;color:var(--muted);max-width:290px;line-height:1.8;margin:15px 0 0}
.campus-photo{margin:17px 0 8px;height:208px;position:relative;overflow:hidden;background:linear-gradient(160deg,#102f38,#52747d 55%,#bbc8c7);border-radius:8px;isolation:isolate}
.campus-photo::before{content:"";position:absolute;inset:0;background:url('../../assets/images/campus/campus_fengqitang.jpg') center 47%/cover no-repeat;opacity:.87;filter:saturate(.66) contrast(.98)}
.campus-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(8,29,41,.68),transparent 58%)}
.campus-photo .photo-label{position:absolute;bottom:17px;left:17px;right:17px;z-index:1;color:#fff;display:flex;justify-content:space-between;gap:15px;align-items:end}
.campus-photo strong{font-size:17px;font-weight:610}.campus-photo small{font-size:10px;color:#e2e8e8;max-width:140px;text-align:right;line-height:1.4}
.campus-entry{transition:transform .18s}.campus-entry:active{transform:translateX(3px)}
/* Glass: lighter/layered on transient controls only, no stacked content glass */
.dock-area{gap:10px}
.dock{height:66px;border-radius:25px;background:color-mix(in srgb,var(--glass) 88%,transparent);box-shadow:0 13px 34px var(--shadow),inset 0 1px 0 var(--frost);backdrop-filter:blur(24px) saturate(148%);-webkit-backdrop-filter:blur(24px) saturate(148%)}
.dock-lens{border-radius:19px;background:linear-gradient(170deg,var(--frost),color-mix(in srgb,var(--accentsoft) 59%,transparent));box-shadow:inset 0 1px 0 var(--glass-line),0 2px 8px color-mix(in srgb,var(--accent) 8%,transparent);transform-origin:center center}
.dock button{gap:4px;font-size:10px;transition:color .23s}.dock button svg{transition:transform .23s cubic-bezier(.12,.9,.2,1),stroke-width .23s}.dock button[aria-current=page] svg{transform:translateY(-2px) scale(1.09);stroke-width:2}
.searchorb{border-radius:21px}
.stage.enter-from-right{animation:enterRight .33s cubic-bezier(.16,.9,.25,1) both}.stage.enter-from-left{animation:enterLeft .33s cubic-bezier(.16,.9,.25,1) both}
@keyframes enterRight{from{opacity:.78;transform:translateX(14px)}to{opacity:1;transform:none}}@keyframes enterLeft{from{opacity:.78;transform:translateX(-14px)}to{opacity:1;transform:none}}
::view-transition-old(work-surface){animation:surface-out .22s ease-in both}::view-transition-new(work-surface){animation:surface-in .44s cubic-bezier(.16,.95,.3,1) both}
@keyframes surface-out{to{opacity:.85}}@keyframes surface-in{from{opacity:.88}to{opacity:1}}
@media(max-width:355px){.editorial-intro h1{font-size:34px}.lightfield .center-clock strong{font-size:59px}.work-feature h2{font-size:21px}}
@media(prefers-reduced-motion:reduce){.light-slat{animation:none!important}}

<style>.search-hit{background:transparent;border:0;border-bottom:1px solid var(--line);display:flex;width:100%;text-align:left;justify-content:space-between;align-items:center;color:var(--ink);padding:13px 3px;font-size:13px}.search-hit span{color:var(--accent)}.searchresults{max-height:280px;overflow:auto}</style></head>
<body><div id="app" data-theme="porcelain"><div class="shell">
<header class="topbar"><div class="brand">HAIZ<span class="period">.</span><small id="brandSub">FIELD NOTES</small></div><div class="top-actions"><button class="mini-action" id="filmBtn" aria-label="播放 HAIZ 品牌动效" title="播放品牌动效"><svg class="icon" viewBox="0 0 24 24"><path d="m9 6 10 6-10 6z"/></svg></button><button class="mini-action profile" id="profileBtn" aria-label="打开设置">我的</button></div></header>
<main class="surface" id="scroller"><div class="stage" id="stage"></div></main>
<div class="dock-area" id="dockArea"><nav class="dock" id="dock" aria-label="主导航"><div class="dock-lens" id="lens"></div></nav><button class="searchorb" id="openSearch" aria-label="打开搜索"><svg class="icon" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.5"/><path d="m16 16 5 5"/></svg></button></div>
<div class="dim" id="dim"></div><section class="searchsheet" id="searchSheet" aria-label="全局搜索" role="dialog"><div class="searchtop"><strong style="font-size:15px">搜索</strong><button class="text-button" id="closeSearch">关闭</button></div><input id="searchInput" aria-label="搜索校园或学习记录" placeholder="搜索作业、记录或地点"/><div class="searchresults" id="searchResults">输入关键词，查看演示内容。</div></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="film-overlay" id="filmOverlay" aria-hidden="true"><iframe id="filmIframe" title="HAIZ 品牌变形动画" loading="lazy"></iframe><button class="film-skip" id="filmSkip">跳过</button></div>
</div></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), root=$('#app'),stage=$('#stage'),scroller=$('#scroller'),dock=$('#dock'),lens=$('#lens'),dockArea=$('#dockArea'),overlay=$('#filmOverlay');
const icons={today:'<path d="M4 10.5 12 4l8 6.5v9H4zM9 19.5v-6h6v6"/>',desk:'<path d="M4 8h16M6 8v12M18 8v12M3 20h18M8 4h8v4"/>',campus:'<path d="m3 7 6-3 6 3 6-3v14l-6 3-6-3-6 3zM9 4v14M15 7v14"/>',profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',team:'<circle cx="8" cy="8" r="3"/><circle cx="17" cy="9" r="2"/><path d="M2 21v-2a6 6 0 0 1 12 0v2M14 16a5 5 0 0 1 8 4"/>',notice:'<path d="M5 4h14v16H5zM8 9h8M8 13h8M8 17h5"/>',grid:'<rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',check:'<path d="m5 12 4 4L19 6"/>',pin:'<path d="M12 21s7-6 7-12A7 7 0 0 0 5 9c0 6 7 12 7 12z"/><circle cx="12" cy="9" r="2"/>'};
const icon=n=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${icons[n]}</svg>`;
const stored=(k,d)=>{try{return localStorage.getItem(k)||d}catch{return d}},save=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};
let announcement={title:stored('haiz-editorial-notice-title',''),body:stored('haiz-editorial-notice-body','')};
let role=stored('haiz-editorial-role','student'),theme=stored('haiz-editorial-theme','porcelain'),pageIndex=0,activeFilter='places',done=new Set(JSON.parse(stored('haiz-editorial-done','[]'))),note=stored('haiz-editorial-note',''),mood=stored('haiz-editorial-mood','day'),left=1500,duration=1500,running=false,endAt=0,interval=0,toastTimer=0,filmTimer=0,filmTarget=1;
let position=0,target=0,velocity=0,lastFrame=performance.now(),dragging=false,pointerDown=false,downX=0,lastDragX=0,lastDragTime=0,releaseVelocity=0,suppressClickUntil=0;
const pages=()=>role==='teacher'?[['概览','grid'],['班级','team'],['公告','notice'],['我的','profile']]:[['今天','today'],['书桌','desk'],['校园','campus'],['我的','profile']];
const date=new Date();const dateText=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'long'}).format(date);
function showToast(txt){const t=$('#toast');t.textContent=txt;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2500)}
function section(title,side){return `<div class="sectionhead"><h2>${title}</h2><span>${side||''}</span></div>`}
function task(id,title,details){return `<button class="task-row ${done.has(id)?'done':''}" data-task="${id}"><span class="task-check">${done.has(id)?icon('check'):''}</span><span class="task-copy"><span class="taskname">${title}</span><span class="taskdetail">${details}</span></span><span class="status">${done.has(id)?'已完成':'待处理'}</span></button>`}
function daily(){const n=[...done].filter(k=>['optics','english','math'].includes(k)).length;return `<div class="editorial-intro"><div><div class="edition">HAIZ / DAILY INDEX<br>${dateText} · 本机演示</div><h1>今天<span style="color:var(--signal)">.</span></h1><p class="subtitle">课程数据尚未接入。这里显示你在本机保存的待办。</p></div><div class="calendar-stamp"><strong>${String(date.getDate()).padStart(2,'0')}</strong><span>${new Intl.DateTimeFormat('en-US',{month:'short'}).format(date).toUpperCase()}</span></div></div><section class="work-feature"><div class="work-top"><span class="folio-caption">CONTINUE / 继续上次记录</span><span class="work-counter">01 — 03</span></div><div class="work-body"><h2>几何光学<br>折射条件</h2><p>上次记录：复核折射条件，再整理比例式。</p></div><div class="work-foot"><button class="under-action" data-action="desk">打开书桌 ${icon('arrow')}</button><small>学习记录<br>示例内容</small></div></section>${section('待处理',`${n} / 3 已完成`)}<div class="row-list">${task('optics','物理 · 几何光学','复核折射条件')}${task('english','英语 · 演讲稿','校对第二部分')}${task('math','数学 · 错题','整理两道题')}</div><div class="progress-track" aria-label="已完成 ${n} 项，共 3 项"><span style="width:${n/3*100}%"></span></div>${section('去哪里','')}<div class="quick-ribbon"><button class="quick-link" data-action="desk">${icon('desk')}<span><strong>专注计时</strong><small>计时与学习记录</small></span></button><button class="quick-link" data-action="campus">${icon('campus')}<span><strong>校园索引</strong><small>建筑与社团</small></span></button></div><div class="quietline"><span></span><span>演示数据仅在这台设备上保存，不代表真实课表或作业。</span></div>`}
function focus(){return `<div class="study-heading"><span class="overline">STUDY / PERSONAL DESK</span><h1>书桌<span style="color:var(--signal)">.</span></h1><p>几何光学 · 练习 03</p></div><section class="lightfield" id="lightfield" data-mood="${mood}"><div class="light-wash"></div><div class="light-slat"></div><div class="topfolio"><span>HAIZ STUDY / 01</span><span>LOCAL MODE</span></div><div class="center-clock"><strong id="timerText">25:00</strong><small id="timerStatus">准备开始</small></div><div class="progress-rail" id="lightProgress"><span></span></div><div class="mood-bar">${[['day','日光'],['rain','雨天'],['night','夜读']].map(([v,n])=>`<button data-mood="${v}" aria-pressed="${mood===v}">${n}</button>`).join('')}</div></section><div class="study-actions"><button data-action="timerToggle" id="timerButton">开始专注</button><button data-action="timerReset">重置</button></div><div class="study-options">${[15,25,45].map(m=>`<button data-duration="${m}" aria-pressed="${duration===m*60}">${m} 分钟</button>`).join('')}</div>${section('学习记录','保存在本机')}<section class="note-card"><textarea id="noteField" maxlength="1800" placeholder="写下已经理解的内容，或者下一步要做的事。">${escapeHtml(note)}</textarea><div class="note-actions"><span id="noteStatus">本机草稿</span><button class="small-save" data-action="saveNote">保存</button></div></section><div class="quietline"><span></span><span>计时不会自动上传，不进行注意力监测。</span></div>`}
function campus(){const samples=activeFilter==='places'?[['01','砚池','地点与校园历史'],['02','凤栖堂','建筑与园林资料'],['03','陶然亭','地点介绍']]:activeFilter==='clubs'?[['01','社团目录','分类与公开招新信息'],['02','校园活动','已公开活动资讯']]:[['01','学校新闻','公开报道与来源'],['02','校园记录','图文与历史档案']];return `<div class="editorial-intro"><div><div class="edition">FUCHENG CAMPUS / INDEX</div><h1>校园<span style="color:var(--signal)">.</span></h1><p class="subtitle">海南中学 · 府城校区</p></div><div class="calendar-stamp" style="padding-top:9px"><span>海口</span><strong style="font-size:25px;letter-spacing:-1px">20°N</strong></div></div><div class="campus-lead"><div class="title-row"><strong>一个地点。<br>不止一个故事。</strong><em>01</em></div><p>建筑、社团与公开记录，按内容索引。地图及照片的可靠性以来源标注为准。</p></div><div class="campus-photo"><div class="photo-label"><strong>校园影像</strong><small>仓库公开图像 · 非实时地图<br>请勿据此导航</small></div></div><div class="segmentbar" style="margin-top:24px">${[['places','地点'],['clubs','社团'],['updates','记录']].map(([k,v])=>`<button data-filter="${k}" aria-pressed="${activeFilter===k}">${v}</button>`).join('')}</div>${section('内容索引',activeFilter==='places'?'建筑 / 地点':'未连接学校数据')}${samples.map(([n,t,s])=>`<button class="campus-entry" data-place="${t}"><span class="index">${n}</span><span><strong>${t}</strong><p>${s}</p></span>${icon('arrow')}</button>`).join('')}<div class="quietline"><span></span><span>真实校内服务尚未接入。校内照片来源与使用授权仍需复核。</span></div>`}
function prefs(){return `<div class="masthead"><div><span class="overline">本机设置</span><h1 class="mainheading">设置</h1></div></div>${section('外观','立即生效')}<div class="themechips">${[['porcelain','Porcelain'],['obsidian','Obsidian'],['ocean','Ocean']].map(([v,l])=>`<button data-theme-choice="${v}" aria-pressed="${theme===v}">${l}</button>`).join('')}</div>${section('工作空间','演示切换')}<div class="role-toggle"><button data-role="student" aria-pressed="${role==='student'}">学生</button><button data-role="teacher" aria-pressed="${role==='teacher'}">教师</button></div><div class="prefgroup"><div class="pref"><div><label>品牌动效</label><p>可单独播放；不影响每次打开 App</p></div><button class="small-save" data-action="film">播放</button></div><div class="pref"><div><label>减少动效</label><p>跟随设备系统设置</p></div><span class="status" id="reduceStatus">自动</span></div><div class="pref"><div><label>学习记录</label><p>仅保存在当前浏览器，不会上传</p></div><span class="status">本机</span></div><div class="pref"><div><label>版本</label><p>Fieldnotes 03 · 交互设计原型</p></div><span class="status">Prototype</span></div></div>`}
function teacherHome(){return `<div class="editorial-intro"><div><div class="edition">HAIZ / FACULTY DESK<br>本机演示 · 未连接学校服务器</div><h1>工作台<span style="color:var(--signal)">.</span></h1><p class="subtitle">待办与公告统一在这里查看。</p></div><div class="calendar-stamp"><strong>${String(date.getDate()).padStart(2,'0')}</strong><span>${new Intl.DateTimeFormat('en-US',{month:'short'}).format(date).toUpperCase()}</span></div></div><section class="work-feature"><div class="work-top"><span class="folio-caption">NEXT / 工作事项</span><span class="work-counter">TEACHER</span></div><div class="work-body"><h2>班级通知<br>和作业整理</h2><p>先检查接收范围与内容，再决定是否发布。</p></div><div class="work-foot"><button class="under-action" data-action="classroom">打开班级 ${icon('arrow')}</button><small>演示模式<br>未连接服务</small></div></section>${section('待处理','虚构示例')}<div class="row-list"><div class="actionrow"><div><strong>班级公告</strong><p>创建并预览草稿</p></div><button data-action="announcements">打开</button></div><div class="actionrow"><div><strong>作业收取</strong><p>扫描硬件尚未接入</p></div><button data-action="classroom">查看</button></div><div class="actionrow"><div><strong>教室显示</strong><p>ClassIsland 连接状态未验证</p></div><button data-action="screen">详情</button></div></div>${section('连接状态','')}<div class="quick-ribbon"><div class="quick-link">${icon('team')}<span><strong>身份</strong><small>本机演示</small></span></div><div class="quick-link">${icon('grid')}<span><strong>同步</strong><small>尚未连接</small></span></div></div>`}
function teacherClass(){return `<div class="masthead"><div><span class="overline">班级工具 · 本机演示</span><h1 class="mainheading">班级</h1></div></div><div class="teacher-kpis"><div class="kpi"><span>课表来源</span><strong style="font-size:22px">未连接</strong><em>ClassIsland 模拟适配器</em></div><div class="kpi"><span>同步状态</span><strong style="font-size:22px">本机</strong><em>仅供原型演示</em></div></div>${section('班级工具','')}<div class="row-list"><div class="actionrow"><div><strong>作业收取统计</strong><p>学号扫描功能处于规划阶段</p></div><button data-action="scan">了解</button></div><div class="actionrow"><div><strong>班级通知</strong><p>发布前检查班级与有效时间</p></div><button data-action="announcements">查看</button></div><div class="actionrow"><div><strong>课堂屏幕</strong><p>需要授权的 Windows 教室设备</p></div><button data-action="screen">说明</button></div></div>`}
function teacherNotice(){return `<div class="masthead"><div><span class="overline">创建通知 · 本机演示</span><h1 class="mainheading">公告</h1></div></div><div class="note-card" style="padding:20px"><div class="overline" style="margin-bottom:12px">本机草稿 · 未发布</div><input id="announcementTitle" maxlength="80" placeholder="公告标题" value="${escapeHtml(announcement.title)}" style="background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:12px;width:100%;color:var(--ink);margin-bottom:10px"><textarea id="announcementBody" placeholder="公告内容（演示）" maxlength="3000">${escapeHtml(announcement.body)}</textarea><div class="note-actions"><span>不发送到真实班级</span><button class="small-save" data-action="previewNotice">预览</button></div></div>${section('发布流程','')}<div class="row-list">${[['01','确认班级和可见范围'],['02','检查正文与有效时间'],['03','审核后发布']].map(([a,b])=>`<div class="actionrow"><strong><span style="color:var(--warm);font-size:11px;margin-right:12px">${a}</span>${b}</strong></div>`).join('')}</div>`}
const screens=()=>role==='teacher'?[teacherHome,teacherClass,teacherNotice,prefs]:[daily,focus,campus,prefs];
let activeTransition=null;
function setActive(index,opts={}){
 const previous=pageIndex;
 const next=Math.min(3,Math.max(0,index));
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const mayMorph=!opts.initial&&!reduced&&previous!==next&&((previous===0&&next===1)||(previous===1&&next===0))&&role==='student';
 const update=()=>{
   pageIndex=next;stage.innerHTML=screens()[pageIndex]();attachPage();
   stage.classList.remove('in','enter-from-right','enter-from-left');
   if(!opts.initial&&!reduced&&!mayMorph){void stage.offsetWidth;stage.classList.add(previous>next?'enter-from-left':'enter-from-right')}
   scroller.scrollTop=0;dockArea.classList.remove('compact');
   dock.querySelectorAll('button[data-tab]').forEach((b,i)=>b.setAttribute('aria-current',i===pageIndex?'page':'false'));
   target=pageIndex*stepWidth();if(opts.initial){position=target;velocity=0}
 };
 if(activeTransition){try{activeTransition.skipTransition()}catch{}activeTransition=null}
 if(mayMorph&&document.startViewTransition){
   activeTransition=document.startViewTransition(update);
   activeTransition.finished.finally(()=>{activeTransition=null});
 }else update();
}
function setRole(r){role=r==='teacher'?'teacher':'student';save('haiz-editorial-role',role);$('#brandSub').textContent=role==='student'?'FIELD NOTES':'FACULTY DESK';renderDock();setActive(0,{initial:true});showToast(role==='student'?'学生工作空间':'教师工作空间 · 演示')}
function setTheme(t){if(!['porcelain','obsidian','ocean'].includes(t))t='porcelain';theme=t;root.dataset.theme=t;save('haiz-editorial-theme',t);document.querySelector('meta[name=theme-color]').content=t==='porcelain'?'#f4f2ee':t==='ocean'?'#0c2029':'#10151e';stage.querySelectorAll('[data-theme-choice]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.themeChoice===t)))}
function attachPage(){stage.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));stage.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{const n=b.dataset.task;if(done.has(n))done.delete(n);else done.add(n);save('haiz-editorial-done',JSON.stringify([...done]));const oldScroll=scroller.scrollTop;stage.innerHTML=screens()[pageIndex]();attachPage();scroller.scrollTop=oldScroll});stage.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{activeFilter=b.dataset.filter;stage.innerHTML=campus();attachPage()});stage.querySelectorAll('[data-mood]').forEach(b=>b.onclick=()=>{mood=b.dataset.mood;save('haiz-editorial-mood',mood);const field=$('#lightfield');if(field)field.dataset.mood=mood;stage.querySelectorAll('[data-mood]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.mood===mood)))});stage.querySelectorAll('[data-duration]').forEach(b=>b.onclick=()=>{if(running){showToast('请先暂停计时');return}duration=Number(b.dataset.duration)*60;left=duration;stage.innerHTML=focus();attachPage()});stage.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>setRole(b.dataset.role));stage.querySelectorAll('[data-theme-choice]').forEach(b=>b.onclick=()=>setTheme(b.dataset.themeChoice));const nt=$('#announcementTitle'),nb=$('#announcementBody');if(nt)nt.addEventListener('input',()=>{announcement.title=nt.value;save('haiz-editorial-notice-title',announcement.title)});if(nb)nb.addEventListener('input',()=>{announcement.body=nb.value;save('haiz-editorial-notice-body',announcement.body)});const ta=$('#noteField');if(ta)ta.addEventListener('input',()=>{$('#noteStatus').textContent='尚未保存'});renderTimer();const reduce=$('#reduceStatus');if(reduce)reduce.textContent=matchMedia('(prefers-reduced-motion: reduce)').matches?'已减少':'跟随系统'}
function action(kind){switch(kind){case 'desk':setActive(1);break;case 'campus':setActive(2);break;case 'settings':setActive(3);break;case 'film':playFilm();break;case 'timerToggle':toggleTimer();break;case 'timerReset':running=false;left=duration;renderTimer();break;case 'saveNote':note=$('#noteField').value;save('haiz-editorial-note',note);$('#noteStatus').textContent='已保存在本机';showToast('记录已保存');break;case 'classroom':setActive(1);break;case 'announcements':setActive(2);break;case 'map':showToast('当前为资料索引原型');break;case 'scan':showToast('HAIZ SCAN 尚未接入');break;case 'screen':showToast('需要连接授权的教室设备');break;case 'previewNotice':{const title=$('#announcementTitle').value.trim(),text=$('#announcementBody').value.trim();if(!title||!text){showToast('请填写标题和正文');return}showToast('预览完成 · 未发布');break}default:showToast('演示功能，尚未连接数据源')}}
function toggleTimer(){if(running){left=Math.max(0,(endAt-performance.now())/1000);running=false}else{endAt=performance.now()+left*1000;running=true}renderTimer()}
function renderTimer(){if(running){left=Math.max(0,(endAt-performance.now())/1000);if(left===0){running=false;showToast('计时结束')}}const text=$('#timerText'),stat=$('#timerStatus'),dial=$('#dial'),btn=$('#timerButton');if(text)text.textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(Math.floor(left%60)).padStart(2,'0')}`;if(stat)stat.textContent=running?'专注中':left===duration?'准备开始':'已暂停';if(dial)dial.style.setProperty('--progress',`${(1-left/duration)*100}%`);const prog=$('#lightProgress');if(prog)prog.style.setProperty('--progress',`${(1-left/duration)*100}%`);if(btn)btn.textContent=running?'暂停':'开始专注'}interval=setInterval(()=>{if(running)renderTimer()},200);document.addEventListener('visibilitychange',()=>{if(document.hidden&&running){left=Math.max(0,(endAt-performance.now())/1000);running=false;renderTimer()}});
function renderDock(){dock.querySelectorAll('button[data-tab]').forEach(b=>b.remove());pages().forEach(([text,key],i)=>{const b=document.createElement('button');b.dataset.tab=String(i);b.innerHTML=icon(key)+`<span>${text}</span>`;b.setAttribute('aria-label',text);b.onclick=()=>{if(!pointerDown&&!dragging&&performance.now()>suppressClickUntil)setActive(i)};dock.appendChild(b)})}
function stepWidth(){return (dock.getBoundingClientRect().width-10)/4}
function animateLens(now){const dt=Math.min(.033,(now-lastFrame)/1000);lastFrame=now;const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;if(reduced){position=target;velocity=0}else{const stiffness=790,damping=48;velocity+=((target-position)*stiffness-damping*velocity)*dt;position+=velocity*dt;if(Math.abs(velocity)<.08&&Math.abs(target-position)<.1){position=target;velocity=0}}const distortion=1+Math.min(.12,Math.abs(velocity)/3400);lens.style.transform=`translate3d(${position.toFixed(2)}px,0,0) scale(${distortion.toFixed(4)},${(1-(distortion-1)*.20).toFixed(4)})`;requestAnimationFrame(animateLens)}
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));function dragTarget(x){const r=dock.getBoundingClientRect();return clamp(x-r.left-5-stepWidth()/2,0,stepWidth()*3)}
dock.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;pointerDown=true;dragging=false;downX=lastDragX=e.clientX;lastDragTime=performance.now();releaseVelocity=0,suppressClickUntil=0;dock.setPointerCapture(e.pointerId)});
dock.addEventListener('pointermove',e=>{if(!pointerDown)return;const delta=e.clientX-downX;if(Math.abs(delta)>6)dragging=true;if(dragging){const now=performance.now(),elapsed=Math.max(8,now-lastDragTime);releaseVelocity=(e.clientX-lastDragX)/elapsed;lastDragX=e.clientX;lastDragTime=now;target=dragTarget(e.clientX)}});
dock.addEventListener('pointerup',e=>{if(!pointerDown)return;pointerDown=false;if(dragging){suppressClickUntil=performance.now()+200;const projected=dragTarget(e.clientX)+clamp(releaseVelocity*55,-45,45);dragging=false;setActive(Math.round(projected/stepWidth()))}else{setActive(Math.round(dragTarget(e.clientX)/stepWidth()))}});
dock.addEventListener('pointercancel',()=>{pointerDown=false;dragging=false;target=pageIndex*stepWidth()});
let previousY=0;scroller.addEventListener('scroll',()=>{const y=scroller.scrollTop;if(y<32||previousY>y+7)dockArea.classList.remove('compact');else if(y>125&&y>previousY+8)dockArea.classList.add('compact');previousY=y},{passive:true});
const dim=$('#dim'),searchSheet=$('#searchSheet');function openSearch(){dim.classList.add('open');searchSheet.classList.add('open');$('#searchInput').focus()}function closeSearch(){dim.classList.remove('open');searchSheet.classList.remove('open')}$('#openSearch').onclick=openSearch;$('#closeSearch').onclick=closeSearch;dim.onclick=closeSearch;
const resources=['几何光学','英语演讲稿','数学错题','校园地图','砚池','凤栖堂','陶然亭','社团索引','发布通知','学习记录'];$('#searchInput').oninput=e=>{const val=e.target.value.trim(),items=resources.filter(x=>x.includes(val));$('#searchResults').innerHTML=val?(items.length?items.map(x=>`<button class="search-hit" data-hit="${x}">${x} <span>↗</span></button>`).join(''):'没有匹配的演示内容'):'输入关键词，查看演示内容。';$('#searchResults').querySelectorAll('[data-hit]').forEach(el=>el.onclick=()=>{const t=el.dataset.hit;closeSearch();if(/几何|学习|数学|英语/.test(t))setActive(1);else if(/公告|发布/.test(t))setActive(role==='teacher'?2:0);else setActive(2)})};
const filmFrame=$('#filmIframe');function stopFilm(){clearTimeout(filmTimer);overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');filmFrame.src='about:blank'}
function playFilm(){if(matchMedia('(prefers-reduced-motion:reduce)').matches){showToast('已减少动效');return}stopFilm();filmTarget=role==='student'?1:0;overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');filmFrame.src='./archive/identity-01.html';filmFrame.onload=()=>{try{filmFrame.contentWindow.__haiz.playFilm()}catch{showToast('品牌片无法加载');stopFilm()}};filmTimer=setTimeout(()=>{stopFilm();setActive(filmTarget)},3950)}$('#filmBtn').onclick=playFilm;$('#filmSkip').onclick=()=>{stopFilm();setActive(filmTarget)};
$('#profileBtn').onclick=()=>setActive(3);window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(overlay.classList.contains('open'))stopFilm();closeSearch()}if(e.altKey&&['1','2','3','4'].includes(e.key))setActive(Number(e.key)-1)});
window.addEventListener('resize',()=>{target=position=pageIndex*stepWidth();velocity=0});
function escapeHtml(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
renderDock();setTheme(theme);setActive(0,{initial:true});$('#brandSub').textContent=role==='student'?'FIELD NOTES':'FACULTY DESK';requestAnimationFrame(animateLens);
window.__haizEditorial={setRole,setTheme,setActive,playFilm,stopFilm,getState:()=>({role,theme,pageIndex,left,running,note,mood,announcement,done:[...done]})};
})();
</script></body></html>
