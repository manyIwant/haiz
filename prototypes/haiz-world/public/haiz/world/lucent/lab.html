<!doctype html><html lang="zh-CN" class="haiz-native" data-lucent-theme="porcelain"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HAIZ Dock Lab</title><link rel="stylesheet" href="../apps/mobile/mobile-shell.css"><style>body{font:16px system-ui;margin:0;padding:32px!important;min-height:150vh}main{max-width:850px;margin:40px auto}section{padding:30px;background:var(--surface-raised);border-radius:24px;margin:24px 0}button,select{min-height:44px;font:inherit}label{display:block;margin:20px 0}h1{font-size:42px}p{line-height:1.8}output{font-variant-numeric:tabular-nums}#main{height:200px}</style><main><h1>Dock Lab</h1><p>同一透镜，三组参数。点击、拖动与快速改变目标会保留当前位置和速度。这里是参数实验台，不是业务页面。</p><section><label>弹簧<select id="profile"><option value="balanced">Balanced · 390 / 35 · 默认候选</option><option value="precise">Precise · 520 / 44</option><option value="soft">Soft · 250 / 25</option></select></label><label>主题<select id="theme"><option value="porcelain">Porcelain</option><option value="obsidian">Obsidian</option><option value="ocean">Ocean</option></select></label><button id="stress">20 次中途改变目标</button><p><output id="metrics"></output></p></section><section id="main" data-testid="haiz-main"><h2 id="route">书桌</h2><p>用底部导航比较运动；向下滚动查看收缩，向上滚动恢复。右上角可开启减少动效与低耗电。</p></section><a href="../index.html#study">返回实际书桌</a></main><script type="module">import{mountLucent}from'./dock.js';location.hash='study';const dock=mountLucent();window.LUCENT_LAB=dock;const $=s=>document.querySelector(s);$('#profile').onchange=e=>dock.state.profile=e.target.value;$('#theme').onchange=e=>dock.setTheme(e.target.value);$('#stress').onclick=async()=>{for(let i=0;i<20;i++){document.querySelector(i%2?'#dock-campus':'#dock-today').click();await new Promise(r=>setTimeout(r,45));}};addEventListener('hashchange',()=>$('#route').textContent=location.hash.slice(1));setInterval(()=>$('#metrics').textContent=`位置 ${dock.state.x.toFixed(1)}px · 速度 ${dock.state.velocity.toFixed(1)}px/s · 目标 ${dock.state.target.toFixed(1)}px`,100);</script></html>
