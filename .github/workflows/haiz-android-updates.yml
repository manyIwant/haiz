name: HAIZ Android · Stable signed in-app updates

on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/haiz-android-updates.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name, e.g. 1.0.1 (must increase)'
        required: true
        type: string
      version_code:
        description: 'Android versionCode, integer greater than any published version'
        required: true
        type: string
      release_notes:
        description: 'Short release notes displayed inside HAIZ'
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify updater and Flutter build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get
      - name: Dart static analysis
        working-directory: app
        run: flutter analyze
      - name: Update integrity and UI regression tests
        working-directory: app
        run: flutter test test/haiz_app_updates_test.dart test/widget_test.dart test/ui_smoke_test.dart

  publish:
    name: Sign one stable APK and publish the next version
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      VERSION_CODE: ${{ inputs.version_code }}
      NOTES: ${{ inputs.release_notes }}
      KEYSTORE_BASE64: ${{ secrets.HAIZ_ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.HAIZ_ANDROID_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.HAIZ_ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.HAIZ_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Guard release identity, version order and signing credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] && (( VERSION_CODE > 10 ))
          [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" &&
             -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]] || {
            echo "::error::Configure the four HAIZ_ANDROID_* repository secrets before publishing."
            exit 1
          }
          TAG="haiz-android-v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists and is immutable."
            exit 1
          fi
          current_code="$(gh api "repos/$GITHUB_REPOSITORY/contents/updates/latest.json" --jq .content 2>/dev/null | tr -d '\n' | base64 -d | jq -r .versionCode 2>/dev/null || echo 0)"
          [[ "$current_code" =~ ^[0-9]+$ ]] || exit 1
          (( VERSION_CODE > current_code )) || {
            echo "::error::Version code must exceed the most recent published version."
            exit 1
          }
      - name: Restore user-owned signing key only inside the runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/haiz-android"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/haiz-release.jks"
          chmod 600 "$RUNNER_TEMP/haiz-release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/haiz-release.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
            > "$HOME/.config/haiz-android/signing.properties"
          chmod 600 "$HOME/.config/haiz-android/signing.properties"
      - name: Build stable signed Android APK
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          flutter pub get
          flutter build apk --release --build-name "$VERSION" --build-number "$VERSION_CODE"
          test -s build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/HAIZ-Pocket-Android.apk"
          SDK_BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose "$GITHUB_WORKSPACE/HAIZ-Pocket-Android.apk"
          sha256sum "$GITHUB_WORKSPACE/HAIZ-Pocket-Android.apk" > "$GITHUB_WORKSPACE/SHA256SUMS.txt"
      - name: Publish immutable release, then update HAIZ discovery manifest
        shell: bash
        run: |
          set -euo pipefail
          TAG="haiz-android-v${VERSION}"
          gh release create "$TAG" HAIZ-Pocket-Android.apk SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "HAIZ Android ${VERSION}" --notes "$NOTES" --latest
          SIZE="$(stat -c '%s' HAIZ-Pocket-Android.apk)"
          SHA="$(sha256sum HAIZ-Pocket-Android.apk | awk '{print $1}')"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/HAIZ-Pocket-Android.apk"
          mkdir -p updates
          jq -n --arg packageId 'space.haiz.app.preview' \
            --arg name "$VERSION" --argjson code "$VERSION_CODE" \
            --arg url "$URL" --arg hash "$SHA" --argjson bytes "$SIZE" \
            --arg notes "$NOTES" \
            '{packageId:$packageId,versionName:$name,versionCode:$code,apkUrl:$url,sha256:$hash,sizeBytes:$bytes,notes:$notes}' \
            > updates/latest.json
          CURRENT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/updates/latest.json" --jq .sha 2>/dev/null || true)"
          CONTENT="$(base64 -w0 updates/latest.json)"
          jq -n --arg message "chore(updates): publish Android $VERSION" \
            --arg content "$CONTENT" --arg sha "$CURRENT_SHA" \
            '{message:$message,content:$content,branch:"main"} +
              (if $sha == "" then {} else {sha:$sha} end)' \
            | gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/updates/latest.json" --input -
          echo "Updated updates/latest.json for Android $VERSION."
