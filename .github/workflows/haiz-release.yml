name: HAIZ verified mobile candidate release
on:
  push:
    tags: ['haiz-v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: haiz-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix world test
      - run: npm --prefix world run test:server
      - run: node --test world/tests/flow-server.test.mjs world/tests/pilot-server.test.mjs world/lucent/tests/motion.test.mjs
      - name: Reject mismatched release tag
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: node world/apps/mobile/scripts/verify-version.mjs
  native-qa:
    needs: verify
    uses: ./.github/workflows/haiz-mobile-qa.yml
    secrets: inherit
  publish:
    needs: [verify, native-qa]
    if: startsWith(github.ref, 'refs/tags/haiz-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: haiz-android-candidate-apk
          path: candidate/android
      - uses: actions/download-artifact@v4
        with:
          name: haiz-ios-candidate-unsigned-ipa
          path: candidate/ios
      - uses: actions/download-artifact@v4
        with:
          pattern: haiz-*-ui-evidence
          path: candidate/evidence
      - name: Inspect exactly the tested packages and prepare reviewable assets
        run: python release/package-candidate.py
      - name: Create new preview release; never replace old assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-artifacts/* --verify-tag --prerelease --title "HAIZ LUCENT 0.5.0 · 测试候选版" --notes-file release/NOTES.zh-CN.md
