# Archived, immutable RC1 build. Run manually for QA artifacts only.
# Production PWA publishing is owned by pocket-autopublish.yml.
# Never recreate the fixed pocket-v1.5.2-rc.1 release on ordinary main pushes.
name: HAIZ Pocket 1.5.2 RC1 · Manual build and verification

on:
  workflow_dispatch:

concurrency:
  group: pocket-v1-rc-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter-check:
    name: Analyze and test all Flutter features
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        working-directory: app
        run: flutter pub get
      - name: Analyze whole app
        working-directory: app
        run: flutter analyze
      - name: Run all unit & widget regression tests
        working-directory: app
        run: flutter test --reporter expanded

  academic-test:
    name: Academic backend & permissions tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install backend modules
        working-directory: services/academic
        run: npm ci --ignore-scripts
      - name: Backend tests
        working-directory: services/academic
        run: npm test

  web-build:
    name: Build standalone Flutter Web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Flutter packages
        working-directory: app
        run: flutter pub get
      - name: Web release
        working-directory: app
        run: flutter build web --release --base-href / --no-web-resources-cdn --no-wasm-dry-run
      - name: Package web
        run: |
          cd app/build/web
          zip -qr "$GITHUB_WORKSPACE/HAIZ-Pocket-Web-1.5.2-rc.1.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-v1-rc-web
          path: HAIZ-Pocket-Web-1.5.2-rc.1.zip
          if-no-files-found: error

  android-qa:
    name: QA-signed Android APK (not production signed)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Flutter packages
        working-directory: app
        run: flutter pub get
      - name: Build separately installable QA-signed release variant
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/applicationId = "space.haiz.app.preview"/applicationId = "space.haiz.app.qa"/' android/app/build.gradle.kts
          grep -q 'applicationId = "space.haiz.app.qa"' android/app/build.gradle.kts
          qa_home=$(mktemp -d)
          # Gradle can retain a background daemon in this disposable QA HOME.
          # Cleanup is best-effort and must not mask a successfully built APK.
          trap 'rm -rf "$qa_home" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$qa_home/.config/haiz-android"
          keytool -genkeypair -noprompt -keystore "$qa_home/qa.jks" -alias qa -keyalg RSA -keysize 2048 -validity 14 -storepass syntheticqa -keypass syntheticqa -dname 'CN=HAIZ QA only'
          printf 'storeFile=%s\nstorePassword=syntheticqa\nkeyAlias=qa\nkeyPassword=syntheticqa\n' "$qa_home/qa.jks" > "$qa_home/.config/haiz-android/signing.properties"
          JAVA_TOOL_OPTIONS="-Duser.home=$qa_home" flutter build apk --release --no-pub
          test -s build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/HAIZ-Pocket-Android-1.5.2-rc.1-QA.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-v1-rc-android-qa
          path: HAIZ-Pocket-Android-1.5.2-rc.1-QA.apk
          if-no-files-found: error

  ios-unsigned:
    name: Build iOS share extension and unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        working-directory: app
        run: flutter pub get
      - name: Compile iOS without Apple signing
        working-directory: app
        run: flutter build ios --release --no-codesign --no-pub
      - name: Package IPA and verify embedded Share Extension
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          app="build/ios/iphoneos/Runner.app"
          test -d "$app"
          test -d "$app/PlugIns/HaizShareExtension.appex"
          mkdir -p "$GITHUB_WORKSPACE/ios-unsigned/Payload"
          ditto "$app" "$GITHUB_WORKSPACE/ios-unsigned/Payload/Runner.app"
          cd "$GITHUB_WORKSPACE/ios-unsigned"
          zip -qry "$GITHUB_WORKSPACE/HAIZ-Pocket-iOS-1.5.2-rc.1-UNSIGNED.ipa" Payload
          test -s "$GITHUB_WORKSPACE/HAIZ-Pocket-iOS-1.5.2-rc.1-UNSIGNED.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-v1.5.2-rc-ios-unsigned
          path: HAIZ-Pocket-iOS-1.5.2-rc.1-UNSIGNED.ipa
          if-no-files-found: error

