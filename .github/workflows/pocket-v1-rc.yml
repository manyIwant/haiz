name: HAIZ Pocket 1.0 RC · Build, verify, release

on:
  push:
    branches:
      - main
      - release/pocket-v1.0.0-rc.1
    paths:
      - 'app/**'
      - 'services/academic/**'
      - 'supabase/**'
      - 'docs/releases/pocket-v1.0.0-rc.1.md'
      - '.github/workflows/pocket-v1-rc.yml'
  workflow_dispatch:

concurrency:
  group: pocket-v1-rc-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  flutter-check:
    name: Analyze and test all Flutter features
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        working-directory: app
        run: flutter pub get
      - name: Analyze whole app
        working-directory: app
        run: flutter analyze
      - name: Run all unit & widget regression tests
        working-directory: app
        run: flutter test --reporter expanded

  academic-test:
    name: Academic backend & permissions tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install backend modules
        working-directory: services/academic
        run: npm ci --ignore-scripts
      - name: Backend tests
        working-directory: services/academic
        run: npm test

  web-build:
    name: Build standalone Flutter Web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Flutter packages
        working-directory: app
        run: flutter pub get
      - name: Web release
        working-directory: app
        run: flutter build web --release --base-href / --no-web-resources-cdn --no-wasm-dry-run
      - name: Package web
        run: |
          cd app/build/web
          zip -qr "$GITHUB_WORKSPACE/HAIZ-Pocket-Web-1.0.0-rc.1.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-v1-rc-web
          path: HAIZ-Pocket-Web-1.0.0-rc.1.zip
          if-no-files-found: error

  android-qa:
    name: QA-signed Android APK (not production signed)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Flutter packages
        working-directory: app
        run: flutter pub get
      - name: Build separately installable QA-signed release variant
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/applicationId = "space.haiz.app.preview"/applicationId = "space.haiz.app.qa"/' android/app/build.gradle.kts
          grep -q 'applicationId = "space.haiz.app.qa"' android/app/build.gradle.kts
          qa_home=$(mktemp -d)
          trap 'rm -rf "$qa_home"' EXIT
          mkdir -p "$qa_home/.config/haiz-android"
          keytool -genkeypair -noprompt -keystore "$qa_home/qa.jks" -alias qa -keyalg RSA -keysize 2048 -validity 14 -storepass syntheticqa -keypass syntheticqa -dname 'CN=HAIZ QA only'
          printf 'storeFile=%s\nstorePassword=syntheticqa\nkeyAlias=qa\nkeyPassword=syntheticqa\n' "$qa_home/qa.jks" > "$qa_home/.config/haiz-android/signing.properties"
          JAVA_TOOL_OPTIONS="-Duser.home=$qa_home" flutter build apk --release --no-pub
          test -s build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/HAIZ-Pocket-Android-1.0.0-rc.1-QA.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-v1-rc-android-qa
          path: HAIZ-Pocket-Android-1.0.0-rc.1-QA.apk
          if-no-files-found: error

  publish:
    name: Publish GitHub prerelease after green gates
    runs-on: ubuntu-latest
    needs: [flutter-check, academic-test, web-build, android-qa]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pocket-v1-rc-web
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: pocket-v1-rc-android-qa
          path: dist
      - name: Verify artifacts and checksums
        run: |
          test -s dist/HAIZ-Pocket-Web-1.0.0-rc.1.zip
          test -s dist/HAIZ-Pocket-Android-1.0.0-rc.1-QA.apk
          cd dist
          sha256sum HAIZ-Pocket-Web-1.0.0-rc.1.zip HAIZ-Pocket-Android-1.0.0-rc.1-QA.apk > SHA256SUMS.txt
      - name: Create immutable Pocket RC prerelease and attach downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="pocket-v1.0.0-rc.1"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already published. Refusing to replace release assets."
            exit 1
          fi
          gh release create "$TAG" dist/HAIZ-Pocket-Web-1.0.0-rc.1.zip dist/HAIZ-Pocket-Android-1.0.0-rc.1-QA.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "HAIZ Pocket 1.0.0 RC1 · 首次整合候选发行版" \
            --notes-file docs/releases/pocket-v1.0.0-rc.1.md \
            --prerelease \
            --verify-tag=false


  ios-unsigned:
    name: Build unsigned HAIZ Pocket iOS IPA (manual signing required)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Show toolchain versions
        run: |
          xcodebuild -version
          flutter --version
          pod --version
      - name: Resolve Flutter dependencies
        working-directory: app
        run: flutter pub get
      - name: Build iPhone app without Apple signing
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign --no-pub
          test -d build/ios/iphoneos/Runner.app
          test -f build/ios/iphoneos/Runner.app/Runner
          file build/ios/iphoneos/Runner.app/Runner
          mkdir -p "$GITHUB_WORKSPACE/ipa/Payload"
          ditto build/ios/iphoneos/Runner.app "$GITHUB_WORKSPACE/ipa/Payload/Runner.app"
          (
            cd "$GITHUB_WORKSPACE/ipa"
            /usr/bin/zip -q -r "$GITHUB_WORKSPACE/HAIZ-Pocket-main-unsigned.ipa" Payload
          )
          test -s "$GITHUB_WORKSPACE/HAIZ-Pocket-main-unsigned.ipa"
          (
            cd "$GITHUB_WORKSPACE"
            shasum -a 256 HAIZ-Pocket-main-unsigned.ipa > HAIZ-Pocket-main-unsigned.sha256
            printf 'Source commit: %s\nFlutter: 3.47.8\nSigning: UNSIGNED; cannot install without device-specific Apple signing\n' "$GITHUB_SHA" > HAIZ-Pocket-main-build-info.txt
          )
      - name: Upload unsigned IPA as test artifact
        uses: actions/upload-artifact@v4
        with:
          name: haiz-pocket-ios-unsigned
          path: |
            HAIZ-Pocket-main-unsigned.ipa
            HAIZ-Pocket-main-unsigned.sha256
            HAIZ-Pocket-main-build-info.txt
          if-no-files-found: error
          retention-days: 14
