name: HAIZ Flow browser evidence
on:
  push:
    branches: [feat/haiz-flow-handoff]
  pull_request:
    paths: ['world/flow/**', 'world/tests/flow*', 'world/scripts/classroom-server.mjs', '.github/workflows/haiz-flow.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.57.0
        working-directory: world
      - run: npx playwright install chromium
        working-directory: world
      - run: npm --prefix world test
      - run: npm --prefix world run test:server
      - run: npm --prefix world run test:flow
      - run: node world/tests/flow-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flow-evidence-${{ matrix.os }}
          path: |
            docs/haiz-flow/screenshots
            docs/haiz-flow/browser-results.json
