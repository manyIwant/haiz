name: HAIZ Android candidate · local signing only

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable semver (e.g. 1.5.0)'
        required: true
        type: string
      version_code:
        description: 'Version code above installed v1.4.0 / 2008 (e.g. 2100)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate:
    name: Compile production-ID APK for PRIVATE LOCAL resigning
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
      VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || exit 1
          (( VERSION_CODE > 2008 )) || {
            echo "::error::Must exceed archived HAIZ v1.4.0 code 2008."
            exit 1
          }
      - name: Prepare ephemeral CI-only signing (NEVER distribute this artifact)
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/haiz-candidate"
          mkdir -p "$tmp/.config/haiz-android"
          keytool -genkeypair -noprompt -keystore "$tmp/candidate.jks" \
            -alias candidate -keyalg RSA -keysize 2048 -validity 3 \
            -storepass ephemeral-candidate-only -keypass ephemeral-candidate-only \
            -dname 'CN=NOT FOR DISTRIBUTION'
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$tmp/candidate.jks" ephemeral-candidate-only candidate ephemeral-candidate-only \
            > "$tmp/.config/haiz-android/signing.properties"
          echo "JAVA_TOOL_OPTIONS=-Duser.home=$tmp" >> "$GITHUB_ENV"
      - name: Build release APK with real package ID (temporary signature)
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test test/haiz_app_updates_test.dart
          flutter build apk --release --build-name "$VERSION" --build-number "$VERSION_CODE"
          test -s build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/HAIZ-Pocket-Android-CANDIDATE.apk"
          echo "::warning::Candidate is NOT signed with the permanent key; do not install or publish."
      - uses: actions/upload-artifact@v4
        with:
          name: haiz-android-candidate-${{ inputs.version }}-${{ inputs.version_code }}
          path: HAIZ-Pocket-Android-CANDIDATE.apk
          if-no-files-found: error
          retention-days: 2
