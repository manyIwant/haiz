name: HAIZ Pocket Lamp Publish Staging

on:
  push:
    branches:
      - feat/pocket-lamp-entry-20261030
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage:
    name: Build upstream React Lamp and existing Flutter workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
        working-directory: app
      - name: Analyze native Lamp WebView bridge
        run: flutter analyze lib/ui/pocket_lamp_entrance.dart
        working-directory: app
      - name: Verify Lamp entry and local fallback
        run: flutter test test/lamp_entry_test.dart test/pocket_lamp_entrance_test.dart --reporter expanded
        working-directory: app
      - name: Build Flutter Web for isolated Pages path
        run: flutter build web --release --base-href /lamp-preview/app/ --no-web-resources-cdn --no-wasm-dry-run
        working-directory: app
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install React Lamp build dependencies
        run: npm install --no-audit --no-fund
        working-directory: app/web-lamp-react
      - name: Fetch official Lamp and build React gateway
        run: npm run build
        working-directory: app/web-lamp-react
      - name: Stage complete release in separate branch (not main)
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/web/main.dart.js
          test -s app/build/web/index.html
          mkdir -p "$RUNNER_TEMP/lamp-react-dist" "$RUNNER_TEMP/lamp-flutter-dist"
          cp -R app/web-lamp-react/dist/. "$RUNNER_TEMP/lamp-react-dist/"
          cp -R app/build/web/. "$RUNNER_TEMP/lamp-flutter-dist/"
          test -s "$RUNNER_TEMP/lamp-react-dist/index.html"
          test -s "$RUNNER_TEMP/lamp-flutter-dist/main.dart.js"
          git fetch origin preview/pocket-lamp-staged-20261030
          git switch -C preview/pocket-lamp-staged-20261030 origin/preview/pocket-lamp-staged-20261030
          rm -rf lamp-preview
          mkdir -p lamp-preview/app
          cp -R "$RUNNER_TEMP/lamp-flutter-dist/." lamp-preview/app/
          cp -R "$RUNNER_TEMP/lamp-react-dist/." lamp-preview/
          touch lamp-preview/.nojekyll
          test -s lamp-preview/app/main.dart.js
          test -s lamp-preview/index.html
          test -n "$(find lamp-preview/assets -name '*.js' -print -quit)"
          git add -f lamp-preview/
          git -c user.name='HAIZ Preview Builder' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(preview): stage compiled Lamp Flutter Web'
          git push origin HEAD:refs/heads/preview/pocket-lamp-staged-20261030
          echo "Staged release tree under lamp-preview/ on preview/pocket-lamp-staged-20261030"
