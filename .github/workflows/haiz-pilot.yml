name: HAIZ Pilot HTTPS and design evidence
on:
  pull_request:
    paths: ['world/flow/**', 'world/pilot/**', 'world/stillroom/**', 'world/tests/**', '.github/workflows/haiz-pilot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: chromium
          - os: windows-latest
            browser: chromium
          - os: ubuntu-latest
            browser: webkit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.57.0
        working-directory: world
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: world
      - run: node --check world/pilot/server.mjs
      - run: npm --prefix world test
      - run: npm --prefix world run test:server
      - run: node --test world/tests/flow-server.test.mjs world/tests/pilot-server.test.mjs
      - run: node world/tests/pilot-browser.mjs
        env:
          HAIZ_BROWSER: ${{ matrix.browser }}
      - if: matrix.browser == 'chromium'
        run: node world/tests/stillroom-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-${{ matrix.os }}-${{ matrix.browser }}
          path: |
            docs/haiz-pilot/screenshots
            docs/haiz-pilot/*results.json
            docs/haiz-pilot/browser-*.json
