name: Regenerate HAIZ brand icons

on:
  push:
    branches: [main]
    paths:
      - 'assets/brand/haiz-emblem-source.jpg'
      - 'scripts/generate-brand-icons.py'
      - '.github/workflows/brand-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==11.3.0'
      - run: python scripts/generate-brand-icons.py
      - name: Commit generated icon files
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo 'All icon files are already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-preview app/web app/android/app/src/main/res/mipmap-* \
            app/ios/Runner/Assets.xcassets/AppIcon.appiconset \
            app/macos/Runner/Assets.xcassets/AppIcon.appiconset \
            lamp-preview/app assets/walk/icon.svg assets/brand/haiz-emblem-512.png favicon.ico
          git commit -m 'chore(brand): sync HAIZ icons across all platforms'
          git push
