name: HAIZ classroom operations reliability
on:
  pull_request:
    paths: ['world/classroom/**', 'world/pilot/server.mjs', 'world/flow/app.js', 'world/tests/classroom-*', 'world/homework-*.js', 'world/bridge-client.js', 'world/scripts/classroom-server.mjs', 'world/tests/operations*', 'world/package.json', '.github/workflows/haiz-operations.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.57.0
        working-directory: world
      - run: npx playwright install --with-deps chromium
        working-directory: world
      - run: npm --prefix world test
      - run: npm --prefix world run test:server
      - run: node --test world/tests/flow-server.test.mjs world/tests/pilot-server.test.mjs
      - run: npm --prefix world run test:classroom
      - run: node world/tests/operations-browser.mjs
      - run: node world/tests/classroom-pilot-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classroom-operations-evidence
          path: docs/haiz-operations/evidence/
