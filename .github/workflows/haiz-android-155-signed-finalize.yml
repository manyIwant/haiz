name: HAIZ Android 1.5.5 · Verify and finalize locally signed APK
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: haiz-android-v1.5.5
      EXPECTED_SHA: 568b3c5f71f275c3d733cd086a59a934b56ec466cf6101ed5ca53818f76767c4
      SIGNER_CERT_SHA: fec8d3962d1d35cf6a975722734da7d525e166421994c5d175ab71fc3c89d169
    steps:
      - name: Check successful Android and five-gate QA builds
        shell: bash
        run: |
          set -euo pipefail
          for run in 41304003589 41304006891; do
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .conclusion)" = success
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .head_sha)" = 52fe3cf5b57eb9ad9208c9572d3d1a6c9ff8d48e
          done
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[]|select(.tag_name=="haiz-android-v1.5.5" and .draft==true)]|length')" = 1
      - name: Download and verify all 18 signed pieces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p parts dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'HAIZ-Pocket-Android.apk.part-*' --dir parts --clobber
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'SHA256SUMS.txt' --dir dist --clobber
          test "$(find parts -maxdepth 1 -name 'HAIZ-Pocket-Android.apk.part-*' -type f | wc -l)" -eq 18
          for i in $(seq 0 17); do
            part=$(printf 'parts/HAIZ-Pocket-Android.apk.part-%03d' "$i")
            test -s "$part"
            cat "$part" >> dist/HAIZ-Pocket-Android.apk
          done
          test "$(stat -c '%s' dist/HAIZ-Pocket-Android.apk)" -eq 109932630
          printf '%s  %s\n' "$EXPECTED_SHA" 'HAIZ-Pocket-Android.apk' | (cd dist && sha256sum -c -)
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - name: Verify package version and original HAIZ signing certificate
        shell: bash
        run: |
          set -euo pipefail
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BT/aapt"
          test -x "$BT/apksigner"
          "$BT/apksigner" verify --print-certs dist/HAIZ-Pocket-Android.apk | grep -Fi "$SIGNER_CERT_SHA"
          "$BT/aapt" dump badging dist/HAIZ-Pocket-Android.apk | grep -F "package: name='space.haiz.app.preview' versionCode='2105' versionName='1.5.5'"
      - name: Upload final signed APK, remove temporary pieces and publish
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" dist/HAIZ-Pocket-Android.apk --repo "$GITHUB_REPOSITORY" --clobber
          RELEASE_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[]|select(.tag_name=="haiz-android-v1.5.5")|.id')"
          test -n "$RELEASE_ID"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" --jq '.[]|select(.name=="HAIZ-Pocket-Android.apk")|.size' | grep -qx '109932630'
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" --jq '.[]|select(.name|startswith("HAIZ-Pocket-Android.apk.part-"))|.id'); do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id" >/dev/null
          done
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
