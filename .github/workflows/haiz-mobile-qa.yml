name: HAIZ mobile startup smoke QA

on:
  pull_request:
    paths:
      - 'world/**'
      - '.github/workflows/haiz-mobile-qa.yml'
  push:
    branches: ['fix/mobile-startup-icons-v040']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  web-assets:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: world/apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: world/apps/mobile/package-lock.json
      - run: npm ci
      - run: bash -n tests/android-smoke.sh tests/ios-smoke.sh && node --check tests/android-ui.mjs
      - run: npm run sync
      - run: node tests/verify-assets.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/generate-icons.py
      - name: Check generated icons on both platforms
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          i=Path('ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png')
          a=Path('android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png')
          assert Image.open(i).size == (1024,1024)
          assert Image.open(i).mode == 'RGB'
          assert Image.open(a).size == (324,324)
          print('PASS: iOS opaque 1024 icon and Android adaptive launcher.')
          PY

  android-build:
    needs: web-assets
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.3.0
      - run: npm ci
        working-directory: world/apps/mobile
      - run: npm run sync && node tests/verify-assets.mjs && python scripts/generate-icons.py
        working-directory: world/apps/mobile
      - name: Select optional protected preview signing
        run: node scripts/prepare-signing.mjs
        working-directory: world/apps/mobile
        env:
          HAIZ_ANDROID_KEYSTORE_BASE64: ${{ secrets.HAIZ_ANDROID_KEYSTORE_BASE64 }}
          HAIZ_KEYSTORE_PASSWORD: ${{ secrets.HAIZ_KEYSTORE_PASSWORD }}
          HAIZ_KEY_ALIAS: ${{ secrets.HAIZ_KEY_ALIAS }}
          HAIZ_KEY_PASSWORD: ${{ secrets.HAIZ_KEY_PASSWORD }}
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        env:
          HAIZ_KEYSTORE_PASSWORD: ${{ secrets.HAIZ_KEYSTORE_PASSWORD }}
          HAIZ_KEY_ALIAS: ${{ secrets.HAIZ_KEY_ALIAS }}
          HAIZ_KEY_PASSWORD: ${{ secrets.HAIZ_KEY_PASSWORD }}
        working-directory: world/apps/mobile/android
      - name: Inspect the actual APK and record signing certificate
        working-directory: world/apps/mobile
        run: |
          mkdir -p candidate
          python tests/verify-package.py android/app/build/outputs/apk/debug/app-debug.apk --commit "$GITHUB_SHA" --version "$(node -p 'require("./package.json").version')" --output candidate/package-report.json
          TOOL="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$TOOL" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk > candidate/signature.txt
          cp android/app/build/outputs/apk/debug/app-debug.apk candidate/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: haiz-android-candidate-apk
          path: world/apps/mobile/candidate/
          if-no-files-found: error

  android-emulator:
    needs: android-build
    strategy:
      fail-fast: false
      matrix:
        api: [33, 35]
    timeout-minutes: 35
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: haiz-android-candidate-apk
          path: mobile-candidate
      - name: Enable runner KVM for hardware accelerated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=30
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          HAIZ_QA_APK: mobile-candidate/app-debug.apk
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: bash world/apps/mobile/tests/android-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haiz-android-api-${{ matrix.api }}-ui-evidence
          path: mobile-test-output/

  ios-simulator:
    timeout-minutes: 40
    needs: web-assets
    runs-on: macos-15
    defaults:
      run:
        working-directory: world/apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.3.0
      - run: npm ci
      - run: npm run sync && node tests/verify-assets.mjs && python scripts/generate-icons.py
      - name: Choose a supported iPhone simulator
        run: |
          xcrun simctl list devices available -j > simulator-devices.json
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          info=json.load(open('simulator-devices.json'))
          phones=[d for devices in info['devices'].values() for d in devices if d['state']=='Shutdown' and 'iPhone' in d['name']]
          if not phones: raise SystemExit('No supported iPhone simulator installed')
          print('HAIZ_SIM='+phones[0]['udid'])
          PY
      - name: Build and exercise real WKWebView on simulator
        run: bash tests/ios-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haiz-ios-ui-evidence
          path: world/apps/mobile/mobile-test-output/
      - name: Build unsigned iPhone arm64 IPA for testing
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme HAIZDevice -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/ios-device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build
          mkdir -p build/unsigned/Payload
          cp -R build/ios-device/Build/Products/Release-iphoneos/App.app build/unsigned/Payload/HAIZ.app
          cd build/unsigned
          ditto -c -k --keepParent Payload HAIZ-Study-iOS-unsigned.ipa
          cd ../..
          python tests/verify-package.py build/unsigned/HAIZ-Study-iOS-unsigned.ipa --commit "$GITHUB_SHA" --version "$(node -p 'require("./package.json").version')" --output build/unsigned/package-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: haiz-ios-candidate-unsigned-ipa
          path: |
            world/apps/mobile/build/unsigned/HAIZ-Study-iOS-unsigned.ipa
            world/apps/mobile/build/unsigned/package-report.json
          if-no-files-found: error
