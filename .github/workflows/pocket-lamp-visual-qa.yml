name: HAIZ Lamp Browser Visual QA

on:
  push:
    branches:
      - feat/pocket-lamp-entry-20261030
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Capture real deployed Flutter canvas
        run: |
          mkdir -p lamp-screenshots
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const url = 'https://haiz.space/lamp-preview/?qa=0079dc361b';
          for (const [name, viewport] of [
            ['desktop', { width: 1440, height: 900 }],
            ['phone', { width: 390, height: 844 }],
          ]) {
            const page = await browser.newPage({ viewport, deviceScaleFactor: 1 });
            const errors = [];
            page.on('pageerror', err => errors.push(err.message));
            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(9000);
            await page.screenshot({ path: `lamp-screenshots/${name}.png`, fullPage: true });
            const views = await page.locator('flutter-view').count();
            console.log(JSON.stringify({ name, url: page.url(), flutterViews: views, pageErrors: errors }));
            if (!views || errors.length) process.exitCode = 1;
            await page.close();
          }
          await browser.close();
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haiz-lamp-visual-qa
          path: lamp-screenshots/
          if-no-files-found: error
          retention-days: 7
